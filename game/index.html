  el.addEventListener('touchend', set(false), {passive:false});

// Virtual joystick: drag within the circular base to move the direction keys,

function setupJoystick() {
  const base = document.getElementById('tc-joystick');
  const knob = document.getElementById('tc-joystick-knob');
  const maxR = 34;
  const deadzone = 10;
  let activePointerId = null;

  function setKnob(dx, dy) {
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }
  function resetKeys() {
    keys['ArrowLeft'] = false; keys['ArrowRight'] = false;
    keys['ArrowUp'] = false; keys['ArrowDown'] = false;
  }
  function updateFromPointer(clientX, clientY) {
    const rect = base.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    let dx = clientX - cx, dy = clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) { dx = dx/dist*maxR; dy = dy/dist*maxR; }
    setKnob(dx, dy);
    resetKeys();
    if (dx > deadzone) keys['ArrowRight'] = true;
    else if (dx < -deadzone) keys['ArrowLeft'] = true;
    if (dy > deadzone) keys['ArrowDown'] = true;
    else if (dy < -deadzone) keys['ArrowUp'] = true;
  }
  function endDrag(e) {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    setKnob(0, 0);
    resetKeys();
  }

  base.addEventListener('pointerdown', e => {
    e.preventDefault();
    activePointerId = e.pointerId;
    base.setPointerCapture(e.pointerId);
    updateFromPointer(e.clientX, e.clientY);
  });
  base.addEventListener('pointermove', e => {
    if (e.pointerId !== activePointerId) return;
    updateFromPointer(e.clientX, e.clientY);
  });
  base.addEventListener('pointerup', endDrag);
  base.addEventListener('pointercancel', endDrag);
}

function selectOrBuyWeapon(key) {
  const w = WEAPONS[key];
  if (!w) return;
  if (player.unlockedWeapons.has(key)) {
    player.weapon = w;
  } else if (w.price && player.gold >= w.price) {
    player.gold -= w.price;
    player.unlockedWeapons.add(key);
    player.weapon = w;
  }
}
function selectOrBuyShield(key) {
  const s = SHIELDS[key];
  if (!s) return;
  if (player.unlockedShields.has(key)) {
    player.shield = s;
  } else if (s.price && player.gold >= s.price) {
    player.gold -= s.price;
    player.unlockedShields.add(key);
    player.shield = s;
  }
}
function selectOrBuyArmor(key) {
  const a = ARMORS[key];
  if (!a) return;
  if (player.unlockedArmors.has(key)) {
    player.armor = a;
  } else if (a.price && player.gold >= a.price) {
    player.gold -= a.price;
    player.unlockedArmors.add(key);
    player.armor = a;
  }
}
function shopItemCost(item) {
  return item.baseCost + item.costStep * player.shopLevels[item.id];
}
function buyShopItem(id) {
  const item = SHOP_ITEMS.find(s => s.id === id);
  if (!item) return;
  const level = player.shopLevels[id];
  if (level >= item.maxLevel) return;
  const cost = shopItemCost(item);
  if (player.gold < cost) return;
  player.gold -= cost;
  player.shopLevels[id]++;
  if (id === 'weapon') player.weaponDmgBonus += 4;
  else if (id === 'armor') { player.maxHp += 20; player.hp = Math.min(player.maxHp, player.hp + 20); }
  else if (id === 'mana') { player.maxFp += 20; player.fp = Math.min(player.maxFp, player.fp + 20); }
  else if (id === 'hpflask') { player.maxHpPotions++; player.hpPotions = Math.min(player.maxHpPotions, player.hpPotions + 1); }
  else if (id === 'fpflask') { player.maxFpPotions++; player.fpPotions = Math.min(player.maxFpPotions, player.fpPotions + 1); }
}

// ---------- Enemies ----------
// Every themed level's monsters are one of two shared behavior archetypes, just
// reskinned and re-statted: "ground" patrols its spawn platform and telegraphs an
// attack (melee bump or a thrown projectile); "flyer" hovers and either dives into
// melee or casts a projectile from range. Bosses are a bigger, tougher instance of
// either archetype that also fires an extra AoE burst attack periodically.
let enemies = [];
function spawnEnemiesForLevel(id) {
  const def = LEVEL_DEFS[id];
  enemies = def.makeEnemies ? def.makeEnemies() : [];
}

function makeGroundEnemy(x, groundY, cfg) {
  const w = cfg.w || 38, h = cfg.h || 40;
  // Patrol range is clamped to the platform it spawns on, so it turns around at the
  // edge instead of walking straight out over a gap.
  const home = platforms.find(p => x >= p.x && x <= p.x + p.w) || {x:0, w:LEVEL_WIDTH};
  return {
    type:'bomb', kind: cfg.kind, name: cfg.name || '', isBoss: !!cfg.isBoss,
    x, y:groundY-h, w, h, vx:0, vy:0,
    hp:cfg.hp, maxHp:cfg.hp, dmg:cfg.dmg, speed:cfg.speed, dir:-1,
    homeMinX: home.x, homeMaxX: home.x + home.w - w,
    onGround:true, hitFlash:0, exploding:false, explodeTimer:0,
    attackCooldown:0, telegraph:false, attackWindup:0, dead:false, groundY,
    attackMode: cfg.attackMode || 'ranged',
    projectileKind: cfg.projectileKind || 'bomb',
    colorMain: cfg.colorMain || '#3a3a44', colorAccent: cfg.colorAccent || '#e8e8ee',
    bossBurstCooldown: 0,
    buried: !!cfg.buried, emerging: false, emergeTimer: 0, emergeDuration: 0,
    signature: cfg.signature || null
  };
}

function makeFlyingEnemy(x, y, cfg) {
  const w = cfg.w || 34, h = cfg.h || 26;
  return {
    type:'drone', kind: cfg.kind, name: cfg.name || '', isBoss: !!cfg.isBoss,
    x, y, baseY:y, w, h, vx:0, vy:0,
    hp:cfg.hp, maxHp:cfg.hp, dmg:cfg.dmg, speed:cfg.speed, dir:-1,
    hitFlash:0, attackCooldown:0, dead:false, phase:Math.random()*Math.PI*2,
    dashTimer:0, dashing:false, dashDir:0, charging:false, chargeTimer:0,
    attackMode: cfg.attackMode || 'dash',
    projectileKind: cfg.projectileKind || 'bomb',
    colorMain: cfg.colorMain || '#555c66', colorAccent: cfg.colorAccent || '#e8453f',
    bossBurstCooldown: 0,
    signature: cfg.signature || null, galeDashesLeft: 0, galeFollowup: false
  };
}

let arenaWave = 0;
let arenaWaveDelay = 40;   // frames until the next wave spawns, once the current one is cleared
let arenaBanner = '';      // brief "第 N 波" / "首領來襲！" text shown when a wave spawns
let arenaBannerTimer = 0;

// Frames remaining to show the "all four bosses defeated" congratulations banner -
// set once, the moment the last of the four story bosses falls.
let worldCompleteBanner = 0;

// Later waves aren't just bigger - each monster is individually tougher too, so the
// arena keeps getting harder even once the enemy count caps out at 10.
function applyArenaScaling(en) {
  const scale = 1 + (arenaWave - 1) * 0.08;
  en.hp = Math.round(en.hp * scale);
  en.maxHp = en.hp;
  en.dmg = Math.round(en.dmg * scale);
}

function spawnArenaWave() {
  arenaWave++;
  const isBossWave = arenaWave % 5 === 0;
  if (isBossWave) {
    const boss = ARENA_BOSS_FACTORIES[Math.floor(Math.random() * ARENA_BOSS_FACTORIES.length)]();
    applyArenaScaling(boss);
    enemies = [boss];
    arenaBanner = `第 ${arenaWave} 波：首領來襲－${boss.name}！`;
  } else {
    const count = Math.min(10, 2 + arenaWave);
    const spawned = [];
    for (let i = 0; i < count; i++) {
      const factory = ARENA_GRUNT_FACTORIES[Math.floor(Math.random() * ARENA_GRUNT_FACTORIES.length)];
      const x = 150 + Math.random() * (ARENA_WIDTH - 500);
      const en = factory(x);
      applyArenaScaling(en);
      spawned.push(en);
    }
    enemies = spawned;
    arenaBanner = `第 ${arenaWave} 波`;
  }
  arenaBannerTimer = 150;
}

function updateArena() {
  if (currentLevelId !== 'arena') return;
  if (arenaBannerTimer > 0) arenaBannerTimer--;
  const cleared = enemies.length === 0 || enemies.every(en => en.dead && !en.exploding);
  if (cleared) {
    if (arenaWaveDelay > 0) arenaWaveDelay--;
    else { spawnArenaWave(); arenaWaveDelay = 100; }
  }
}

// ---------- Coins ----------
const COIN_VALUE = 5;
let coins = [];
function spawnCoins() {
  coins = [];
  for (const p of platforms) {
    const n = Math.max(2, Math.floor(p.w / 140));
    for (let i = 0; i < n; i++) {
      coins.push({
        x: p.x + (p.w / (n + 1)) * (i + 1),
        y: p.y - 34,
        r: 9, collected: false, phase: Math.random() * Math.PI * 2
      });
    }
  }
}
function updateCoins() {
  const hb = {x: player.x, y: player.y, w: player.w, h: player.h};
  for (const c of coins) {
    if (c.collected) continue;
    if (rectsOverlap(hb, {x:c.x-c.r, y:c.y-c.r, w:c.r*2, h:c.r*2})) {
      c.collected = true;
      player.gold += COIN_VALUE;
      spawnSparkleAt(c.x, c.y, '#ffd35c');
    }
  }
}
function drawCoins() {
  for (const c of coins) {
    if (c.collected) continue;
    const bob = Math.sin(frame * 0.08 + c.phase) * 3;
    ctx.save();
    ctx.translate(c.x - camera.x, c.y + bob);
    ctx.fillStyle = '#f5c542';
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#c98a1f';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#fff3c9';
    ctx.beginPath(); ctx.arc(-2.5, -2.5, c.r*0.35, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ---------- Gadget drops (grunts have a chance to drop their signature item) ----------
let gadgetDrops = [];
let gadgetPickupBanner = null; // {text, timer} - a brief "獲得專屬裝備" toast
function spawnGadgetDrop(x, y, gadgetKey) {
  gadgetDrops.push({ x, y, w:20, h:20, vy:-3, gadgetKey, collected:false, phase:Math.random()*Math.PI*2 });
}
function updateGadgetDrops() {
  const hb = {x: player.x, y: player.y, w: player.w, h: player.h};
  for (const d of gadgetDrops) {
    if (d.collected) continue;
    d.vy = Math.min(6, d.vy + 0.4);
    d.y += d.vy;
    const floor = groundHeightAt(d.x) - d.h/2;
    if (d.y > floor) { d.y = floor; d.vy = 0; }
    if (rectsOverlap(hb, {x:d.x-d.w/2, y:d.y-d.h/2, w:d.w, h:d.h})) {
      d.collected = true;
      const g = GADGETS[d.gadgetKey];
      if (!player.unlockedGadgets.has(d.gadgetKey)) {
        player.unlockedGadgets.add(d.gadgetKey);
        if (!player.equippedGadget) player.equippedGadget = d.gadgetKey;
        spawnSparkleAt(d.x, d.y, g.color);
        gadgetPickupBanner = { text: `獲得專屬裝備：${g.name}！`, timer: 150 };
      } else {
        player.gold += 10;
        spawnSparkleAt(d.x, d.y, '#f5c542');
      }
    }
  }
  gadgetDrops = gadgetDrops.filter(d => !d.collected);
  if (gadgetPickupBanner) {
    gadgetPickupBanner.timer--;
    if (gadgetPickupBanner.timer <= 0) gadgetPickupBanner = null;
  }
}
function drawGadgetDrops() {
  for (const d of gadgetDrops) {
    if (d.collected) continue;
    const g = GADGETS[d.gadgetKey];
    const bob = Math.sin(frame * 0.1 + d.phase) * 3;
    ctx.save();
    ctx.translate(d.x - camera.x, d.y + bob);
    const pulse = 0.6 + 0.4 * Math.sin(frame * 0.15 + d.phase);
    ctx.globalAlpha = 0.35 * pulse;
    ctx.fillStyle = g.color;
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = g.color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -10); ctx.lineTo(10, 0); ctx.lineTo(0, 10); ctx.lineTo(-10, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}
function drawGadgetPickupBanner() {
  if (!gadgetPickupBanner) return;
  const alpha = Math.min(1, gadgetPickupBanner.timer / 30);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe08a';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText(gadgetPickupBanner.text, W/2, 118);
  ctx.textAlign = 'left';
  ctx.restore();
}

// ---------- Particles (hits, explosions, pickups) ----------
let particles = [];
function addParticle(p) { particles.push(p); }

// ---------- Projectiles (thrown or cast by enemies) ----------
let projectiles = [];
function spawnProjectile(x, y, vx, vy, dmg, kind) {
  projectiles.push({ x, y, vx, vy, r: 6, life: 150, dmg, kind: kind || 'bomb' });
}
function throwBomb(en) {
  spawnProjectile(en.x + en.w/2, en.y + en.h/2 - 12, en.dir * 4.6, -8.6, en.dmg, en.projectileKind);
}
function spawnCastProjectile(en, dirX, dirY) {
  const speed = 5.5;
  spawnProjectile(en.x + en.w/2, en.y + en.h/2, dirX*speed, dirY*speed, en.dmg, en.projectileKind);
}
const PROJECTILE_PALETTE = {
  lava:     { c1:'#ffd35c', c2:'#ff5a3c' },
  fireball: { c1:'#ffe08a', c2:'#ff3b1a' },
  ink:      { c1:'#c9a2ff', c2:'#3a1f5c' },
  thorn:    { c1:'#c8f08a', c2:'#3d7a2a' },
  feather:  { c1:'#fff3d6', c2:'#a9793f' },
  wind:     { c1:'#e8f6ff', c2:'#7fb8dd' }
};
function updateProjectiles() {
  for (const b of projectiles) {
    if (b.kind === 'bomb' || b.kind === 'lava') b.vy += GRAVITY * 0.65; // lobbed arc, others fly straight
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    let landed = false;
    for (const p of platforms) {
      if (b.x > p.x && b.x < p.x + p.w && b.y + b.r >= p.y && b.vy >= 0) { landed = true; break; }
    }
    const hitPlayer = rectsOverlap({x:b.x-b.r, y:b.y-b.r, w:b.r*2, h:b.r*2}, player);
    if (landed || hitPlayer || b.life <= 0 || b.y > H + 300) {
      explodeAt(b.x, b.y, 70, b.dmg);
      b.dead = true;
    }
  }
  projectiles = projectiles.filter(b => !b.dead);
}
// ---------- Aiming (the bow fires wherever the player is pointing, not just forward) ----------
// Tracked in world space so it stays correct as the camera scrolls. Defaults to
// straight ahead until the player actually points somewhere, so every other weapon
// (and the bow before it's aimed at least once) behaves exactly as before.
let mouseWorldX = null, mouseWorldY = null;
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseWorldX = (e.clientX - rect.left) * (W / rect.width) + camera.x;
  mouseWorldY = (e.clientY - rect.top) * (H / rect.height);
});
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 0) return;
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  mouseWorldX = (t.clientX - rect.left) * (W / rect.width) + camera.x;
  mouseWorldY = (t.clientY - rect.top) * (H / rect.height);
}, {passive:true});
function getAimVector() {
  if (mouseWorldX === null) return { x: player.facing, y: 0 };
  const px = player.x + player.w/2, py = player.y + player.h/2 - 4;
  const dx = mouseWorldX - px, dy = mouseWorldY - py;
  const len = Math.hypot(dx, dy) || 1;
  return { x: dx/len, y: dy/len };
}

// ---------- Player projectiles (the bow's arrows) ----------
let playerProjectiles = [];
function spawnPlayerArrow(dmg, opts) {
  const speed = (opts && opts.speed) || 10.5;
  const pierce = !!(opts && opts.pierce);
  let dir = { x: player.facing, y: 0 };
  if (player.weapon.ranged) dir = getAimVector();
  playerProjectiles.push({
    x: player.x + player.w/2, y: player.y + player.h/2 - 4,
    vx: dir.x * speed, vy: dir.y * speed, r: 4, life: 90, dmg,
    pierce, hitSet: pierce ? new Set() : null
  });
}
function spawnGadgetProjectile(g) {
  const dir = { x: player.facing, y: 0 };
  playerProjectiles.push({
    x: player.x + player.w/2, y: player.y + player.h/2 - 4,
    vx: dir.x * g.speed, vy: g.arc ? -g.speed*0.6 : 0,
    r: g.arc ? 7 : 5, life: g.arc ? 130 : 80, dmg: g.dmg,
    pierce:false, hitSet:null,
    homing: !!g.homing, speed: g.speed, arc: !!g.arc, explodeRadius: g.explodeRadius || 0,
    gadgetColor: g.color
  });
}
function gadgetBombBurst(x, y) {
  for (let i = 0; i < 14; i++) {
    const ang = (Math.PI*2*i)/14;
    addParticle({type:'spark', x, y,
      vx:Math.cos(ang)*5, vy:Math.sin(ang)*5, life:22, maxLife:22, size:4+Math.random()*3, color:'#ff9d4d'});
  }
}
function updatePlayerProjectiles() {
  for (const b of playerProjectiles) {
    if (b.arc) b.vy += GRAVITY * 0.55;
    if (b.homing) {
      let target = null, bestD = 260;
      for (const en of enemies) {
        if (en.dead || en.buried) continue;
        const d = Math.hypot((en.x+en.w/2)-b.x, (en.y+en.h/2)-b.y);
        if (d < bestD) { bestD = d; target = en; }
      }
      if (target) {
        const dx = (target.x+target.w/2)-b.x, dy = (target.y+target.h/2)-b.y;
        const len = Math.hypot(dx,dy) || 1;
        // steer toward a fixed cruise speed, not the projectile's own current speed -
        // otherwise a shot fired away from its target decelerates toward zero instead
        // of actually turning around, since its own (shrinking) speed keeps feeding back in
        b.vx += (dx/len*b.speed - b.vx) * 0.12;
        b.vy += (dy/len*b.speed - b.vy) * 0.12;
      }
    }
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    if (b.arc && !b.dead) {
      for (const p of platforms) {
        if (b.x > p.x && b.x < p.x + p.w && b.y + b.r >= p.y && b.vy >= 0) {
          resolveSpecialAoeHit(b.dmg, b.explodeRadius, b.x, b.y);
          gadgetBombBurst(b.x, b.y);
          b.dead = true;
          break;
        }
      }
    }
    if (!b.dead) {
      for (const en of enemies) {
        if (en.dead || en.buried) continue;
        if (b.hitSet && b.hitSet.has(en)) continue;
        if (rectsOverlap({x:b.x-b.r, y:b.y-b.r, w:b.r*2, h:b.r*2}, {x:en.x, y:en.y, w:en.w, h:en.h})) {
          damageEnemy(en, b.dmg);
          if (b.arc) { resolveSpecialAoeHit(b.dmg*0.6, b.explodeRadius, b.x, b.y); gadgetBombBurst(b.x, b.y); }
          if (b.pierce) b.hitSet.add(en);
          else { b.dead = true; break; }
        }
      }
    }
    if (b.life <= 0 || b.x < -60 || b.x > LEVEL_WIDTH + 60 || b.y < -500 || b.y > H + 500) b.dead = true;
  }
  playerProjectiles = playerProjectiles.filter(b => !b.dead);
}
function drawPlayerProjectiles() {
  for (const b of playerProjectiles) {
    if (b.gadgetColor) {
      ctx.save();
      ctx.translate(b.x - camera.x, b.y);
      ctx.fillStyle = b.gadgetColor;
      ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(0, 0, b.r*1.8, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      continue;
    }
    ctx.save();
    ctx.translate(b.x - camera.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.strokeStyle = b.pierce ? '#ffd35c' : '#8a6a3a';
    ctx.lineWidth = b.pierce ? 3 : 2;
    ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(5, 0); ctx.stroke();
    ctx.fillStyle = '#c9d6e3';
    ctx.beginPath(); ctx.moveTo(5, -3); ctx.lineTo(12, 0); ctx.lineTo(5, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-11, -3); ctx.lineTo(-6, 0); ctx.lineTo(-11, 3); ctx.stroke();
    ctx.restore();
  }
}

function drawProjectiles() {
  for (const b of projectiles) {
    ctx.save();
    ctx.translate(b.x - camera.x, b.y);
    ctx.rotate(frame * 0.25);
    if (b.kind === 'bomb') {
      ctx.fillStyle = '#2b2b33';
      ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#c9a24a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -b.r);
      ctx.quadraticCurveTo(4, -b.r-6, 2, -b.r-9);
      ctx.stroke();
      ctx.fillStyle = frame % 10 < 5 ? '#ff5a3c' : '#ffcf4a';
      ctx.beginPath(); ctx.arc(2, -b.r-10, 2, 0, Math.PI*2); ctx.fill();
    } else {
      const pal = PROJECTILE_PALETTE[b.kind] || PROJECTILE_PALETTE.fireball;
      const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, b.r+3);
      grad.addColorStop(0, pal.c1);
      grad.addColorStop(1, pal.c2);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, b.r+3, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}
function drawHammerThrow() {
  const h = player.hammerThrow;
  if (!h) return;
  ctx.save();
  ctx.translate(h.x - camera.x, h.y);
  ctx.rotate(frame * 0.5);
  ctx.fillStyle = '#7a5a3a';
  ctx.fillRect(-2, -13, 4, 26);
  ctx.fillStyle = '#6b6f76';
  ctx.fillRect(-10, -18, 20, 16);
  ctx.restore();
}

// Greataxe special: the axe leaves the player's hand, rockets straight up, hangs
// briefly at the peak (with a landing-zone telegraph so the impact is readable),
// then plummets back down onto its launch point.
function drawSkyAxe() {
  if (!player.skyAxe || player.specialType !== 'greataxe') return;
  const totalT = 50;
  const t = totalT - player.specialTimer;
  const { x, y } = player.skyAxe;
  let offsetY;
  if (t < 16) {
    offsetY = -(t / 16) * 220;
  } else if (t < 30) {
    offsetY = -220 + Math.sin((t - 16) * 0.5) * 6;
  } else {
    const p = (t - 30) / 18;
    offsetY = -220 + p * p * 220;
  }
  if (t >= 16) {
    drawAttackTelegraph(x - camera.x, y, 90);
  }
  ctx.save();
  ctx.translate(x - camera.x, y + offsetY);
  ctx.rotate(frame * 0.35);
  ctx.fillStyle = '#5a4632';
  ctx.fillRect(-15, -2, 30, 4);
  ctx.fillStyle = '#5a6b7a';
  ctx.beginPath();
  ctx.moveTo(9, -16); ctx.quadraticCurveTo(33, -18, 29, 2);
  ctx.quadraticCurveTo(33, 20, 9, 18);
  ctx.quadraticCurveTo(15, 2, 9, -16);
  ctx.fill();
  ctx.strokeStyle = '#3a3a3a';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.restore();
}

function explodeAt(cx, cy, radius, dmg) {
  for (let i = 0; i < 16; i++) {
    const ang = (Math.PI*2*i)/16;
    addParticle({type:'spark', x:cx, y:cy,
      vx:Math.cos(ang)*5, vy:Math.sin(ang)*5, life:22, maxLife:22, size:4+Math.random()*3, color:'#ff9d4d'});
  }
  const d = Math.hypot((player.x+player.w/2)-cx, (player.y+player.h/2)-cy);
  if (d < radius) damagePlayer(dmg, 40);
}

// ---------- Ground hazards (a boss signature move can leave lingering danger zones) ----------
let groundHazards = [];
function spawnGroundHazard(x, groundY, kind, life, dmgPerTick) {
  groundHazards.push({ x, groundY, kind, life, maxLife: life, dmgPerTick, tickTimer: 0 });
}
function updateGroundHazards() {
  for (const hz of groundHazards) {
    hz.life--;
    if (hz.tickTimer > 0) hz.tickTimer--;
    const hb = { x: hz.x - 24, y: hz.groundY - 16, w: 48, h: 16 };
    if (hz.tickTimer <= 0 && rectsOverlap(hb, player)) {
      damagePlayer(hz.dmgPerTick, 20);
      hz.tickTimer = 24;
    }
  }
  groundHazards = groundHazards.filter(hz => hz.life > 0);
}
function drawGroundHazards() {
  for (const hz of groundHazards) {
    const t = Math.max(0, hz.life / hz.maxLife);
    ctx.save();
    ctx.translate(hz.x - camera.x, hz.groundY);
    if (hz.kind === 'vine') {
      ctx.globalAlpha = Math.min(1, t * 1.6);
      ctx.fillStyle = '#3d7a2a';
      for (const ox of [-14, 0, 14]) {
        ctx.beginPath();
        ctx.moveTo(ox - 5, 2); ctx.lineTo(ox + 5, 2); ctx.lineTo(ox, -22 * t - 4);
        ctx.fill();
      }
      ctx.strokeStyle = '#1e4a12';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.globalAlpha = 0.55 + 0.25 * Math.sin(frame * 0.3);
      const grad = ctx.createRadialGradient(0, -4, 2, 0, -4, 28);
      grad.addColorStop(0, '#ffd35c');
      grad.addColorStop(1, '#a8200a');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, -4, 28 * Math.max(0.35, t), 9, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// Boss "signature move" - the every-3rd-attack burst dispatches here for the four
// story bosses instead of the generic AoE explosion, so each one reads as unique.
function resolveBossSignature(en) {
  if (en.signature === 'lava') {
    // 熔岩土龍: breathes a line of molten pools that linger and keep burning
    const dir = en.dir || (player.x > en.x ? 1 : -1);
    for (let i = 0; i < 3; i++) {
      spawnGroundHazard(en.x + en.w/2 + dir * (50 + i * 58), en.groundY, 'lava', 260, en.dmg * 0.35);
    }
  } else if (en.signature === 'ink') {
    // 深海龍王: a wide fan of ink bolts instead of one bolt
    const baseAng = Math.atan2((player.y + player.h/2) - (en.y + en.h/2), (player.x + player.w/2) - (en.x + en.w/2));
    for (let i = -2; i <= 2; i++) {
      const ang = baseAng + i * 0.22;
      spawnProjectile(en.x + en.w/2, en.y + en.h/2, Math.cos(ang) * 5.5, Math.sin(ang) * 5.5, en.dmg * 0.7, 'ink');
    }
  } else if (en.signature === 'gale') {
    // 飛龍亞基爾: a rapid triple dash instead of a single pass
    en.galeDashesLeft = 2;
    const dx = (player.x + player.w/2) - (en.x + en.w/2), dy = (player.y + player.h/2) - (en.y + en.h/2);
    const len = Math.hypot(dx, dy) || 1;
    en.dashDirX = dx / len; en.dashDirY = dy / len;
    en.dashing = true;
    en.dashTimer = 0;
  } else if (en.signature === 'vine') {
    // 草神狼: thorny vines erupt in a ring around it and briefly root anyone caught
    for (let i = 0; i < 6; i++) {
      const ang = (Math.PI * 2 * i) / 6;
      spawnGroundHazard(en.x + en.w/2 + Math.cos(ang) * 70, en.groundY, 'vine', 90, en.dmg * 0.5);
    }
    if (Math.hypot((player.x+player.w/2)-(en.x+en.w/2), (player.y+player.h/2)-(en.y+en.h/2)) < 110) {
      player.rootedTimer = 50;
    }
  } else {
    explodeAt(en.x + en.w/2, en.y + en.h/2, 100, en.dmg * 1.6);
  }
}

// ---------- Weapon select screen ----------
const weaponOrder = ['sword','hammer','spear'];
let menuSelectIndex = 0;

function updateMenu() {
  if (pressedOnce('ArrowLeft', menuKeyState.left) || pressedOnce('KeyA', menuKeyState.left)) {
    menuSelectIndex = (menuSelectIndex + weaponOrder.length - 1) % weaponOrder.length;
  }
  if (pressedOnce('ArrowRight', menuKeyState.right) || pressedOnce('KeyD', menuKeyState.right)) {
    menuSelectIndex = (menuSelectIndex + 1) % weaponOrder.length;
  }
  if (pressedOnce('Space', menuKeyState.space) || pressedOnce('Enter', menuKeyState.enter) || pressedOnce('KeyJ', menuKeyState.j)) {
    startGame(weaponOrder[menuSelectIndex]);
  }
}
const menuKeyState = { left:{}, right:{}, space:{}, enter:{}, j:{} };

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);

  if (state === 'menu') {
    weaponOrder.forEach((key, i) => {
      const cardX = 90 + i * 280;
      const cardY = 210;
      if (mx > cardX && mx < cardX+240 && my > cardY && my < cardY+300) {
        menuSelectIndex = i;
        startGame(key);
      }
    });
  } else if (overlay === 'armorshop') {
    if (clickedOverlayCloseButton(mx, my)) { overlay = null; return; }
    for (const card of villageCardRects) {
      if (mx > card.x && mx < card.x+card.w && my > card.y && my < card.y+card.h) {
        buyShopItem(card.id);
      }
    }
  } else if (overlay === 'weaponshop') {
    if (clickedOverlayCloseButton(mx, my)) { overlay = null; return; }
    for (const card of villageCardRects) {
      if (mx > card.x && mx < card.x+card.w && my > card.y && my < card.y+card.h) {
        if (card.kind === 'weapon') selectOrBuyWeapon(card.id);
        else buyShopItem(card.id);
      }
    }
  } else if (overlay === 'shieldshop') {
    if (clickedOverlayCloseButton(mx, my)) { overlay = null; return; }
    for (const card of villageCardRects) {
      if (mx > card.x && mx < card.x+card.w && my > card.y && my < card.y+card.h) {
        selectOrBuyShield(card.id);
      }
    }
  } else if (overlay === 'armorequip') {
    if (clickedOverlayCloseButton(mx, my)) { overlay = null; return; }
    for (const card of villageCardRects) {
      if (mx > card.x && mx < card.x+card.w && my > card.y && my < card.y+card.h) {
        selectOrBuyArmor(card.id);
      }
    }
  } else if (overlay === 'bag') {
    if (clickedOverlayCloseButton(mx, my)) { overlay = null; return; }
    for (const card of villageCardRects) {
      if (mx > card.x && mx < card.x+card.w && my > card.y && my < card.y+card.h) {
        if (card.kind === 'weapon') { if (player.unlockedWeapons.has(card.id)) player.weapon = WEAPONS[card.id]; }
        else if (card.kind === 'gadget') { if (player.unlockedGadgets.has(card.id)) player.equippedGadget = card.id; }
      }
    }
  } else if (overlay === 'quest') {
    if (clickedOverlayCloseButton(mx, my)) { overlay = null; return; }
    for (const card of villageCardRects) {
      if (mx > card.x && mx < card.x+card.w && my > card.y && my < card.y+card.h) {
        enterLevel(card.id);
      }
    }
  }
});

// Full fresh run: resets every stat and shop purchase, then loads the first level.
function startGame(weaponKey) {
  selectedWeapon = weaponKey;
  player.weapon = WEAPONS[weaponKey];
  player.maxHp = 100; player.maxHpPotions = 3; player.maxFpPotions = 3;
  player.gold = 0;
  player.weaponDmgBonus = 0;
  player.shopLevels = { weapon:0, armor:0, mana:0, hpflask:0, fpflask:0 };
  player.unlockedWeapons = new Set(['sword', 'hammer', 'spear']);
  player.shield = SHIELDS.none;
  player.unlockedShields = new Set(['none']);
  player.armor = ARMORS.none;
  player.unlockedArmors = new Set(['none']);
  player.unlockedGadgets = new Set();
  player.equippedGadget = null;
  player.bossDefeated = { volcano:false, ocean:false, sky:false, jungle:false };
  worldCompleteBanner = 0;
  frame = 0;
  enterLevel('redmoon');
}

// Load a level's geometry/enemies and place the player at its start. Called both for
// the first level and every time a portal or quest sends the player somewhere new -
// gold, shop levels, and weapon bonuses are NOT touched here, only startGame() resets those.
function enterLevel(levelId) {
  const def = LEVEL_DEFS[levelId];
  currentLevelId = levelId;
  platforms = def.isVillage ? VILLAGE_PLATFORMS : (def.platforms || ADVENTURE_PLATFORMS);
  LEVEL_WIDTH = def.isVillage ? VILLAGE_WIDTH : (def.width || (ADVENTURE_PLATFORMS[ADVENTURE_PLATFORMS.length-1].x + ADVENTURE_PLATFORMS[ADVENTURE_PLATFORMS.length-1].w));

  player.x = 60; player.y = GROUND_Y-60; player.vx=0; player.vy=0;
  player.hp = player.maxHp; player.fp = player.maxFp; player.sta = player.maxSta;
  player.hpPotions = player.maxHpPotions;
  player.fpPotions = player.maxFpPotions;
  player.dead = false;
  player.lastGroundX = player.x;
  player.lastGroundY = player.y;
  player.attackHold = { holding:false, startFrame:0, specialFired:false };
  player.specialCooldown = 0;
  player.specialType = null;
  player.specialTimer = 0;
  player.specialPhase = 0;
  player.hammerThrow = null;
  player.dashSpecial = null;
  player.skyAxe = null;
  player.rootedTimer = 0;
  player.potionCooldown = 0;
  player.gadgetCooldown = 0;
  player.flightTimer = 0;
  player.flightUsed = false;
  camera.x = 0;
  levelTimeLeft = (def.isVillage || def.isArena) ? Infinity : 130*60;
  overlay = null;
  spawnEnemiesForLevel(levelId);
  if (!def.isVillage) spawnCoins(); else coins = [];
  particles = [];
  projectiles = [];
  playerProjectiles = [];
  groundHazards = [];
  gadgetDrops = [];
  gadgetPickupBanner = null;
  if (levelId === 'arena') { arenaWave = 0; arenaWaveDelay = 40; arenaBanner = ''; arenaBannerTimer = 0; }
  state = 'playing';
}

// ---------- Update: Player ----------
let villageJumpPrev = false;
function updatePlayer() {
  if (player.dead) return;
  if (overlay) return; // frozen while a village shop/quest modal is open

  player.blocking = !!keys['KeyL'] && player.attackWindup === 0 && !player.attacking;
  if (player.rootedTimer > 0) player.rootedTimer--;

  const speed = player.rootedTimer > 0 ? 0
    : player.blocking ? (player.shield.locksMovement ? 0 : (player.shield.fastBlock ? 4.1 : 1.3))
    : 4.1;
  let moveInput = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) moveInput -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) moveInput += 1;

  if (moveInput !== 0) {
    player.vx += moveInput * 0.9;
    player.facing = moveInput > 0 ? 1 : -1;
    player.walkCycle += 0.25;
  } else {
    player.walkCycle = 0;
  }
  player.vx = Math.max(-speed, Math.min(speed, player.vx));
  player.vx *= player.onGround ? GROUND_FRICTION : 0.95;

  // jump
  const jumpDown = !!(keys['Space'] || keys['ArrowUp'] || keys['KeyW']);
  const wasOnGround = player.onGround;
  if (jumpDown && wasOnGround) {
    player.vy = -13.2;
    player.onGround = false;
  }
  // in the village, pressing jump near a shop or the tree opens that modal instead
  if (currentLevelId === 'village' && jumpDown && !villageJumpPrev && wasOnGround) {
    const px = player.x + player.w/2;
    if (Math.abs(px - VILLAGE_WEAPON_SHOP_X) < 70) overlay = 'weaponshop';
    else if (Math.abs(px - VILLAGE_ARMOR_SHOP_X) < 70) overlay = 'armorshop';
    else if (Math.abs(px - VILLAGE_SHIELD_SHOP_X) < 70) overlay = 'shieldshop';
    else if (Math.abs(px - VILLAGE_ARMOR_EQUIP_SHOP_X) < 70) overlay = 'armorequip';
    else if (Math.abs(px - VILLAGE_TREE_X) < 70) overlay = 'quest';
    // walking into a shop, not jumping into it - cancel the incidental hop above so
    // physics resume grounded (not mid-air) once the overlay closes again
    if (overlay) { player.vy = 0; player.onGround = true; }
  }
  villageJumpPrev = jumpDown;

  // wings gadget: holding jump while airborne (and not exhausted this trip) hovers
  // instead of falling, for up to GADGETS.wings.flightTime frames
  let flying = false;
  if (player.equippedGadget === 'wings' && jumpDown && !player.onGround && !player.flightUsed) {
    if (player.flightTimer < GADGETS.wings.flightTime) {
      flying = true;
      player.flightTimer++;
      player.vy = -3.2;
      if (player.flightTimer >= GADGETS.wings.flightTime) player.flightUsed = true;
    }
  }
  if (!flying) player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  // clamp to level bounds
  player.x = Math.max(0, Math.min(LEVEL_WIDTH - player.w, player.x));

  // ground collision against platforms (simple: only lands if within platform x-range)
  player.onGround = false;
  for (const p of platforms) {
    const px1 = p.x, px2 = p.x + p.w;
    const feetY = player.y + player.h;
    if (player.x + player.w > px1 + 2 && player.x < px2 - 2) {
      if (feetY >= p.y && feetY - player.vy <= p.y + 4 && player.vy >= 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }
  if (player.onGround) {
    player.lastGroundX = player.x;
    player.lastGroundY = player.y;
    player.flightTimer = 0;
    player.flightUsed = false;
  }
  if (player.y > H + 200) {
    // fell into a gap: respawn on the last safe platform with a penalty instead of an outright kill
    player.x = player.lastGroundX;
    player.y = player.lastGroundY;
    player.vx = 0; player.vy = 0;
    player.hp -= 25;
    player.invuln = 60;
  }

  // stamina regen (FP does NOT regenerate on its own - only potions restore it)
  if (player.sta < player.maxSta) player.sta = Math.min(player.maxSta, player.sta + 0.35);

  // attack: tap J for a normal swing, hold it past a short threshold for the weapon's
  // FP-costing special. The special only fires once per hold; if it can't (no FP, on
  // cooldown), releasing still falls back to a normal tap attack.
  if (player.attackCooldown > 0) player.attackCooldown--;
  if (player.specialCooldown > 0) player.specialCooldown--;
  if (player.attackWindup > 0) {
    player.attackWindup--;
    if (player.attackWindup === 0) {
      if (player.weapon.ranged) spawnPlayerArrow(currentWeaponDmg());
      else resolveAttackHit();
    }
  }
  if (player.attackWindup === 0 && !player.specialType) player.attacking = false;

  const attackKeyDown = !!keys['KeyJ'];
  const canStartAction = !player.blocking && player.attackCooldown <= 0 && !player.specialType;
  if (attackKeyDown) {
    if (!player.attackHold.holding) {
      player.attackHold.holding = true;
      player.attackHold.startFrame = frame;
      player.attackHold.specialFired = false;
      player.attackHold.thresholdChecked = false;
    } else if (!player.attackHold.thresholdChecked && frame - player.attackHold.startFrame >= ATTACK_HOLD_THRESHOLD) {
      player.attackHold.thresholdChecked = true;
      if (canStartAction && player.specialCooldown <= 0 && player.fp >= player.weapon.specialCost) {
        startSpecial();
        player.attackHold.specialFired = true;
      }
    }
  } else if (player.attackHold.holding) {
    if (!player.attackHold.specialFired && canStartAction && player.sta >= player.weapon.staminaCost) {
      player.sta -= player.weapon.staminaCost;
      player.attackCooldown = player.weapon.cooldown;
      player.attackWindup = player.weapon.windup;
      player.attacking = true;
      player.hitThisSwing = false;
    }
    player.attackHold.holding = false;
  }

  updateSpecial();

  // gadget: I fires the equipped monster-drop gadget (independent of the weapon's own
  // attack/special and its cooldown) - wings is passive and doesn't use this at all
  if (player.gadgetCooldown > 0) player.gadgetCooldown--;
  if (pressedOnce('KeyI', gadgetKeyState) && player.equippedGadget) {
    const g = GADGETS[player.equippedGadget];
    if (g && !g.passive && player.gadgetCooldown <= 0 && player.sta >= g.staminaCost) {
      player.sta -= g.staminaCost;
      player.gadgetCooldown = g.cooldown;
      spawnGadgetProjectile(g);
    }
  }

  // potions: 1 = HP flask, 2 = FP flask - a short shared cooldown stops a held key spamming
  if (player.potionCooldown > 0) player.potionCooldown--;
  if (player.potionCooldown <= 0) {
    if (pressedOnce('Digit1', potionKeyState.hp) && player.hpPotions > 0) {
      player.hpPotions--;
      player.hp = Math.min(player.maxHp, player.hp + 40);
      player.potionCooldown = 20;
      spawnPotionSparkle('#ff6b5c');
    } else if (pressedOnce('Digit2', potionKeyState.fp) && player.fpPotions > 0) {
      player.fpPotions--;
      player.fp = Math.min(player.maxFp, player.fp + 45);
      player.potionCooldown = 20;
      spawnPotionSparkle('#5c9dff');
    }
  }

  if (player.invuln > 0) player.invuln--;
  if (player.blockFlash > 0) player.blockFlash--;

  // camera follow
  const targetCam = Math.max(0, Math.min(LEVEL_WIDTH - W, player.x - W/2));
  camera.x += (targetCam - camera.x) * 0.12;

  if (player.hp <= 0 && !player.dead) {
    player.dead = true;
    setTimeout(()=>{ if (state==='playing') state = 'lose'; }, 600);
  }

  // reach the portal -> travel back to the village, but only once it's actually
  // there - story levels keep it hidden (and this trigger inert) until their boss falls
  {
    const def = LEVEL_DEFS[currentLevelId];
    const portalReady = !def.requiresBoss || player.bossDefeated[currentLevelId];
    if (!def.isVillage && portalReady && player.x > LEVEL_WIDTH - 160) {
      enterLevel('village');
    }
  }

  updateCoins();
  updateGadgetDrops();
}
const potionKeyState = { hp:{}, fp:{} };
const gadgetKeyState = {};

// Routes all enemy damage through the shield: blocking cuts damage sharply and
// chips stamina instead, so timing the block against a telegraphed attack matters.
function damagePlayer(amount, invulnFrames) {
  if (player.invuln > 0) return;
  // armor is passive and always active; the shield's block reduction (while held) stacks on top
  let dmg = amount * (1 - (player.armor.defenseReduction || 0));
  if (player.blocking) {
    dmg = dmg * player.shield.blockReduction;
    if (player.shield.manaCost) player.fp = Math.max(0, player.fp - amount * 0.5);
    else player.sta = Math.max(0, player.sta - amount * 0.5);
    player.blockFlash = 10;
    if (player.shield.thorns) retaliateNearbyEnemy();
  } else if (player.armor.thorns) {
    retaliateNearbyEnemy();
  }
  player.hp -= dmg;
  player.invuln = invulnFrames || 45;
}

// Spike shield retaliation: without threading the specific attacker through every
// damagePlayer() call site (melee bumps, explosions, projectiles), approximate
// "reflect to attacker" by striking whichever living enemy is closest, if any is
// actually within thorn range - which in practice is whoever just hit you in melee.
function retaliateNearbyEnemy() {
  const cx = player.x + player.w/2, cy = player.y + player.h/2;
  let closest = null, closestDist = 90;
  for (const en of enemies) {
    if (en.dead || en.buried) continue;
    const d = Math.hypot((en.x+en.w/2)-cx, (en.y+en.h/2)-cy);
    if (d < closestDist) { closest = en; closestDist = d; }
  }
  if (closest) {
    damageEnemy(closest, 12);
    spawnSparkleAt(closest.x+closest.w/2, closest.y+closest.h/2, '#ff3b3b');
  }
}

function attackHitbox(reachOverride) {
  const w = player.weapon;
  const reach = reachOverride || w.range;
  const x = player.facing > 0 ? player.x + player.w : player.x - reach;
  return { x, y: player.y - 6, w: reach, h: player.h + 12 };
}

function resolveAttackHit(dmgOverride, reachOverride) {
  const hb = attackHitbox(reachOverride);
  const dmg = dmgOverride != null ? dmgOverride : currentWeaponDmg();
  for (const en of enemies) {
    if (en.dead || en.buried) continue;
    if (rectsOverlap(hb, {x:en.x,y:en.y,w:en.w,h:en.h})) {
      damageEnemy(en, dmg);
    }
  }
}

// Sword special: hits everything in a radius around a center point (the player by
// default, or an explicit point - e.g. where a thrown weapon lands).
function resolveSpecialAoeHit(dmg, radius, atX, atY) {
  const cx = atX != null ? atX : player.x + player.w/2;
  const cy = atY != null ? atY : player.y + player.h/2;
  for (const en of enemies) {
    if (en.dead || en.buried) continue;
    const ex = en.x + en.w/2, ey = en.y + en.h/2;
    if (Math.hypot(ex-cx, ey-cy) <= radius) damageEnemy(en, dmg);
  }
}

// ---------- Weapon specials (long-press attack) ----------
function startSpecial() {
  const type = player.weapon.key;
  player.fp -= player.weapon.specialCost;
  player.specialCooldown = player.weapon.specialCooldown;
  player.specialType = type;
  player.attacking = true;

  if (type === 'sword') {
    player.specialTimer = 26;
  } else if (type === 'hammer') {
    player.specialTimer = 1;
    player.hammerThrow = {
      x: player.x + player.w/2, y: player.y + player.h/2 - 4,
      vx: player.facing * 7.5,
      dist: 0, maxDist: 230, returning: false,
      hitSet: new Set()
    };
  } else if (type === 'spear') {
    player.specialTimer = 44;
  } else if (type === 'dualdagger') {
    player.specialTimer = 20;
    player.dashSpecial = { hitSet: new Set() };
  } else if (type === 'greataxe') {
    // thrown straight up, hangs at the peak, then crashes back down where it launched
    player.specialTimer = 50;
    player.skyAxe = { x: player.x + player.w/2, y: player.y + player.h/2 };
  } else if (type === 'whip') {
    player.specialTimer = 40;
  } else if (type === 'greatsword') {
    player.specialTimer = 34;
  } else if (type === 'trident') {
    player.specialTimer = 36;
  } else if (type === 'katana') {
    player.specialTimer = 18;
  } else if (type === 'shortblade') {
    player.specialTimer = 30;
  } else if (type === 'bow') {
    player.specialTimer = 24;
  } else if (type === 'flail') {
    player.specialTimer = 36;
  } else if (type === 'scythe') {
    player.specialTimer = 30;
  }
}

function updateSpecial() {
  if (!player.specialType) return;
  const type = player.specialType;

  if (type === 'sword') {
    player.specialTimer--;
    if (player.specialTimer === 16) {
      resolveSpecialAoeHit(currentWeaponDmg() * 1.4, 62);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  } else if (type === 'hammer') {
    updateHammerThrow();
  } else if (type === 'spear') {
    player.specialTimer--;
    if ([38, 30, 22, 14, 6].includes(player.specialTimer)) {
      resolveAttackHit(currentWeaponDmg() * 0.75, player.weapon.range + 8);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  } else if (type === 'dualdagger') {
    // gale dash: blink forward, damaging everything passed through once
    player.x += player.facing * 9;
    player.x = Math.max(0, Math.min(LEVEL_WIDTH - player.w, player.x));
    const hb = { x: player.x, y: player.y, w: player.w, h: player.h };
    for (const en of enemies) {
      if (en.dead || en.buried || player.dashSpecial.hitSet.has(en)) continue;
      if (rectsOverlap(hb, {x:en.x,y:en.y,w:en.w,h:en.h})) {
        damageEnemy(en, currentWeaponDmg() * 1.3);
        player.dashSpecial.hitSet.add(en);
      }
    }
    player.specialTimer--;
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
      player.dashSpecial = null;
    }
  } else if (type === 'greataxe') {
    // impact lands when the axe crashes back down at its launch point, not the
    // player's current position - see drawSkyAxe() for the matching flight path
    player.specialTimer--;
    if (player.specialTimer === 8) {
      resolveSpecialAoeHit(currentWeaponDmg() * 1.8, 90, player.skyAxe.x, player.skyAxe.y);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
      player.skyAxe = null;
    }
  } else if (type === 'whip') {
    player.specialTimer--;
    if ([34, 26, 18, 10].includes(player.specialTimer)) {
      resolveAttackHit(currentWeaponDmg() * 0.85, player.weapon.range + 30);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  } else if (type === 'greatsword') {
    player.specialTimer--;
    if (player.specialTimer === 20 || player.specialTimer === 8) {
      resolveSpecialAoeHit(currentWeaponDmg() * 1.1, 70);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  } else if (type === 'trident') {
    player.specialTimer--;
    if ([28, 18, 8].includes(player.specialTimer)) {
      resolveAttackHit(currentWeaponDmg() * 0.9, player.weapon.range + 15);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  } else if (type === 'katana') {
    // one decisive cut, timed to land mid-draw
    player.specialTimer--;
    if (player.specialTimer === 8) {
      resolveAttackHit(currentWeaponDmg() * 2.2, player.weapon.range + 10);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  } else if (type === 'shortblade') {
    player.specialTimer--;
    if ([24, 18, 12, 6].includes(player.specialTimer)) {
      resolveAttackHit(currentWeaponDmg() * 0.9, player.weapon.range + 6);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  } else if (type === 'bow') {
    // one heavily-aimed, piercing shot instead of a spread - a real "sniper" pick
    player.specialTimer--;
    if (player.specialTimer === 14) {
      spawnPlayerArrow(currentWeaponDmg() * 3.2, { speed: 16, pierce: true });
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  } else if (type === 'flail') {
    player.specialTimer--;
    if ([28, 18, 8].includes(player.specialTimer)) {
      resolveSpecialAoeHit(currentWeaponDmg() * 0.8, 70);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  } else if (type === 'scythe') {
    player.specialTimer--;
    if (player.specialTimer === 14) {
      resolveAttackHit(currentWeaponDmg() * 1.6, player.weapon.range + 40);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  }
}

function checkHammerHits(h) {
  const hb = {x: h.x-18, y: h.y-18, w:36, h:36};
  for (const en of enemies) {
    if (en.dead || en.buried || h.hitSet.has(en)) continue;
    if (rectsOverlap(hb, {x:en.x,y:en.y,w:en.w,h:en.h})) {
      damageEnemy(en, currentWeaponDmg() * 1.1);
      h.hitSet.add(en);
    }
  }
}

function updateHammerThrow() {
  const h = player.hammerThrow;
  if (!h) { player.specialType = null; return; }
  const speed = 7.5;
  if (!h.returning) {
    h.x += h.vx;
    h.dist += Math.abs(h.vx);
    checkHammerHits(h);
    if (h.dist >= h.maxDist) h.returning = true;
  } else {
    const dx = (player.x + player.w/2) - h.x;
    const dy = (player.y + player.h/2 - 4) - h.y;
    const dist = Math.hypot(dx, dy) || 1;
    h.x += dx/dist * speed;
    h.y += dy/dist * speed;
    checkHammerHits(h);
    if (dist < 16) {
      player.hammerThrow = null;
      player.specialType = null;
      player.attacking = false;
    }
  }
}

function spawnSparkleAt(x, y, color, count) {
  for (let i = 0; i < (count || 12); i++) {
    const ang = Math.random() * Math.PI * 2;
    addParticle({type:'spark', x, y,
      vx:Math.cos(ang)*2.2, vy:Math.sin(ang)*2.2-1.5, life:26, maxLife:26, size:2.5+Math.random()*2.5, color});
  }
}
function spawnPotionSparkle(color) {
  spawnSparkleAt(player.x + player.w/2, player.y + player.h/2, color);
}

function damageEnemy(en, dmg) {
  en.hp -= dmg;
  en.hitFlash = 8;
  if (en.hp <= 0 && !en.dead) {
    en.dead = true;
    if (currentLevelId === 'arena') player.gold += en.isBoss ? 30 : 3;
    if (en.isBoss && LEVEL_DEFS[currentLevelId] && LEVEL_DEFS[currentLevelId].requiresBoss) {
      const wasComplete = QUEST_LEVEL_IDS.every(id => player.bossDefeated[id]);
      player.bossDefeated[currentLevelId] = true;
      const nowComplete = QUEST_LEVEL_IDS.every(id => player.bossDefeated[id]);
      if (!wasComplete && nowComplete) worldCompleteBanner = 300;
    }
    if (en.type === 'bomb') {
      en.exploding = true;
      en.explodeTimer = 30;
      en.explodeRadius = en.isBoss ? 130 : 90;
      en.explodeDmg = en.isBoss ? 22 : 14;
    } else {
      for (let i=0;i<10;i++) {
        addParticle({type:'spark', x:en.x+en.w/2, y:en.y+en.h/2,
          vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6-2, life:20,maxLife:20, size:3+Math.random()*3, color:'#7fffb0'});
      }
    }
    // grunts have a chance to drop their signature gadget - keeps kills rewarding
    // even outside the arena, and outside pure gold
    if (!en.isBoss) {
      const gadgetKey = GADGET_KIND_TO_KEY[en.kind];
      if (gadgetKey && Math.random() < GADGET_DROP_CHANCE) {
        spawnGadgetDrop(en.x + en.w/2, en.y + en.h/2, gadgetKey);
      }
    }
  }
}

function rectsOverlap(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ---------- Update: Enemies ----------
function updateEnemies() {
  for (const en of enemies) {
    if (en.dead) {
      if (en.type === 'bomb' && en.exploding) {
        en.explodeTimer--;
        if (en.explodeTimer === 6) {
          explodeAt(en.x+en.w/2, en.y+en.h/2, en.explodeRadius || 90, en.explodeDmg || 14);
        }
        // without this, a dead ground enemy's exploding flag would never clear,
        // so it would linger drawn forever and the arena would never see it as cleared
        if (en.explodeTimer <= 0) en.exploding = false;
      }
      continue;
    }
    if (en.hitFlash > 0) en.hitFlash--;

    if (en.buried) {
      en.y = en.groundY - en.h;
      if (!en.emerging) {
        const dx = player.x - (en.x + en.w/2);
        const dy = player.y - en.y;
        // stays hidden until the dragon walks close, then bursts out of the ground
        if (Math.abs(dx) < 150 && Math.abs(dy) < 160) {
          en.emerging = true;
          en.emergeDuration = 28;
          en.emergeTimer = en.emergeDuration;
        }
      } else {
        en.emergeTimer--;
        if (en.emergeTimer <= 0) { en.buried = false; en.emerging = false; }
      }
      continue;
    }

    if (en.type === 'bomb') {
      const dx = player.x - en.x;
      const range = en.isBoss ? 440 : 360;
      const inRange = Math.abs(dx) < range && Math.abs(player.y - en.y) < 110;
      const closeGap = en.attackMode === 'melee' ? 30 : 160;
      // walk back and forth, face and approach the player if in range - frozen during its telegraph wind-up
      if (!en.telegraph) {
        if (inRange) {
          en.dir = dx > 0 ? 1 : -1;
          if (Math.abs(dx) > closeGap) en.x += en.dir * en.speed;
        } else if (frame % 90 === 0) {
          en.dir *= -1;
        } else {
          en.x += en.dir * en.speed;
        }
        // stay on its own platform - turn around at the edge instead of walking over a gap
        if (en.x <= en.homeMinX) { en.x = en.homeMinX; en.dir = 1; }
        if (en.x >= en.homeMaxX) { en.x = en.homeMaxX; en.dir = -1; }
      }
      en.y = en.groundY - en.h;

      if (en.attackCooldown > 0) en.attackCooldown--;
      if (!en.telegraph && inRange && en.attackCooldown<=0) {
        en.telegraph = true;
        en.dir = dx > 0 ? 1 : -1;
        // bosses use every 3rd attack for a longer-telegraphed AoE burst instead of their normal hit
        en.atkCount = (en.atkCount || 0) + 1;
        en.burst = en.isBoss && (en.atkCount % 3 === 0);
        en.attackWindup = en.burst ? 50 : 30;
      }
      if (en.telegraph) {
        en.attackWindup--;
        if (en.attackWindup <= 0) {
          en.telegraph = false;
          en.attackCooldown = en.burst ? 160 : 110;
          if (en.burst) {
            resolveBossSignature(en);
          } else if (en.attackMode === 'melee') {
            if (rectsOverlap(en, player)) damagePlayer(en.dmg);
          } else {
            throwBomb(en);
          }
        }
      }
    } else if (en.type === 'drone') {
      en.phase += 0.05;
      const dx = player.x - en.x;
      const dy = player.y - en.y;
      const dist = Math.hypot(dx,dy);
      const engageDist = en.isBoss ? 360 : 300;

      if (en.charging) {
        en.chargeTimer--;
        if (en.chargeTimer <= 0) {
          en.charging = false;
          if (en.galeFollowup) {
            // mid-combo dash from a triggered "gale" signature - not a fresh decision
            en.galeFollowup = false;
            en.dashing = true;
            const len = Math.hypot(dx,dy) || 1;
            en.dashDirX = dx/len; en.dashDirY = dy/len;
          } else {
            en.atkCount = (en.atkCount || 0) + 1;
            const burst = en.isBoss && (en.atkCount % 3 === 0);
            if (burst) {
              resolveBossSignature(en);
              en.attackCooldown = 150;
            } else if (en.attackMode === 'cast') {
              const len = Math.hypot(dx,dy) || 1;
              spawnCastProjectile(en, dx/len, dy/len);
              en.attackCooldown = en.isBoss ? 130 : 90;
            } else {
              en.dashing = true;
              const len = Math.hypot(dx,dy) || 1;
              en.dashDirX = dx/len; en.dashDirY = dy/len;
            }
          }
        }
      } else if (!en.dashing) {
        en.y = en.baseY + Math.sin(en.phase)*14;
        if (dist < 240) {
          en.x += Math.sign(dx) * en.speed * 0.6;
        }
        en.dashTimer++;
        if (en.dashTimer > 110 && dist < engageDist && en.attackCooldown<=0) {
          en.charging = true;
          en.chargeTimer = 20; // ~0.33s wind-up flash before the dive/cast
          en.dashTimer = 0;
        }
      } else {
        en.x += en.dashDirX * en.speed * 3.2;
        en.y += en.dashDirY * en.speed * 3.2;
        en.dashTimer++;
        if (en.dashTimer > 22) {
          en.dashing = false; en.dashTimer = 0;
          // 飛龍亞基爾's "gale" signature: chain into another dash right away
          if (en.galeDashesLeft > 0) {
            en.galeDashesLeft--;
            en.charging = true;
            en.chargeTimer = 10;
            en.galeFollowup = true;
          }
        }
      }
      en.x = Math.max(0, Math.min(LEVEL_WIDTH - en.w, en.x));

      if (en.attackCooldown > 0) en.attackCooldown--;
      if (!en.charging && en.attackMode !== 'cast' && rectsOverlap(en, player) && en.attackCooldown<=0) {
        damagePlayer(en.dmg);
        en.attackCooldown = en.dashing ? 30 : 50;
      }
    }
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
}

// ---------- Drawing helpers ----------
function drawBar(x, y, w, h, pct, colorFill, colorBg, label) {
  ctx.fillStyle = colorBg;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = colorFill;
  ctx.fillRect(x, y, w * Math.max(0,pct), h);
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  if (label) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x - 26, y + h/2);
  }
}

function drawFlaskIcon(x, y, color, count, keyLabel) {
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  roundRect(ctx, x, y, 18, 20, 4);
  ctx.fill();
  const fillH = count > 0 ? 14 : 0;
  ctx.fillStyle = count > 0 ? color : 'rgba(255,255,255,0.15)';
  roundRect(ctx, x+2, y+18-fillH, 14, fillH, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, x, y, 18, 20, 4);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText(`x${count}`, x+24, y+15);
  if (keyLabel) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '9px sans-serif';
    ctx.fillText(keyLabel, x+2, y-3);
  }
}

function drawHUD() {
  // HP/FP bars grow in length as their upgrades raise the max, instead of staying a
  // fixed size and just reporting a smaller fraction filled - stamina has no upgrade
  // path so its bar stays put.
  const hpBarW = 180 * (player.maxHp / 100);
  const fpBarW = 180 * (player.maxFp / 100);
  drawBar(56, 16, hpBarW, 16, player.hp/player.maxHp, '#e0453f', 'rgba(60,10,10,0.7)', 'HP');
  drawBar(56, 38, fpBarW, 14, player.fp/player.maxFp, '#3f7fe0', 'rgba(10,20,60,0.7)', 'FP');
  drawBar(56, 58, 180, 12, player.sta/player.maxSta, '#4fd15b', 'rgba(10,40,10,0.7)', '耐力');

  // timer top-right, echoing the "1:00" in the drawing - the village has no timer
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'right';
  if (isFinite(levelTimeLeft)) {
    const secs = Math.max(0, Math.ceil(levelTimeLeft/60));
    const mm = Math.floor(secs/60), ss = secs%60;
    ctx.fillText(`${mm}:${ss.toString().padStart(2,'0')}`, W-24, 34);
  }
  ctx.font = 'bold 15px sans-serif';
  ctx.fillStyle = '#f5c542';
  ctx.fillText(`金幣 ${player.gold}`, W-24, 58);
  ctx.textAlign = 'left';

  // weapon indicator
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('武器: ' + player.weapon.name, 56, 90);

  // potion flasks, below the bars and clear of the top hint text: top = HP recovery, bottom = FP recovery
  drawFlaskIcon(160, 78, '#ff6b5c', player.hpPotions, '1');
  drawFlaskIcon(160, 104, '#5c9dff', player.fpPotions, '2');

  if (currentLevelId === 'arena') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff8a6a';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText(`第 ${arenaWave} 波`, W/2, 34);
    if (arenaBannerTimer > 0) {
      ctx.globalAlpha = Math.min(1, arenaBannerTimer / 30);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText(arenaBanner, W/2, 90);
      ctx.globalAlpha = 1;
    }
    ctx.textAlign = 'left';
  }
}

// 草神狼's vine bind: a few thorny vines wrap the player's feet while rooted.
function drawRootedEffect() {
  ctx.save();
  ctx.translate(player.x + player.w/2, player.y + player.h);
  ctx.strokeStyle = '#3d7a2a';
  ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    const ox = (i - 1) * 12;
    const sway = Math.sin(frame * 0.3 + i) * 3;
    ctx.beginPath();
    ctx.moveTo(ox, 0);
    ctx.quadraticCurveTo(ox + sway, -10, ox, -20);
    ctx.stroke();
  }
  ctx.restore();
}

function drawWorldCompleteBanner() {
  if (worldCompleteBanner <= 0) return;
  const elapsed = 300 - worldCompleteBanner;
  let alpha = 1;
  if (elapsed < 20) alpha = elapsed / 20;
  else if (worldCompleteBanner < 60) alpha = worldCompleteBanner / 60;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, H/2 - 70, W, 140);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd35c';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('🏆 四大魔王已全數討伐！', W/2, H/2 - 14);
  ctx.fillStyle = '#fff';
  ctx.font = '15px sans-serif';
  ctx.fillText('第二個世界的大門正在成形...敬請期待', W/2, H/2 + 22);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawDragon(p) {
  ctx.save();
  ctx.translate(p.x + p.w/2, p.y + p.h/2);
  ctx.scale(p.facing, 1);
  const bob = p.onGround ? Math.sin(p.walkCycle)*2 : 0;
  ctx.translate(0, bob);

  if (p.invuln > 0 && Math.floor(frame/4)%2===0) ctx.globalAlpha = 0.4;

  // tail with a small spiked tip
  ctx.fillStyle = '#379143';
  ctx.beginPath();
  ctx.moveTo(-p.w/2, 6);
  ctx.quadraticCurveTo(-p.w/2-18, 11, -p.w/2-27, -2);
  ctx.quadraticCurveTo(-p.w/2-12, 3, -p.w/2, -4);
  ctx.fill();
  ctx.fillStyle = '#e8d55a';
  ctx.beginPath();
  ctx.moveTo(-p.w/2-23, -3);
  ctx.lineTo(-p.w/2-31, -7);
  ctx.lineTo(-p.w/2-21, 3);
  ctx.fill();

  // body - subtle gradient so it reads with some volume instead of a flat fill
  const bodyGrad = ctx.createLinearGradient(-p.w/2, -p.h/2, p.w/2, p.h/2);
  bodyGrad.addColorStop(0, '#5fd66c');
  bodyGrad.addColorStop(1, '#379143');
  ctx.fillStyle = bodyGrad;
  roundRect(ctx, -p.w/2+4, -p.h/2+14, p.w-8, p.h-22, 10);
  ctx.fill();

  // spine spikes
  ctx.fillStyle = '#e8d55a';
  for (const sx of [-p.w/2+7, -p.w/2+15, -p.w/2+23]) {
    ctx.beginPath();
    ctx.moveTo(sx-3, -p.h/2+16);
    ctx.lineTo(sx+3, -p.h/2+16);
    ctx.lineTo(sx, -p.h/2+7);
    ctx.fill();
  }

  // belly
  ctx.fillStyle = '#eaf7cf';
  roundRect(ctx, -p.w/2+9, -p.h/2+22, p.w-20, p.h-32, 7);
  ctx.fill();

  // legs with small claws
  ctx.fillStyle = '#379143';
  const legSwing = p.onGround ? Math.sin(p.walkCycle)*6 : 0;
  ctx.fillRect(-10, p.h/2-18+legSwing*0.2, 8, 16);
  ctx.fillRect(4, p.h/2-18-legSwing*0.2, 8, 16);
  ctx.fillStyle = '#e8d55a';
  ctx.beginPath();
  ctx.moveTo(-11, p.h/2-2+legSwing*0.2); ctx.lineTo(-5, p.h/2-2+legSwing*0.2); ctx.lineTo(-8, p.h/2+3+legSwing*0.2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(3, p.h/2-2-legSwing*0.2); ctx.lineTo(9, p.h/2-2-legSwing*0.2); ctx.lineTo(6, p.h/2+3-legSwing*0.2);
  ctx.fill();

  // small arm connecting shoulder to the weapon grip, plus a pauldron colored to the equipped weapon
  ctx.fillStyle = '#379143';
  roundRect(ctx, p.w/2-15, -3, 13, 6, 3);
  ctx.fill();
  ctx.fillStyle = p.weapon.color;
  ctx.beginPath();
  ctx.arc(p.w/2-17, -p.h/2+23, 6, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.28)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // head
  ctx.fillStyle = '#4CC15A';
  ctx.beginPath();
  ctx.ellipse(p.w/2-14, -p.h/2+16, 15, 13, 0, 0, Math.PI*2);
  ctx.fill();
  // snout
  roundRect(ctx, p.w/2-9, -p.h/2+11, 16, 10, 4);
  ctx.fill();
  // brow ridge for a sharper, more determined look
  ctx.fillStyle = '#2f7a3a';
  ctx.beginPath();
  ctx.moveTo(p.w/2-20, -p.h/2+7);
  ctx.lineTo(p.w/2-5, -p.h/2+5);
  ctx.lineTo(p.w/2-7, -p.h/2+9);
  ctx.lineTo(p.w/2-20, -p.h/2+10);
  ctx.fill();
  // swept-back horn
  ctx.fillStyle = '#e8d55a';
  ctx.beginPath();
  ctx.moveTo(p.w/2-5, -p.h/2+4);
  ctx.quadraticCurveTo(p.w/2+10, -p.h/2-4, p.w/2+9, -p.h/2-12);
  ctx.quadraticCurveTo(p.w/2+2, -p.h/2-2, p.w/2-1, -p.h/2+5);
  ctx.fill();
  // eye with a highlight for some life in the expression
  ctx.fillStyle = '#20321f';
  ctx.beginPath();
  ctx.arc(p.w/2-10, -p.h/2+15, 2.2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(p.w/2-10.8, -p.h/2+14.2, 0.8, 0, Math.PI*2);
  ctx.fill();

  ctx.globalAlpha = 1;

  // weapon (holstered while the shield is up)
  if (p.blocking) {
    drawShieldSprite(p);
  } else {
    drawWeaponSprite(p);
  }

  // whirl-slash sweep trail for the sword special
  if (p.specialType === 'sword') {
    const t = 1 - p.specialTimer / 26;
    ctx.save();
    ctx.globalAlpha = 0.55 * (1 - t);
    ctx.strokeStyle = '#dfe8f0';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, 34, 0, Math.PI * 2 * t);
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

function drawShieldSprite(p) {
  ctx.save();
  ctx.translate(p.w/2 - 2, 2);
  if (p.blockFlash > 0) {
    ctx.save();
    ctx.globalAlpha = p.blockFlash / 10;
    ctx.strokeStyle = '#dff0ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 18 + (10 - p.blockFlash), 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  const shieldKey = p.shield.key;
  if (shieldKey === 'greatshield') {
    roundRect(ctx, -9, -22, 22, 44, 8);
    ctx.fillStyle = '#5a5f68';
    ctx.fill();
    roundRect(ctx, -5, -16, 14, 32, 5);
    ctx.fillStyle = '#8f97a3';
    ctx.fill();
    ctx.fillStyle = '#e8d55a';
    ctx.beginPath();
    ctx.arc(2, 0, 4, 0, Math.PI*2);
    ctx.fill();
  } else if (shieldKey === 'spikeshield') {
    roundRect(ctx, -6, -16, 16, 32, 6);
    ctx.fillStyle = '#7a4a3a';
    ctx.fill();
    roundRect(ctx, -3, -12, 10, 24, 4);
    ctx.fillStyle = '#c9a24a';
    ctx.fill();
    ctx.fillStyle = '#e8e8ee';
    for (const oy of [-10, 0, 10]) {
      ctx.beginPath();
      ctx.moveTo(-3, oy-3); ctx.lineTo(-9, oy); ctx.lineTo(-3, oy+3);
      ctx.fill();
    }
  } else {
    roundRect(ctx, -6, -16, 16, 32, 6);
    ctx.fillStyle = '#8a6a3a';
    ctx.fill();
    roundRect(ctx, -3, -12, 10, 24, 4);
    ctx.fillStyle = '#c9d6e3';
    ctx.fill();
    ctx.fillStyle = '#e8d55a';
    ctx.beginPath();
    ctx.arc(2, 0, 3, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawWeaponSprite(p) {
  const w = p.weapon;
  if (w.key === 'hammer' && p.hammerThrow) return; // the hammer is drawn as a flying projectile elsewhere
  if (w.key === 'greataxe' && p.skyAxe) return; // the axe is drawn flying up/down elsewhere

  let angle = -0.4;
  // the bow always points at wherever the player is aiming (mouse/touch), not just forward
  const bowAimAngle = w.ranged ? Math.atan2(getAimVector().y * p.facing, getAimVector().x * p.facing) : null;
  if (p.specialType === 'sword') {
    const t = 1 - p.specialTimer / 26;
    angle = t * Math.PI * 2.4; // fast full spin for the whirl slash
  } else if (p.specialType === 'spear') {
    const t = 1 - p.specialTimer / 44;
    const cyc = (t * 5) % 1; // 5 quick thrust/retract cycles
    angle = cyc < 0.4 ? -0.9 + (cyc/0.4) * 1.5 : 0.6 - ((cyc-0.4)/0.6) * 1.5;
  } else if (p.specialType === 'dualdagger') {
    angle = 0.2 + Math.sin(frame * 1.3) * 0.5; // rapid slashing flicker during the dash
  } else if (p.specialType === 'whip') {
    const t = 1 - p.specialTimer / 40;
    const cyc = (t * 4) % 1; // 4 long cracking lashes
    angle = cyc < 0.3 ? -0.7 + (cyc/0.3) * 1.9 : 1.2 - ((cyc-0.3)/0.7) * 1.9;
  } else if (p.specialType === 'greatsword') {
    const t = 1 - p.specialTimer / 34;
    const cyc = (t * 2) % 1; // two big cross-pattern slashes
    angle = -1.3 + cyc * 2.6;
  } else if (p.specialType === 'trident') {
    const t = 1 - p.specialTimer / 36;
    const cyc = (t * 3) % 1; // three quick thrusts
    angle = cyc < 0.4 ? -0.6 + (cyc/0.4) * 1.1 : 0.5 - ((cyc-0.4)/0.6) * 1.1;
  } else if (p.specialType === 'katana') {
    const t = 1 - p.specialTimer / 18;
    angle = -1.4 + t * 2.5; // one fast decisive draw-cut
  } else if (p.specialType === 'shortblade') {
    angle = 0.3 + Math.sin(frame * 1.6) * 0.6; // frantic close-range flicker
  } else if (p.specialType === 'bow') {
    angle = bowAimAngle + Math.sin(frame * 0.7) * 0.06; // slight tremor while lining up the shot
  } else if (p.specialType === 'flail') {
    angle = (frame * 0.5) % (Math.PI * 2); // continuous overhead spin
  } else if (p.specialType === 'scythe') {
    const t = 1 - p.specialTimer / 30;
    angle = -1.5 + t * 3.0; // one big wide sweep
  } else if (w.ranged) {
    angle = bowAimAngle; // always pointed at the aim direction outside of specials
  } else if (p.attackWindup > 0) {
    const t = 1 - p.attackWindup / w.windup;
    angle = -0.9 + t * 1.6;
  } else if (p.attacking) {
    angle = 0.7;
  }
  ctx.save();
  ctx.translate(p.w/2-6, -2);
  ctx.rotate(angle);
  if (w.key === 'sword') {
    ctx.fillStyle = '#8a8f99';
    ctx.fillRect(0, -2, 34, 4);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, -3, 8, 6);
  } else if (w.key === 'hammer') {
    ctx.fillStyle = '#7a5a3a';
    ctx.fillRect(0, -2, 26, 4);
    ctx.fillStyle = '#6b6f76';
    ctx.fillRect(22, -9, 16, 18);
  } else if (w.key === 'spear') {
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-4, -2, 46, 3);
    ctx.fillStyle = '#c9d6e3';
    ctx.beginPath();
    ctx.moveTo(42, -6); ctx.lineTo(52, 0); ctx.lineTo(42, 6);
    ctx.fill();
  } else if (w.key === 'dualdagger') {
    ctx.fillStyle = '#d94f6a';
    ctx.fillRect(0, -2, 26, 4);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, -3, 8, 6);
    ctx.save();
    ctx.rotate(-0.6);
    ctx.fillStyle = '#d94f6a';
    ctx.fillRect(0, -2, 22, 4);
    ctx.restore();
  } else if (w.key === 'greataxe') {
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(0, -2, 30, 4);
    ctx.fillStyle = '#5a6b7a';
    ctx.beginPath();
    ctx.moveTo(24, -16); ctx.quadraticCurveTo(48, -18, 44, 2);
    ctx.quadraticCurveTo(48, 20, 24, 18);
    ctx.quadraticCurveTo(30, 2, 24, -16);
    ctx.fill();
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  } else if (w.key === 'whip') {
    ctx.strokeStyle = '#8a4fd9';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let i = 1; i <= 5; i++) {
      const wig = Math.sin(frame * 0.4 + i * 0.8) * 3 * (i / 5);
      ctx.lineTo(i * 12, wig);
    }
    ctx.stroke();
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, -3, 8, 6);
  } else if (w.key === 'greatsword') {
    ctx.fillStyle = '#c9a24a';
    ctx.fillRect(0, -3, 48, 6);
    ctx.beginPath();
    ctx.moveTo(48, -6); ctx.lineTo(58, 0); ctx.lineTo(48, 6);
    ctx.fill();
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-14, -6, 16, 12);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-10, -3, 10, 6);
  } else if (w.key === 'trident') {
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-4, -2, 48, 4);
    ctx.fillStyle = '#4fb8c9';
    for (const oy of [-8, 0, 8]) {
      ctx.beginPath();
      ctx.moveTo(40, oy-2); ctx.lineTo(54, oy); ctx.lineTo(40, oy+2);
      ctx.fill();
    }
  } else if (w.key === 'katana') {
    ctx.fillStyle = '#e8e8ee';
    ctx.beginPath();
    ctx.moveTo(0, -2); ctx.quadraticCurveTo(24, -6, 46, -2);
    ctx.lineTo(46, 2); ctx.quadraticCurveTo(24, 0, 0, 2);
    ctx.fill();
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-8, -3, 10, 6);
  } else if (w.key === 'shortblade') {
    ctx.fillStyle = '#a9a9a9';
    ctx.beginPath();
    ctx.moveTo(0, -3); ctx.lineTo(22, 0); ctx.lineTo(0, 3);
    ctx.fill();
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, -3, 8, 6);
  } else if (w.key === 'bow') {
    ctx.strokeStyle = '#8a6a3a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 22, -1.1, 1.1);
    ctx.stroke();
    const drawBack = p.attackWindup > 0 ? (1 - p.attackWindup / w.windup) * 12 : (p.specialType === 'bow' ? 10 : 0);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(22*Math.cos(-1.1), 22*Math.sin(-1.1));
    ctx.lineTo(-drawBack, 0);
    ctx.lineTo(22*Math.cos(1.1), 22*Math.sin(1.1));
    ctx.stroke();
  } else if (w.key === 'flail') {
    ctx.strokeStyle = '#8a6a3a';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, 0); ctx.stroke();
    const swing = p.specialType === 'flail' ? Math.sin(frame*0.6)*0.8 : 0;
    ctx.save();
    ctx.translate(16, 0);
    ctx.rotate(0.6 + swing);
    ctx.strokeStyle = '#6a5a4a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(18,4); ctx.stroke();
    ctx.fillStyle = '#5a5f68';
    ctx.beginPath(); ctx.arc(20, 5, 8, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else if (w.key === 'scythe') {
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(-4, -3, 44, 6);
    ctx.fillStyle = '#8a1a2a';
    ctx.beginPath();
    ctx.moveTo(38, -4);
    ctx.quadraticCurveTo(58, -14, 52, 6);
    ctx.quadraticCurveTo(46, 2, 38, 4);
    ctx.fill();
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// Pulsing red ring + "!" mark used to telegraph an incoming enemy attack before it lands.
function drawAttackTelegraph(cx, cy, radius) {
  const pulse = 0.5 + 0.5 * Math.sin(frame * 0.9);
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.4 * pulse;
  ctx.strokeStyle = '#ff3b30';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, radius + pulse * 5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#ff3b30';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('!', cx, cy - radius - 10);
  ctx.textAlign = 'left';
}

function shadeColor(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  let r = Math.max(0, Math.min(255, (num >> 16) + Math.round(2.55*percent)));
  let g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + Math.round(2.55*percent)));
  let b = Math.max(0, Math.min(255, (num & 0xff) + Math.round(2.55*percent)));
  return `rgb(${r},${g},${b})`;
}

// Bosses get their own bigger, more elaborate silhouette instead of a scaled-up mob:
// a four-legged horned beast for ground bosses, a winged horned dragon for flying ones,
// plus a pulsing dark aura underneath to read as unmistakably "boss" at a glance.
function drawBossCreature(en) {
  if (en.exploding) {
    const warnPct = en.explodeTimer / 30;
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, 14 + (1-warnPct) * (en.explodeRadius || 130));
  } else if (en.telegraph || en.charging) {
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, en.burst ? 56 : 40);
  }

  const pulse = 0.5 + 0.5 * Math.sin(frame * 0.07);
  ctx.save();
  ctx.globalAlpha = 0.28 + 0.14 * pulse;
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.ellipse(en.x + en.w/2, en.y + en.h + 4, en.w*0.62, 12, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(en.x, en.y);
  if (en.hitFlash > 0) ctx.filter = 'brightness(1.8)';
  // The beast/dragon art is drawn head-to-the-right by construction; mirror it
  // when facing left so the boss's head (not its tail) points at the player.
  if (en.dir < 0) {
    ctx.translate(en.w, 0);
    ctx.scale(-1, 1);
  }
  if (en.name === '熔岩土龍') drawLavaTitanBoss(en);
  else if (en.type === 'bomb') drawBossBeast(en);
  else drawBossDragon(en);
  ctx.restore();

  drawEnemyHp(en);
}

function drawBossBeast(en) {
  const cx = en.w/2, cy = en.h*0.58;
  const bodyW = en.w*0.62, bodyH = en.h*0.5;

  // tail with a spiked tip
  ctx.fillStyle = shadeColor(en.colorMain, -15);
  ctx.beginPath();
  ctx.moveTo(cx - bodyW*0.9, cy);
  ctx.quadraticCurveTo(cx - en.w*0.55, cy - en.h*0.15, cx - en.w*0.48, cy - en.h*0.42);
  ctx.quadraticCurveTo(cx - en.w*0.42, cy - en.h*0.1, cx - bodyW*0.7, cy + bodyH*0.2);
  ctx.fill();
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.moveTo(cx - en.w*0.5, cy - en.h*0.38);
  ctx.lineTo(cx - en.w*0.6, cy - en.h*0.52);
  ctx.lineTo(cx - en.w*0.44, cy - en.h*0.3);
  ctx.fill();

  // back legs (behind the body)
  ctx.fillStyle = shadeColor(en.colorMain, -25);
  roundRect(ctx, cx - bodyW*0.55, en.h*0.72, en.w*0.14, en.h*0.3, 4); ctx.fill();
  roundRect(ctx, cx + bodyW*0.35, en.h*0.72, en.w*0.14, en.h*0.3, 4); ctx.fill();

  // body
  ctx.fillStyle = en.colorMain;
  roundRect(ctx, cx - bodyW, cy - bodyH, bodyW*2, bodyH*1.5, bodyH*0.5);
  ctx.fill();
  ctx.strokeStyle = shadeColor(en.colorMain, -35);
  ctx.lineWidth = 2;
  roundRect(ctx, cx - bodyW, cy - bodyH, bodyW*2, bodyH*1.5, bodyH*0.5);
  ctx.stroke();

  // front legs with claws (in front of the body)
  ctx.fillStyle = shadeColor(en.colorMain, -10);
  roundRect(ctx, cx - bodyW*0.85, en.h*0.68, en.w*0.16, en.h*0.34, 4); ctx.fill();
  roundRect(ctx, cx + bodyW*0.55, en.h*0.68, en.w*0.16, en.h*0.34, 4); ctx.fill();
  ctx.fillStyle = en.colorAccent;
  for (const lx of [cx - bodyW*0.85, cx + bodyW*0.55]) {
    ctx.beginPath();
    ctx.moveTo(lx-2, en.h*1.02); ctx.lineTo(lx+en.w*0.16+2, en.h*1.02); ctx.lineTo(lx+en.w*0.08, en.h*1.1);
    ctx.fill();
  }

  // spine spikes
  ctx.fillStyle = en.colorAccent;
  for (let i = 0; i < 5; i++) {
    const sx = cx - bodyW*0.7 + i*(bodyW*1.4/4);
    const sh = bodyH*0.5 * (1 - Math.abs(i-2)/3);
    ctx.beginPath();
    ctx.moveTo(sx-6, cy-bodyH*0.85);
    ctx.lineTo(sx+6, cy-bodyH*0.85);
    ctx.lineTo(sx, cy-bodyH*0.85-sh-10);
    ctx.fill();
  }

  // head with horns and glowing eyes
  const hx = cx + bodyW*0.9, hy = cy - bodyH*0.55;
  ctx.fillStyle = en.colorMain;
  ctx.beginPath();
  ctx.ellipse(hx, hy, en.w*0.24, en.h*0.2, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = shadeColor(en.colorMain, 8);
  roundRect(ctx, hx + en.w*0.1, hy - en.h*0.06, en.w*0.22, en.h*0.16, 6);
  ctx.fill();
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.moveTo(hx - en.w*0.05, hy - en.h*0.16);
  ctx.lineTo(hx + en.w*0.02, hy - en.h*0.42);
  ctx.lineTo(hx + en.w*0.1, hy - en.h*0.16);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx + en.w*0.1, hy - en.h*0.16);
  ctx.lineTo(hx + en.w*0.2, hy - en.h*0.4);
  ctx.lineTo(hx + en.w*0.24, hy - en.h*0.14);
  ctx.fill();
  const eyeGlow = en.telegraph ? (0.6 + 0.4*Math.sin(frame*0.8)) : 1;
  ctx.globalAlpha = eyeGlow;
  ctx.beginPath(); ctx.arc(hx+en.w*0.05, hy-en.h*0.02, 3.4, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = shadeColor(en.colorMain, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(hx + en.w*0.1, hy + en.h*0.08);
  ctx.lineTo(hx + en.w*0.3, hy + en.h*0.1);
  ctx.stroke();
}

// 熔岩土龍's own silhouette, built off a reference of a hunched, rock-scaled dragon
// with folded bat wings and lava dripping from its jaw and one melting foreleg -
// distinct from the shared drawBossBeast used by the other ground-type boss.
function drawLavaTitanBoss(en) {
  const cx = en.w/2, cy = en.h*0.58;
  const bodyW = en.w*0.62, bodyH = en.h*0.5;

  // tail with a spiked tip
  ctx.fillStyle = shadeColor(en.colorMain, -15);
  ctx.beginPath();
  ctx.moveTo(cx - bodyW*0.9, cy);
  ctx.quadraticCurveTo(cx - en.w*0.55, cy - en.h*0.15, cx - en.w*0.48, cy - en.h*0.42);
  ctx.quadraticCurveTo(cx - en.w*0.42, cy - en.h*0.1, cx - bodyW*0.7, cy + bodyH*0.2);
  ctx.fill();
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.moveTo(cx - en.w*0.5, cy - en.h*0.38);
  ctx.lineTo(cx - en.w*0.6, cy - en.h*0.52);
  ctx.lineTo(cx - en.w*0.44, cy - en.h*0.3);
  ctx.fill();

  // back legs (behind the body)
  ctx.fillStyle = shadeColor(en.colorMain, -25);
  roundRect(ctx, cx - bodyW*0.55, en.h*0.72, en.w*0.14, en.h*0.3, 4); ctx.fill();
  roundRect(ctx, cx + bodyW*0.35, en.h*0.72, en.w*0.14, en.h*0.3, 4); ctx.fill();

  // hunched, craggy body
  ctx.fillStyle = en.colorMain;
  roundRect(ctx, cx - bodyW, cy - bodyH, bodyW*2, bodyH*1.5, bodyH*0.5);
  ctx.fill();
  ctx.strokeStyle = shadeColor(en.colorMain, -35);
  ctx.lineWidth = 2;
  roundRect(ctx, cx - bodyW, cy - bodyH, bodyW*2, bodyH*1.5, bodyH*0.5);
  ctx.stroke();

  // folded bat wings, layered over the back with visible rib lines
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(cx + side*bodyW*0.42, cy - bodyH*0.45);
    ctx.scale(side, 1);
    ctx.beginPath();
    ctx.moveTo(-en.w*0.05, en.h*0.32);
    ctx.lineTo(en.w*0.22, -en.h*0.42);
    ctx.lineTo(en.w*0.12, -en.h*0.08);
    ctx.lineTo(en.w*0.22, en.h*0.1);
    ctx.lineTo(en.w*0.08, en.h*0.2);
    ctx.lineTo(en.w*0.14, en.h*0.36);
    ctx.closePath();
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = shadeColor(en.colorMain, -32);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = shadeColor(en.colorMain, -55);
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-en.w*0.02, en.h*0.28);
    ctx.lineTo(en.w*0.2, -en.h*0.36);
    ctx.moveTo(0, en.h*0.14);
    ctx.lineTo(en.w*0.18, -en.h*0.04);
    ctx.stroke();
    ctx.restore();
  }

  // dense rocky scutes across the back, denser than a normal spine ridge
  ctx.fillStyle = shadeColor(en.colorMain, -18);
  for (let i = 0; i < 9; i++) {
    const sx = cx - bodyW*0.85 + i * (bodyW*1.7/8);
    const sh = bodyH*0.28 + bodyH*0.22 * Math.abs(Math.sin(i*2.3));
    ctx.beginPath();
    ctx.moveTo(sx-5, cy-bodyH*0.85);
    ctx.lineTo(sx+5, cy-bodyH*0.85);
    ctx.lineTo(sx, cy-bodyH*0.85-sh-8);
    ctx.fill();
  }

  // front legs - the forward one is half-melted, glowing and dripping lava
  ctx.fillStyle = shadeColor(en.colorMain, -10);
  roundRect(ctx, cx - bodyW*0.85, en.h*0.68, en.w*0.16, en.h*0.34, 4); ctx.fill();
  const moltenPulse = 0.7 + 0.3 * Math.sin(frame*0.15);
  ctx.save();
  ctx.globalAlpha = moltenPulse;
