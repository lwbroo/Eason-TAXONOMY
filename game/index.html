  ctx.fillStyle = en.colorAccent;
  roundRect(ctx, cx + bodyW*0.55, en.h*0.68, en.w*0.16, en.h*0.34, 4); ctx.fill();
  ctx.restore();
  ctx.fillStyle = shadeColor(en.colorMain, -10);
  roundRect(ctx, cx - bodyW*0.85, en.h*0.68, en.w*0.16, en.h*0.12, 4); ctx.fill();
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.moveTo(cx-bodyW*0.85-2, en.h*1.02); ctx.lineTo(cx-bodyW*0.85+en.w*0.16+2, en.h*1.02); ctx.lineTo(cx-bodyW*0.85+en.w*0.08, en.h*1.1);
  ctx.fill();
  // lava drips off the molten claw
  for (const dx of [0, 7, 14]) {
    const dripLen = 5 + 4 * Math.sin(frame*0.1 + dx);
    ctx.beginPath();
    ctx.moveTo(cx + bodyW*0.55 + dx, en.h*1.02 + 2);
    ctx.lineTo(cx + bodyW*0.55 + dx + 3, en.h*1.02 + 2 + dripLen);
    ctx.lineTo(cx + bodyW*0.55 + dx - 3, en.h*1.02 + 2 + dripLen);
    ctx.fill();
  }

  // head with craggy brow, horns, glowing eye, and a molten lower jaw -
  // kept close to the body with a snout bridge so it reads as one connected beast
  const hx = cx + bodyW*0.78, hy = cy - bodyH*0.5;
  ctx.fillStyle = en.colorMain;
  ctx.beginPath();
  ctx.ellipse(hx, hy, en.w*0.24, en.h*0.2, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = shadeColor(en.colorMain, -10);
  roundRect(ctx, hx + en.w*0.08, hy - en.h*0.05, en.w*0.16, en.h*0.14, 5);
  ctx.fill();
  ctx.fillStyle = shadeColor(en.colorMain, -18);
  for (let i = 0; i < 3; i++) {
    const bx = hx - en.w*0.1 + i * en.w*0.08;
    ctx.beginPath();
    ctx.moveTo(bx-4, hy-en.h*0.16); ctx.lineTo(bx+4, hy-en.h*0.16); ctx.lineTo(bx, hy-en.h*0.28);
    ctx.fill();
  }
  // glowing molten lower jaw, bridging out from the snout like dripping magma
  const jawGlow = 0.75 + 0.25 * Math.sin(frame*0.2);
  ctx.save();
  ctx.globalAlpha = jawGlow;
  ctx.fillStyle = en.colorAccent;
  roundRect(ctx, hx + en.w*0.05, hy + en.h*0.05, en.w*0.18, en.h*0.11, 5);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = en.colorAccent;
  for (const dx of [0, 6, 12]) {
    const dripLen = 3 + 3 * Math.sin(frame*0.13 + dx);
    ctx.beginPath();
    ctx.moveTo(hx+en.w*0.06+dx, hy+en.h*0.16);
    ctx.lineTo(hx+en.w*0.06+dx+2, hy+en.h*0.16+dripLen);
    ctx.lineTo(hx+en.w*0.06+dx-2, hy+en.h*0.16+dripLen);
    ctx.fill();
  }
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.moveTo(hx - en.w*0.05, hy - en.h*0.16);
  ctx.lineTo(hx + en.w*0.02, hy - en.h*0.42);
  ctx.lineTo(hx + en.w*0.1, hy - en.h*0.16);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx + en.w*0.1, hy - en.h*0.16);
  ctx.lineTo(hx + en.w*0.2, hy - en.h*0.4);
  ctx.lineTo(hx + en.w*0.24, hy - en.h*0.14);
  ctx.fill();
  const eyeGlow = en.telegraph ? (0.6 + 0.4*Math.sin(frame*0.8)) : 1;
  ctx.globalAlpha = eyeGlow;
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath(); ctx.arc(hx+en.w*0.02, hy-en.h*0.08, 3.4, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawBossDragon(en) {
  const cx = en.w/2, cy = en.h/2;
  const flap = Math.sin(frame*0.15) * 0.5;

  // tail
  ctx.fillStyle = shadeColor(en.colorMain, -15);
  ctx.beginPath();
  ctx.moveTo(cx - en.w*0.4, cy);
  ctx.quadraticCurveTo(cx - en.w*0.75, cy + en.h*0.1, cx - en.w*0.95, cy - en.h*0.15);
  ctx.quadraticCurveTo(cx - en.w*0.7, cy + en.h*0.05, cx - en.w*0.35, cy + en.h*0.15);
  ctx.fill();

  // wings (behind the body, flapping)
  ctx.fillStyle = shadeColor(en.colorMain, -20);
  ctx.save();
  ctx.translate(cx - en.w*0.1, cy);
  ctx.rotate(-0.5 - flap);
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(-en.w*0.55, -en.h*0.35); ctx.lineTo(-en.w*0.5, en.h*0.05); ctx.lineTo(-en.w*0.2, en.h*0.15);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(cx - en.w*0.1, cy);
  ctx.rotate(0.5 + flap);
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(-en.w*0.55, en.h*0.35); ctx.lineTo(-en.w*0.5, -en.h*0.05); ctx.lineTo(-en.w*0.2, -en.h*0.15);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // body + lighter belly
  ctx.fillStyle = en.colorMain;
  roundRect(ctx, cx-en.w*0.42, cy-en.h*0.34, en.w*0.75, en.h*0.68, en.h*0.3);
  ctx.fill();
  ctx.strokeStyle = shadeColor(en.colorMain, -35);
  ctx.lineWidth = 2;
  roundRect(ctx, cx-en.w*0.42, cy-en.h*0.34, en.w*0.75, en.h*0.68, en.h*0.3);
  ctx.stroke();
  ctx.fillStyle = shadeColor(en.colorMain, 20);
  roundRect(ctx, cx-en.w*0.3, cy-en.h*0.05, en.w*0.5, en.h*0.32, en.h*0.14);
  ctx.fill();

  // head with horns and glowing eyes
  const hx = cx + en.w*0.42, hy = cy - en.h*0.1;
  ctx.fillStyle = en.colorMain;
  ctx.beginPath();
  ctx.ellipse(hx, hy, en.w*0.2, en.h*0.22, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.moveTo(hx-en.w*0.06, hy-en.h*0.18); ctx.lineTo(hx-en.w*0.02, hy-en.h*0.42); ctx.lineTo(hx+en.w*0.06, hy-en.h*0.18);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx+en.w*0.08, hy-en.h*0.18); ctx.lineTo(hx+en.w*0.14, hy-en.h*0.4); ctx.lineTo(hx+en.w*0.2, hy-en.h*0.16);
  ctx.fill();
  const eyeGlow = en.charging ? (0.6 + 0.4*Math.sin(frame*0.8)) : 1;
  ctx.globalAlpha = eyeGlow;
  ctx.beginPath(); ctx.arc(hx+en.w*0.06, hy-en.h*0.02, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = shadeColor(en.colorMain, 6);
  roundRect(ctx, hx+en.w*0.14, hy-en.h*0.06, en.w*0.16, en.h*0.14, 4);
  ctx.fill();
}

function drawBuriedMound(en) {
  ctx.save();
  ctx.translate(en.x, en.y);
  const cx = en.w/2, cy = en.h;
  ctx.fillStyle = 'rgba(30,20,10,0.5)';
  ctx.beginPath(); ctx.ellipse(cx, cy, en.w*0.5, 6, 0, 0, Math.PI*2); ctx.fill();
  // a couple of leaf tips poking out of the dirt, swaying gently until it's triggered
  ctx.strokeStyle = en.colorAccent;
  ctx.lineWidth = 2;
  const sway = Math.sin(frame*0.08) * 2;
  ctx.beginPath();
  ctx.moveTo(cx-5, cy); ctx.quadraticCurveTo(cx-5+sway, cy-10, cx-3, cy-15);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx+5, cy); ctx.quadraticCurveTo(cx+5-sway, cy-8, cx+7, cy-13);
  ctx.stroke();
  ctx.restore();
}

// Molten, legless blob body for the 'lava' kind: a wobbling amorphous outline with
// glowing cracks instead of the generic robot's rigid limbs.
function drawLavaBlobBody(en, maxWindup) {
  const cx = en.w/2, cy = en.h/2 + en.h*0.14;
  const baseR = en.w/2 - 2;

  ctx.beginPath();
  const pts = 10;
  for (let i = 0; i <= pts; i++) {
    const ang = (Math.PI*2*i)/pts;
    const wob = Math.sin(frame*0.12 + i*1.7) * baseR*0.15;
    const flatten = Math.max(0, Math.sin(ang)) * baseR*0.18;
    const r = baseR + wob - flatten;
    const px = cx + Math.cos(ang)*r, py = cy + Math.sin(ang)*r*0.92;
    if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle = en.colorMain;
  ctx.fill();
  ctx.strokeStyle = shadeColor(en.colorMain, -30);
  ctx.lineWidth = 1;
  ctx.stroke();

  // glowing molten cracks
  ctx.strokeStyle = en.colorAccent;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.7 + 0.3*Math.sin(frame*0.2);
  for (const [ox,oy,l] of [[-8,-3,10],[6,-7,9],[-1,5,8]]) {
    ctx.beginPath();
    ctx.moveTo(cx+ox, cy+oy);
    ctx.lineTo(cx+ox+l*0.4, cy+oy+l*0.6);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // small drips along the base
  ctx.fillStyle = en.colorAccent;
  for (const dx of [-baseR*0.5, 0, baseR*0.5]) {
    const drip = 2.5 + Math.max(0, Math.sin(frame*0.1 + dx));
    ctx.beginPath();
    ctx.ellipse(cx+dx, cy+baseR*0.8, 3, drip, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // glowing eyes
  ctx.fillStyle = '#fff6d0';
  ctx.beginPath(); ctx.arc(cx-6, cy-4, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+6, cy-4, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3a1408';
  ctx.beginPath(); ctx.arc(cx-6+en.dir, cy-4, 1.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+6+en.dir, cy-4, 1.3, 0, Math.PI*2); ctx.fill();

  // a glob rears up on the throwing side during the windup telegraph
  if (en.telegraph) {
    const t = 1 - en.attackWindup / maxWindup;
    ctx.fillStyle = en.colorAccent;
    ctx.beginPath();
    ctx.arc(cx + en.dir*baseR*0.7, cy - baseR*0.6 - t*14, 5, 0, Math.PI*2);
    ctx.fill();
  }
}

// Crab body for the 'shell' kind: wide flat body, a shell dome layered on top, scuttling
// legs, and a pair of pincers (one raised during the windup telegraph).
function drawCrabBodyShape(en, maxWindup) {
  const cx = en.w/2, cy = en.h/2 + en.h*0.16;
  const bx = en.w*0.42, by = en.h*0.3;

  // scuttling legs
  ctx.strokeStyle = shadeColor(en.colorMain, -30);
  ctx.lineWidth = 2.5;
  for (let i = 0; i < 3; i++) {
    const legPhase = Math.sin(frame*0.25 + i) * 3;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + side*bx*0.7, cy + by*0.3);
      ctx.lineTo(cx + side*(bx*1.1 + i*4), cy + by*0.85 + legPhase);
      ctx.stroke();
    }
  }

  // the "extra" shell dome sitting on top of the crab's body
  ctx.fillStyle = shadeColor(en.colorMain, -12);
  ctx.beginPath();
  ctx.ellipse(cx, cy - by*0.5, bx*0.85, by*0.75, 0, Math.PI, 0);
  ctx.fill();
  ctx.strokeStyle = shadeColor(en.colorMain, -35);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(cx, cy - by*0.5, bx*0.85, by*0.75, 0, Math.PI, 0);
  ctx.stroke();

  // body
  ctx.fillStyle = en.colorMain;
  ctx.beginPath(); ctx.ellipse(cx, cy, bx, by, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = shadeColor(en.colorMain, -35);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(cx, cy, bx, by, 0, 0, Math.PI*2); ctx.stroke();

  // pincers - the one on the attacking side winds up before the hit
  for (const side of [-1, 1]) {
    const isAttackSide = side === en.dir;
    ctx.save();
    ctx.translate(cx + side*bx*0.95, cy - by*0.05);
    let angle = side * 0.45;
    if (en.telegraph && isAttackSide) {
      const t = 1 - en.attackWindup / maxWindup;
      angle = side * (0.45 - t * 1.7);
    }
    ctx.rotate(angle);
    ctx.fillStyle = en.colorAccent;
    ctx.beginPath();
    ctx.moveTo(0, -5); ctx.lineTo(side*15, -5); ctx.lineTo(side*15, 5); ctx.lineTo(0, 5);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(side*13, -6); ctx.lineTo(side*21, -3); ctx.lineTo(side*13, 1);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(side*13, 6); ctx.lineTo(side*21, 3); ctx.lineTo(side*13, -1);
    ctx.fill();
    ctx.restore();
  }

  // eyes on stalks poking above the shell
  ctx.strokeStyle = shadeColor(en.colorMain, -20);
  ctx.lineWidth = 2;
  for (const ox of [-6, 6]) {
    ctx.beginPath();
    ctx.moveTo(cx+ox, cy - by*0.8); ctx.lineTo(cx+ox, cy - by*1.3);
    ctx.stroke();
  }
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx-6, cy-by*1.35, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+6, cy-by*1.35, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(cx-6, cy-by*1.35, 1.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+6, cy-by*1.35, 1.3, 0, Math.PI*2); ctx.fill();
}

function drawBombBot(en) {
  if (en.buried && !en.emerging) { drawBuriedMound(en); return; }

  const maxWindup = en.burst ? 50 : 30;
  if (en.exploding) {
    const warnPct = en.explodeTimer / 30;
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, 14 + (1-warnPct) * (en.explodeRadius || 76));
  } else if (en.telegraph) {
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, en.isBoss ? 34 : 22);
  }
  ctx.save();
  ctx.translate(en.x, en.y);
  if (en.emerging) {
    ctx.fillStyle = 'rgba(30,20,10,0.5)';
    ctx.beginPath(); ctx.ellipse(en.w/2, en.h, en.w*0.5, 6, 0, 0, Math.PI*2); ctx.fill();
    const revealed = Math.max(3, (1 - en.emergeTimer / en.emergeDuration) * en.h);
    ctx.beginPath();
    ctx.rect(0, en.h - revealed, en.w, revealed);
    ctx.clip();
  }
  if (en.hitFlash > 0) ctx.filter = 'brightness(2)';

  if (en.kind === 'lava') { drawLavaBlobBody(en, maxWindup); ctx.restore(); drawEnemyHp(en); return; }
  if (en.kind === 'shell') { drawCrabBodyShape(en, maxWindup); ctx.restore(); drawEnemyHp(en); return; }

  const bodyR = en.w/2 - 2;
  const cx = en.w/2, cy = en.h/2 + en.h*0.1;

  // legs
  ctx.fillStyle = shadeColor(en.colorMain, -30);
  roundRect(ctx, cx-en.w*0.29, en.h-8, en.w*0.18, 12, 2); ctx.fill();
  roundRect(ctx, cx+en.w*0.11, en.h-8, en.w*0.18, 12, 2); ctx.fill();
  ctx.fillStyle = shadeColor(en.colorMain, -50);
  roundRect(ctx, cx-en.w*0.34, en.h+1, en.w*0.26, 4, 2); ctx.fill();
  roundRect(ctx, cx+en.w*0.08, en.h+1, en.w*0.26, 4, 2); ctx.fill();

  // resting arm, tucked mostly behind the round torso on the side opposite the attack
  ctx.fillStyle = en.colorMain;
  roundRect(ctx, cx + (-en.dir)*bodyR*0.7 - 4, en.h/2-2, 8, 13, 3); ctx.fill();

  // body
  ctx.fillStyle = en.colorMain;
  ctx.beginPath(); ctx.arc(cx, cy, bodyR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = shadeColor(en.colorMain, -40);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, bodyR, 0, Math.PI*2); ctx.stroke();

  // attacking arm - winds up and back before releasing
  ctx.save();
  ctx.translate(cx + en.dir*bodyR*0.6, en.h/2+2);
  let armAngle = en.dir * 0.5;
  if (en.telegraph) {
    const t = 1 - en.attackWindup / maxWindup;
    armAngle = en.dir * (0.5 - t * 2.1);
  }
  ctx.rotate(armAngle);
  ctx.fillStyle = en.colorMain;
  roundRect(ctx, -4, 0, 8, 15, 3);
  ctx.fill();
  if (en.telegraph && en.attackMode !== 'melee') {
    ctx.fillStyle = shadeColor(en.colorMain, -50);
    ctx.beginPath(); ctx.arc(0, 17, 5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // face: the classic cross-bolt for the bomb-bot kind, simple monster eyes for everything else
  if (en.kind === 'bomb') {
    ctx.strokeStyle = en.colorAccent;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx-8, cy-6); ctx.lineTo(cx+8, cy+6);
    ctx.moveTo(cx+8, cy-6); ctx.lineTo(cx-8, cy+6);
    ctx.stroke();
    ctx.strokeStyle = '#c9a24a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy-bodyR);
    ctx.quadraticCurveTo(cx+6, cy-bodyR-9, cx+2, cy-bodyR-13);
    ctx.stroke();
    ctx.fillStyle = frame%10<5 ? '#ff5a3c' : '#ffcf4a';
    ctx.beginPath(); ctx.arc(cx+2, cy-bodyR-14, 3, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = en.colorAccent;
    ctx.beginPath(); ctx.arc(cx-6, cy-4, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+6, cy-4, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(cx-6, cy-4, 1.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+6, cy-4, 1.4, 0, Math.PI*2); ctx.fill();
    if (en.kind === 'vine' || en.kind === 'lurkvine') {
      ctx.fillStyle = shadeColor(en.colorMain, -20);
      for (const ox of [-8, 0, 8]) {
        ctx.beginPath();
        ctx.moveTo(cx+ox-3, cy-bodyR+4); ctx.lineTo(cx+ox+3, cy-bodyR+4); ctx.lineTo(cx+ox, cy-bodyR-6);
        ctx.fill();
      }
    } else if (en.kind === 'wolf') {
      ctx.fillStyle = shadeColor(en.colorMain, -15);
      ctx.beginPath();
      ctx.moveTo(cx-bodyR*0.6, cy-bodyR*0.7); ctx.lineTo(cx-bodyR*0.9, cy-bodyR*1.3); ctx.lineTo(cx-bodyR*0.3, cy-bodyR*0.9);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx+bodyR*0.6, cy-bodyR*0.7); ctx.lineTo(cx+bodyR*0.9, cy-bodyR*1.3); ctx.lineTo(cx+bodyR*0.3, cy-bodyR*0.9);
      ctx.fill();
    }
  }

  // treads/base
  ctx.fillStyle = shadeColor(en.colorMain, -35);
  ctx.fillRect(2, en.h-6, en.w-4, 6);
  ctx.restore();

  drawEnemyHp(en);
}

// Humanoid robed caster for the 'mage' kind: hooded silhouette hovering instead of the
// generic drone box, holding a staff that glows brighter as its cast telegraph builds.
function drawMageBody(en) {
  const cx = en.w/2, cy = en.h/2;
  const bob = Math.sin(en.phase) * 2;

  // flowing robe
  ctx.fillStyle = en.colorMain;
  ctx.beginPath();
  ctx.moveTo(cx - en.w*0.22, cy - en.h*0.15 + bob);
  ctx.lineTo(cx + en.w*0.22, cy - en.h*0.15 + bob);
  ctx.quadraticCurveTo(cx + en.w*0.34, cy + en.h*0.55 + bob, cx + en.w*0.16, cy + en.h*0.62 + bob);
  ctx.lineTo(cx - en.w*0.16, cy + en.h*0.62 + bob);
  ctx.quadraticCurveTo(cx - en.w*0.34, cy + en.h*0.55 + bob, cx - en.w*0.22, cy - en.h*0.15 + bob);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = shadeColor(en.colorMain, -30);
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // hood and dark face void with glowing eyes
  ctx.fillStyle = shadeColor(en.colorMain, -10);
  ctx.beginPath();
  ctx.arc(cx, cy - en.h*0.28 + bob, en.w*0.2, Math.PI, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#1a1424';
  ctx.beginPath();
  ctx.arc(cx, cy - en.h*0.2 + bob, en.w*0.15, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = en.charging ? (0.6 + 0.4*Math.sin(frame*0.8)) : 0.9;
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath(); ctx.arc(cx-4, cy-en.h*0.2+bob, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+4, cy-en.h*0.2+bob, 2, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // staff, raised on the attacking side, orb glowing brighter mid-cast
  ctx.save();
  ctx.translate(cx + en.dir*en.w*0.3, cy + bob);
  let staffAngle = en.dir * 0.15;
  if (en.charging) staffAngle = en.dir * (0.15 - (1 - en.chargeTimer/20) * 0.5);
  ctx.rotate(staffAngle);
  ctx.strokeStyle = '#6a5030';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, -en.h*0.35); ctx.lineTo(0, en.h*0.35); ctx.stroke();
  ctx.fillStyle = en.colorAccent;
  ctx.globalAlpha = en.charging ? (0.7 + 0.3*Math.sin(frame*0.9)) : 0.85;
  ctx.beginPath(); ctx.arc(0, -en.h*0.38, en.charging ? 6 : 4, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

// Sleek swallow silhouette for the 'bird' kind: pointed body, swept wings that flutter
// much faster than the other flyers, and a forked tail trailing the direction of travel.
function drawSwallowBody(en) {
  const cx = en.w/2, cy = en.h/2;
  const flap = Math.sin(frame*0.6) * 0.7;

  // forked tail trailing behind
  ctx.fillStyle = en.colorMain;
  ctx.save();
  ctx.translate(cx - en.dir*en.w*0.42, cy);
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(-en.dir*14,-7); ctx.lineTo(-en.dir*6,0); ctx.lineTo(-en.dir*14,7);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // sleek pointed body
  ctx.beginPath();
  ctx.moveTo(cx + en.dir*en.w*0.55, cy);
  ctx.quadraticCurveTo(cx, cy - en.h*0.5, cx - en.dir*en.w*0.4, cy - en.h*0.1);
  ctx.quadraticCurveTo(cx, cy + en.h*0.5, cx + en.dir*en.w*0.55, cy);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = shadeColor(en.colorMain, -25);
  ctx.lineWidth = 1;
  ctx.stroke();

  // fast-flapping swept-back wings
  ctx.fillStyle = en.colorAccent;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.5 - flap);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-en.w*0.6,-en.h*0.3); ctx.lineTo(-en.w*0.45, en.h*0.15); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(0.5 + flap);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-en.w*0.6, en.h*0.3); ctx.lineTo(-en.w*0.45, -en.h*0.15); ctx.closePath(); ctx.fill();
  ctx.restore();

  // pale belly patch + beak
  ctx.beginPath();
  ctx.ellipse(cx - en.dir*en.w*0.05, cy + en.h*0.1, en.w*0.18, en.h*0.2, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#f0b23a';
  ctx.beginPath();
  ctx.moveTo(cx + en.dir*en.w*0.5, cy-2); ctx.lineTo(cx + en.dir*en.w*0.62, cy); ctx.lineTo(cx + en.dir*en.w*0.5, cy+2);
  ctx.fill();
}

function drawDrone(en) {
  if (en.charging) {
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, en.isBoss ? 30 : 20);
  }
  ctx.save();
  ctx.translate(en.x, en.y);
  if (en.hitFlash > 0) ctx.filter = 'brightness(2)';
  if (en.charging) ctx.filter = 'brightness(1.6) saturate(1.4)';

  if (en.kind === 'mage') { drawMageBody(en); ctx.restore(); drawEnemyHp(en); return; }
  if (en.kind === 'bird') { drawSwallowBody(en); ctx.restore(); drawEnemyHp(en); return; }

  ctx.fillStyle = en.colorMain;
  roundRect(ctx, 4, 4, en.w-8, en.h-10, 4);
  ctx.fill();
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.arc(en.w/2, en.h/2, 3, 0, Math.PI*2);
  ctx.fill();

  if (en.kind === 'tentacle') {
    ctx.strokeStyle = en.colorMain;
    ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
      const tx = 6 + i*(en.w-12)/3;
      const wig = Math.sin(frame*0.15 + i) * 4;
      ctx.beginPath();
      ctx.moveTo(tx, en.h-6);
      ctx.quadraticCurveTo(tx+wig, en.h+6, tx+wig*0.6, en.h+14);
      ctx.stroke();
    }
  } else if (en.kind === 'owl' || en.kind === 'dragon') {
    const flap = Math.sin(frame*0.3) * 0.6;
    ctx.fillStyle = en.colorAccent;
    ctx.save(); ctx.translate(2, en.h/2); ctx.rotate(-0.3 - flap);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-14,-4); ctx.lineTo(-10,6); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(en.w-2, en.h/2); ctx.rotate(0.3 + flap);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(14,-4); ctx.lineTo(10,6); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(en.w/2-6, en.h/2-2, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(en.w/2+6, en.h/2-2, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath(); ctx.arc(en.w/2-6, en.h/2-2, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(en.w/2+6, en.h/2-2, 2, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.strokeStyle = shadeColor(en.colorMain, -40);
    ctx.lineWidth = 2;
    const spin = (frame*0.9) % (Math.PI*2);
    [[0,0],[en.w,0],[0,en.h-6],[en.w,en.h-6]].forEach(([ax,ay])=>{
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(spin);
      ctx.beginPath();
      ctx.moveTo(-6,0); ctx.lineTo(6,0);
      ctx.stroke();
      ctx.restore();
    });
  }
  ctx.restore();

  drawEnemyHp(en);
}

function drawEnemyHp(en) {
  const bw = en.w;
  if (en.isBoss && en.name) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(en.name, en.x + en.w/2, en.y - 16);
    ctx.textAlign = 'left';
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(en.x, en.y-10, bw, 5);
  ctx.fillStyle = '#e0453f';
  ctx.fillRect(en.x, en.y-10, bw * Math.max(0,en.hp/en.maxHp), 5);
}

function drawPlatform(p) {
  ctx.fillStyle = p.floating ? 'rgba(230,230,245,0.85)' : 'rgba(235,235,245,0.92)';
  ctx.fillRect(p.x - camera.x, p.y, p.w, H - p.y + 40);
  ctx.strokeStyle = 'rgba(40,40,60,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(p.x - camera.x, p.y, p.w, 4);
}

function drawBossGateHint() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  const text = `擊敗 ${LEVEL_DEFS[currentLevelId].bossName} 後，回村莊的傳送門才會出現`;
  const w = ctx.measureText(text).width + 24;
  roundRect(ctx, W/2 - w/2, 10, w, 26, 6);
  ctx.fill();
  ctx.fillStyle = '#ffcf4a';
  ctx.font = '12px sans-serif';
  ctx.fillText(text, W/2, 28);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawPortal(x, groundY) {
  ctx.save();
  ctx.translate(x - camera.x, groundY);
  const pulse = 0.5 + 0.5 * Math.sin(frame * 0.06);

  // stone archway frame
  ctx.fillStyle = '#4a4258';
  roundRect(ctx, -58, -190, 24, 190, 8); ctx.fill();
  roundRect(ctx, 34, -190, 24, 190, 8); ctx.fill();
  roundRect(ctx, -58, -206, 116, 26, 10); ctx.fill();

  // outer glow
  ctx.fillStyle = `rgba(150,90,255,${0.22 + 0.13*pulse})`;
  ctx.beginPath(); ctx.ellipse(-12, -100, 60, 94, 0, 0, Math.PI*2); ctx.fill();

  // swirling portal disc
  const grad = ctx.createRadialGradient(-12, -100, 4, -12, -100, 46);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.45, '#c9a2ff');
  grad.addColorStop(1, '#5a2fae');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(-12, -100, 42, 78, 0, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const t = (frame * 0.03 + i / 3) % 1;
    ctx.globalAlpha = 1 - t;
    ctx.beginPath();
    ctx.ellipse(-12, -100, 42 * (1 - t) + 4, 78 * (1 - t) + 4, 0, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color || '#ffdd88';
    ctx.beginPath();
    ctx.arc(p.x-camera.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMoon(cx, cy) {
  const R = 150;
  ctx.fillStyle = 'rgba(244,206,120,0.30)';
  ctx.beginPath(); ctx.arc(cx, cy, R*1.42, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(230,150,90,0.40)';
  ctx.beginPath(); ctx.arc(cx, cy, R*1.22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(96,140,205,0.42)';
  ctx.beginPath(); ctx.arc(cx, cy, R*1.06, 0, Math.PI*2); ctx.fill();
  // flat-shaded moon body (a touch of gradient, same restrained style as the dragon's belly panel)
  const body = ctx.createRadialGradient(cx-R*0.3, cy-R*0.3, R*0.2, cx, cy, R);
  body.addColorStop(0, '#c97a5c');
  body.addColorStop(1, '#a3573d');
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  const craters = [[-0.32,-0.22,0.22],[0.26,-0.12,0.15],[-0.08,0.32,0.16],[0.36,0.3,0.1],[0.02,-0.02,0.09]];
  for (const [ox,oy,r] of craters) {
    ctx.beginPath(); ctx.arc(cx+ox*R, cy+oy*R, r*R, 0, Math.PI*2); ctx.fill();
  }
}

function drawFocal(kind, cx, cy) {
  if (kind === 'volcano') {
    const R = 150;
    ctx.fillStyle = 'rgba(255,140,60,0.30)';
    ctx.beginPath(); ctx.arc(cx, cy+40, R*1.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a1710';
    ctx.beginPath();
    ctx.moveTo(cx-R*1.1, cy+R*0.9);
    ctx.lineTo(cx-R*0.3, cy-R*0.9);
    ctx.lineTo(cx+R*0.3, cy-R*0.9);
    ctx.lineTo(cx+R*1.1, cy+R*0.9);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff7a2e';
    ctx.beginPath(); ctx.ellipse(cx, cy-R*0.85, R*0.28, R*0.12, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,140,50,0.7)';
    ctx.lineWidth = 4;
    for (const dx of [-0.15, 0.05, 0.2]) {
      ctx.beginPath();
      ctx.moveTo(cx+dx*R, cy-R*0.8);
      ctx.lineTo(cx+dx*R*1.6, cy+R*0.7);
      ctx.stroke();
    }
  } else if (kind === 'bubble') {
    const R = 160;
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, R*1.4);
    grad.addColorStop(0, 'rgba(180,230,255,0.45)');
    grad.addColorStop(1, 'rgba(180,230,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, R*1.4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const bx = cx + Math.sin(i*1.7) * R*0.8;
      const by = ((cy + i*60 - (frame*0.6)%360) % 400) - 200 + cy;
      ctx.beginPath(); ctx.arc(bx, by, 5 + (i%3)*3, 0, Math.PI*2); ctx.stroke();
    }
  } else if (kind === 'cloud') {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (const [ox,oy,r] of [[-70,10,50],[-20,-15,60],[40,0,55],[85,15,40]]) {
      ctx.beginPath(); ctx.arc(cx+ox, cy+oy, r, 0, Math.PI*2); ctx.fill();
    }
  } else if (kind === 'canopy') {
    ctx.fillStyle = 'rgba(20,60,20,0.55)';
    for (const [ox,oy,r] of [[-80,-10,70],[-20,-40,80],[50,-15,75],[100,10,55]]) {
      ctx.beginPath(); ctx.arc(cx+ox, cy+oy, r, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,240,180,0.15)';
    ctx.beginPath(); ctx.arc(cx+20, cy-10, 30, 0, Math.PI*2); ctx.fill();
  } else {
    drawMoon(cx, cy);
  }
}

function drawBackground() {
  const theme = (LEVEL_DEFS[currentLevelId] || LEVEL_DEFS.redmoon).theme;

  // sky gradient - flat vector wash, palette swapped per level theme
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, theme.sky1);
  sky.addColorStop(0.5, theme.sky2);
  sky.addColorStop(1, theme.sky3);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // stars: slow parallax, gentle twinkle - only for the night-sky themes
  if (theme.focal === 'moon') {
    const starParX = -camera.x * 0.15;
    for (let tile = -1; tile <= Math.ceil(W / STAR_TILE) + 1; tile++) {
      const baseX = (((starParX % STAR_TILE) + STAR_TILE) % STAR_TILE) + tile * STAR_TILE - STAR_TILE;
      for (const s of stars) {
        const tw = 0.5 + 0.5 * Math.sin(frame * 0.05 + s.phase);
        ctx.globalAlpha = 0.25 + 0.55 * tw;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(baseX + s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // one big focal backdrop object per "phase" of the level, drifting slowly behind the action.
  // World position of instance i is i*tile + offset; screen position subtracts the
  // parallax-scaled camera so it scrolls slower than the foreground.
  const focalTile = 3000, focalOffset = 460, focalGlow = 213;
  const focalParX = camera.x * 0.35;
  const iMin = Math.floor((focalParX - focalGlow - focalOffset) / focalTile);
  const iMax = Math.ceil((focalParX + W + focalGlow - focalOffset) / focalTile);
  for (let i = iMin; i <= iMax; i++) {
    drawFocal(theme.focal, i * focalTile + focalOffset - focalParX, H * 0.32);
  }

  // rolling silhouette hills for a mid-ground layer, same flat-color language as the platforms
  const hillParX = camera.x * 0.55;
  ctx.fillStyle = theme.hill;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) {
    ctx.lineTo(x, H * 0.72 + hillHeight(x + hillParX));
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(12,8,22,0.16)';
  ctx.fillRect(0, 0, W, H);
}

// ---------- Main update / render ----------
function update() {
  if (state !== 'playing') return;
  frame++;
  levelTimeLeft--;
  if (levelTimeLeft <= 0) { state = 'lose'; }
  updatePlayer();
  updateEnemies();
  updateProjectiles();
  updatePlayerProjectiles();
  updateGroundHazards();
  updateParticles();
  updateArena();
  if (worldCompleteBanner > 0) worldCompleteBanner--;
}

function render() {
  ctx.clearRect(0,0,W,H);

  if (state === 'menu') { renderMenu(); return; }

  const levelDef = LEVEL_DEFS[currentLevelId];
  drawBackground();

  for (const p of platforms) drawPlatform(p);
  if (levelDef.isVillage) {
    drawVillageProps();
  } else {
    drawCoins();
    drawGadgetDrops();
    drawGroundHazards();
    // the portal home doesn't appear until this level's boss is beaten, so there's
    // no way to just run past a story boss to skip the fight
    if (!levelDef.requiresBoss || player.bossDefeated[currentLevelId]) {
      drawPortal(LEVEL_WIDTH - 80, GROUND_Y);
    } else if (levelDef.requiresBoss) {
      drawBossGateHint();
    }
  }

  for (const en of enemies) {
    if (en.dead && !(en.type==='bomb' && en.exploding)) continue;
    ctx.save();
    ctx.translate(-camera.x, 0);
    if (en.isBoss) drawBossCreature(en);
    else if (en.type === 'bomb') drawBombBot(en);
    else drawDrone(en);
    ctx.restore();
  }

  drawProjectiles();
  drawPlayerProjectiles();
  drawHammerThrow();
  drawSkyAxe();

  ctx.save();
  ctx.translate(-camera.x, 0);
  if (!player.dead) drawDragon(player);
  if (player.rootedTimer > 0) drawRootedEffect();
  drawParticles();
  ctx.restore();

  drawHUD();
  drawWorldCompleteBanner();
  drawGadgetPickupBanner();

  if (state === 'lose') renderOverlay('挑戰失敗', '按 R 重新挑戰', '#e0453f');
  if (overlay === 'weaponshop') renderWeaponShopOverlay();
  if (overlay === 'armorshop') renderArmorShopOverlay();
  if (overlay === 'shieldshop') renderShieldShopOverlay();
  if (overlay === 'armorequip') renderArmorEquipShopOverlay();
  if (overlay === 'bag') renderBagOverlay();
  if (overlay === 'quest') renderQuestOverlay();
}

function renderOverlay(title, sub, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.font = 'bold 48px sans-serif';
  ctx.fillText(title, W/2, H/2 - 10);
  ctx.fillStyle = '#fff';
  ctx.font = '18px sans-serif';
  ctx.fillText(sub, W/2, H/2 + 30);
  ctx.textAlign = 'left';
}

// ---------- Village ----------
// The village is a walkable level with no enemies. Walking up to the shop or the big
// tree and pressing jump opens a modal (`overlay`) on top of the scene; the shop
// reuses the same purchase system the old full-screen village screen had.
let villageCardRects = [];
// A visible, always-clickable close button on every overlay - a fallback for anyone
// whose keyboard input isn't reaching the game (e.g. focus stuck outside the canvas),
// so leaving a shop never depends on a keypress actually landing.
const OVERLAY_CLOSE_BTN = { x: W - 44, y: 12, w: 32, h: 32 };
function drawOverlayCloseButton() {
  const { x, y, w, h } = OVERLAY_CLOSE_BTN;
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  roundRect(ctx, x, y, w, h, 8);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, x, y, w, h, 8);
  ctx.stroke();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x + 9, y + 9); ctx.lineTo(x + w - 9, y + h - 9);
  ctx.moveTo(x + w - 9, y + 9); ctx.lineTo(x + 9, y + h - 9);
  ctx.stroke();
}
function clickedOverlayCloseButton(mx, my) {
  const { x, y, w, h } = OVERLAY_CLOSE_BTN;
  return mx > x && mx < x + w && my > y && my < y + h;
}
// Auto-vivifying per-key-code state for pressedOnce(), so any overlay can use as many
// number-key slots as it needs without a fixed-size lookup table going out of bounds.
const villageKeyStates = {};
function villageKeyState(code) {
  if (!villageKeyStates[code]) villageKeyStates[code] = {};
  return villageKeyStates[code];
}
const QUEST_INFO = {
  volcano: { emoji:'🌋' },
  ocean:   { emoji:'🌊' },
  sky:     { emoji:'☁️' },
  jungle:  { emoji:'🌿' }
};

// Generic "level-based repeatable purchase" shop screen - used for the armor shop
// (armor / HP flask / MP flask) and reused for the weapon-strength card in the
// weapon shop, since both use the same shopLevels + cost-scaling system.
// `compact` shrinks the card so it can sit under a big weapon grid without pushing
// past the bottom of the canvas.
function renderItemShopCards(items, y, startIndex, compact) {
  const cw = compact ? 170 : 200, ch = compact ? 132 : 190, gap = compact ? 14 : 20;
  const totalW = items.length * cw + (items.length - 1) * gap;
  const startX = W/2 - totalW/2;

  items.forEach((item, i) => {
    const x = startX + i * (cw + gap);
    const level = player.shopLevels[item.id];
    const maxed = level >= item.maxLevel;
    const cost = shopItemCost(item);
    const afford = !maxed && player.gold >= cost;
    villageCardRects.push({x, y, w:cw, h:ch, id:item.id, kind:'item'});

    ctx.fillStyle = afford ? 'rgba(76,193,90,0.16)' : 'rgba(255,255,255,0.08)';
    roundRect(ctx, x, y, cw, ch, 12);
    ctx.fill();
    ctx.strokeStyle = afford ? '#4CC15A' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = afford ? 2.5 : 1.5;
    roundRect(ctx, x, y, cw, ch, 12);
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = compact ? 'bold 14px sans-serif' : 'bold 17px sans-serif';
    ctx.fillText(item.name, x+cw/2, y+(compact?26:34));
    ctx.font = compact ? '10px sans-serif' : '12px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    ctx.fillText(item.desc, x+cw/2, y+(compact?44:58));
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = compact ? '10px sans-serif' : '11px sans-serif';
    ctx.fillText(`等級 ${level}/${item.maxLevel}`, x+cw/2, y+(compact?60:80));

    if (maxed) {
      ctx.fillStyle = '#4CC15A';
      ctx.font = compact ? 'bold 12px sans-serif' : 'bold 14px sans-serif';
      ctx.fillText('已強化至上限', x+cw/2, y+ch-(compact?32:44));
    } else {
      ctx.fillStyle = afford ? '#f5c542' : 'rgba(255,255,255,0.4)';
      ctx.font = compact ? 'bold 13px sans-serif' : 'bold 16px sans-serif';
      ctx.fillText(`${cost} 金幣`, x+cw/2, y+ch-(compact?32:44));
    }
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = compact ? '9px sans-serif' : '11px sans-serif';
    const slot = startIndex + i;
    ctx.fillText(slot < 9 ? `按 ${slot+1} 或點擊購買` : '點擊購買', x+cw/2, y+ch-(compact?14:20));
  });
}

function renderArmorShopOverlay() {

// Wraps onto a second line at the first comma if the text is too wide for its card -
// good enough for the shield descriptions, which are all one or two comma-joined clauses.
function wrapFillText(text, x, y, maxWidth, lineHeight) {
  if (ctx.measureText(text).width <= maxWidth) {
    ctx.fillText(text, x, y);
    return;
  }
  const commaIdx = text.indexOf('，');
  const splitAt = (commaIdx > 0 && commaIdx < text.length - 1) ? commaIdx + 1 : Math.ceil(text.length / 2);
  ctx.fillText(text.slice(0, splitAt), x, y);
  ctx.fillText(text.slice(splitAt), x, y + lineHeight);
}

function drawShieldIcon(key) {
  ctx.save();
  if (key === 'greatshield') {
    roundRect(ctx, -20, -40, 40, 80, 12);
    ctx.fillStyle = '#5a5f68';
    ctx.fill();
    roundRect(ctx, -12, -30, 24, 60, 8);
    ctx.fillStyle = '#8f97a3';
    ctx.fill();
    ctx.fillStyle = '#e8d55a';
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
  } else if (key === 'spikeshield') {
    roundRect(ctx, -14, -34, 28, 68, 10);
    ctx.fillStyle = '#7a4a3a';
    ctx.fill();
    roundRect(ctx, -8, -26, 16, 52, 6);
    ctx.fillStyle = '#c9a24a';
    ctx.fill();
    ctx.fillStyle = '#e8e8ee';
    for (const oy of [-22, 0, 22]) {
      ctx.beginPath();
      ctx.moveTo(-6, oy-6); ctx.lineTo(-20, oy); ctx.lineTo(-6, oy+6);
      ctx.fill();
    }
  } else if (key === 'buckler') {
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI*2);
    ctx.fillStyle = '#c9a24a';
    ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2);
    ctx.fillStyle = '#e8d9a0';
    ctx.fill();
    ctx.fillStyle = '#8a6a3a';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
  } else if (key === 'manashield') {
    roundRect(ctx, -14, -32, 28, 64, 10);
    ctx.fillStyle = '#2a3a6a';
    ctx.fill();
    roundRect(ctx, -8, -24, 16, 48, 6);
    ctx.fillStyle = '#5c9dff';
    ctx.fill();
    ctx.fillStyle = '#dff0ff';
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
  } else {
    roundRect(ctx, -13, -32, 26, 64, 10);
    ctx.fillStyle = '#8a6a3a';
    ctx.fill();
    roundRect(ctx, -7, -24, 14, 48, 6);
    ctx.fillStyle = '#c9d6e3';
    ctx.fill();
    ctx.fillStyle = '#e8d55a';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function renderShieldShopOverlay() {

  ctx.textAlign = 'left';

function drawArmorIcon(key) {

    ctx.restore();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(w.name, x+cw/2, y+150);
    ctx.font = '13px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText(w.desc, x+cw/2, y+172);

    // rating bars
    drawRating(x+40, y+200, '速度', w.speedRating, 3, '#4fd15b');
    drawRating(x+40, y+230, '傷害', w.dmgRating, 3, '#e0453f');

    ctx.font = '11px sans-serif';
    ctx.fillStyle = 'rgba(160,200,255,0.85)';
    ctx.fillText(`長按攻擊鍵＝${w.specialName}（耗${w.specialCost} FP）`, x+cw/2, y+254);

    if (selected) {
      ctx.fillStyle = '#4CC15A';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('▶ 已選擇 ◀', x+cw/2, y+270);
    }
  });

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '14px sans-serif';
  ctx.fillText('← → 選擇　　空白鍵 / Enter 確認出發', W/2, H-40);
  ctx.textAlign = 'left';
}

function drawRating(x, y, label, value, max, color) {
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = '12px sans-serif';
  ctx.fillText(label, x, y+9);
  for (let i=0;i<max;i++) {
    ctx.fillStyle = i < value ? color : 'rgba(255,255,255,0.2)';
    ctx.fillRect(x+36+i*16, y, 12, 12);
  }
}

function drawWeaponIcon(key) {
  ctx.save();
  ctx.rotate(-0.5);
  if (key === 'sword') {
    ctx.fillStyle = '#c9d6e3';
    ctx.fillRect(-4, -50, 8, 70);
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-14, 18, 28, 10);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-5, 26, 10, 16);
  } else if (key === 'hammer') {
    ctx.fillStyle = '#7a5a3a';
    ctx.fillRect(-4, -20, 8, 70);
    ctx.fillStyle = '#6b6f76';
    ctx.fillRect(-26, -50, 52, 36);
    ctx.strokeStyle = '#3a3a3a';
    ctx.strokeRect(-26,-50,52,36);
  } else if (key === 'spear') {
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-4, -30, 8, 90);
    ctx.fillStyle = '#c9d6e3';
    ctx.beginPath();
    ctx.moveTo(-14,-30); ctx.lineTo(0,-64); ctx.lineTo(14,-30);
    ctx.fill();
  } else if (key === 'dualdagger') {
    ctx.save();
    ctx.rotate(0.9);
    ctx.fillStyle = '#d94f6a';
    ctx.fillRect(-3, -46, 6, 50);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, 2, 12, 8);
    ctx.restore();
    ctx.save();
    ctx.rotate(-0.9);
    ctx.fillStyle = '#d94f6a';
    ctx.fillRect(-3, -46, 6, 50);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, 2, 12, 8);
    ctx.restore();
  } else if (key === 'greataxe') {
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-4, -18, 8, 82);
    ctx.fillStyle = '#5a6b7a';
    ctx.beginPath();
    ctx.moveTo(-4, -50); ctx.quadraticCurveTo(-40, -46, -34, -14);
    ctx.quadraticCurveTo(-16, -22, -4, -14);
    ctx.quadraticCurveTo(8, -22, 26, -14);
    ctx.quadraticCurveTo(32, -46, -4, -50);
    ctx.fill();
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  } else if (key === 'whip') {
    ctx.strokeStyle = '#8a4fd9';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, 30);
    ctx.quadraticCurveTo(-4, 0, -22, -20);
    ctx.quadraticCurveTo(-30, -32, -20, -42);
    ctx.stroke();
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, 24, 12, 14);
  } else if (key === 'greatsword') {
    ctx.fillStyle = '#c9a24a';
    ctx.fillRect(-6, -56, 12, 74);
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-18, 16, 36, 12);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, 26, 12, 18);
  } else if (key === 'trident') {
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-4, -20, 8, 80);
    ctx.fillStyle = '#4fb8c9';
    for (const ox of [-16, 0, 16]) {
      ctx.beginPath();
      ctx.moveTo(ox-3, -20); ctx.lineTo(ox+3, -20); ctx.lineTo(ox, -50);
      ctx.fill();
    }
  } else if (key === 'katana') {
    ctx.fillStyle = '#e8e8ee';
    ctx.beginPath();
    ctx.moveTo(-6, 30); ctx.quadraticCurveTo(2, -10, -6, -52);
    ctx.lineTo(0, -52); ctx.quadraticCurveTo(8, -10, 0, 30);
    ctx.fill();
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(-9, 28, 18, 16);
  } else if (key === 'shortblade') {
    ctx.fillStyle = '#a9a9a9';
    ctx.beginPath();
    ctx.moveTo(-6, 16); ctx.lineTo(6, 16); ctx.lineTo(0, -30);
    ctx.fill();
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-7, 16, 14, 14);
  } else if (key === 'bow') {
    ctx.strokeStyle = '#8a6a3a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, 34, -1.2, 1.2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(34*Math.cos(-1.2), 34*Math.sin(-1.2));
    ctx.lineTo(-4, 0);
    ctx.lineTo(34*Math.cos(1.2), 34*Math.sin(1.2));
    ctx.stroke();
  } else if (key === 'flail') {
    ctx.strokeStyle = '#8a6a3a';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(0, 30); ctx.lineTo(0, -6);
    ctx.stroke();
    ctx.strokeStyle = '#6a5a4a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -6); ctx.lineTo(-6, -22); ctx.lineTo(6, -34); ctx.lineTo(0, -48);
    ctx.stroke();
    ctx.fillStyle = '#5a5f68';
    ctx.beginPath(); ctx.arc(0, -50, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a3a3a';
    for (let i = 0; i < 6; i++) {
      const ang = i * Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*12, -50+Math.sin(ang)*12);
      ctx.lineTo(Math.cos(ang)*18, -50+Math.sin(ang)*18);
      ctx.stroke();
    }
  } else if (key === 'scythe') {
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(-4, -30, 8, 90);
    ctx.fillStyle = '#8a1a2a';
    ctx.beginPath();
    ctx.moveTo(0, -30);
    ctx.quadraticCurveTo(-50, -40, -46, 0);
    ctx.quadraticCurveTo(-30, -6, 0, -14);
    ctx.fill();
    ctx.strokeStyle = '#c9a24a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  ctx.restore();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyR' && state === 'lose') {
    state = 'menu';
  }
  if ((e.code === 'KeyL' || e.code === 'Escape' || e.code === 'KeyJ' || e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && overlay) {
    overlay = null;
  }
  // the bag is a quick weapon/gadget swap usable anywhere, not just in the village -
  // K opens it from no overlay, and (like every other overlay) closes it again
  if (e.code === 'KeyK') {
    if (overlay === 'bag') overlay = null;
    else if (!overlay && state === 'playing') overlay = 'bag';
  }
});

function loop() {
  // A single bad frame must never permanently freeze the game: requestAnimationFrame
  // only reschedules itself if reached, so any thrown error here has to be caught
  // rather than silently stopping every future frame.
  try {
    if (state === 'menu') updateMenu();
    else if (overlay === 'weaponshop') updateWeaponShopOverlay();
    else if (overlay === 'armorshop') updateArmorShopOverlay();
    else if (overlay === 'shieldshop') updateShieldShopOverlay();
    else if (overlay === 'armorequip') updateArmorEquipShopOverlay();
    else if (overlay === 'quest') updateQuestOverlay();
    update();
    render();
  } catch (err) {
    console.error('game loop error:', err);
  }
  requestAnimationFrame(loop);
}
loop();

})();
</script>
