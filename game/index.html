<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小龍勇士：第一關</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#0a0a14; overflow:hidden;
    font-family:'Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #game-wrap {
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  canvas {
    background:#000;
    image-rendering: pixelated;
    max-width:100vw; max-height:100vh;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  #touch-controls {
    position:absolute;
    display:none;
    align-items:flex-end;
    justify-content:space-between;
    padding:3%; pointer-events:none;
  }
  #touch-controls.active { display:flex; }
  .tc-group { display:flex; gap:10px; pointer-events:auto; }
  .tc-btn {
    width:58px; height:58px; border-radius:50%;
    background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.35);
    color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  .tc-btn:active { background:rgba(255,255,255,0.35); }
  #tc-attack { width:74px; height:74px; background:rgba(255,80,60,0.3); border-color:rgba(255,80,60,0.6); }
  #tc-jump { width:74px; height:74px; background:rgba(80,180,255,0.3); border-color:rgba(80,180,255,0.6); }
  #tc-hp-potion { width:52px; height:52px; background:rgba(255,107,92,0.3); border-color:rgba(255,107,92,0.6); font-size:14px; }
  #tc-fp-potion { width:52px; height:52px; background:rgba(92,157,255,0.3); border-color:rgba(92,157,255,0.6); font-size:14px; }
  #tc-shield { width:64px; height:64px; background:rgba(80,220,180,0.3); border-color:rgba(80,220,180,0.65); }
  #tc-joystick {
    position:relative; width:112px; height:112px; border-radius:50%;
    background:rgba(255,255,255,0.10); border:2px solid rgba(255,255,255,0.3);
    pointer-events:auto; touch-action:none;
  }
  #tc-joystick-knob {
    position:absolute; width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,0.35); border:2px solid rgba(255,255,255,0.55);
    left:50%; top:50%; transform:translate(-50%,-50%);
    pointer-events:none;
  }
  #hint {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);

  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hint">←→移動　⎵跳躍　J攻擊(長按=特技)　L防禦　1/2 藥水</div>
  <div id="touch-controls">
    <div id="tc-joystick"><div id="tc-joystick-knob"></div></div>

      <div class="tc-btn" id="tc-jump">跳</div>
    </div>

<script>
(function(){
"use strict";

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GRAVITY = 0.62;
const GROUND_FRICTION = 0.82;

// ---------- Background (hand-drawn to match the dragon's flat cartoon style) ----------
// Star positions are seeded once and tiled with parallax, rather than the raw
// photo the level used to show behind the vector-drawn dragon and platforms.
const STAR_TILE = 900;
const stars = [];
for (let i = 0; i < 46; i++) {
  stars.push({
    x: Math.random() * STAR_TILE,
    y: Math.random() * H * 0.6,
    r: 0.6 + Math.random() * 1.5,
    phase: Math.random() * Math.PI * 2
  });
}
// Deterministic rolling silhouette (sum of a few sine waves) - no stored points needed.
function hillHeight(worldX) {
  return 26 * Math.sin(worldX * 0.006) + 14 * Math.sin(worldX * 0.017 + 1.5) + 8 * Math.sin(worldX * 0.041 + 0.6);
}

// ---------- Input ----------
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// touch controls
function bindTouch(id, code) {
  const el = document.getElementById(id);
  const set = v => e => { e.preventDefault(); keys[code] = v; };
  el.addEventListener('touchstart', set(true), {passive:false});
  el.addEventListener('touchend', set(false), {passive:false});
  el.addEventListener('touchcancel', set(false), {passive:false});
  el.addEventListener('mousedown', set(true));
  el.addEventListener('mouseup', set(false));
  el.addEventListener('mouseleave', set(false));
}
if ('ontouchstart' in window) {
  document.getElementById('touch-controls').classList.add('active');
  document.getElementById('hint').style.display = 'none';
}

// Keep the touch overlay locked to the canvas's actual rendered box (it letterboxes
// on tall phone screens), so the buttons sit over the game instead of the empty margins.
function syncTouchControlsToCanvas() {
  const tc = document.getElementById('touch-controls');
  const rect = canvas.getBoundingClientRect();
  tc.style.left = rect.left + 'px';
  tc.style.top = rect.top + 'px';
  tc.style.width = rect.width + 'px';
  tc.style.height = rect.height + 'px';
}
window.addEventListener('resize', syncTouchControlsToCanvas);
window.addEventListener('orientationchange', syncTouchControlsToCanvas);
syncTouchControlsToCanvas();
bindTouch('tc-jump', 'Space');
bindTouch('tc-attack', 'KeyJ');
bindTouch('tc-hp-potion', 'Digit1');
bindTouch('tc-fp-potion', 'Digit2');
bindTouch('tc-shield', 'KeyL');

// Virtual joystick: drag within the circular base to move the direction keys,
// same up/down/left/right axes a physical d-pad would drive.
function setupJoystick() {
  const base = document.getElementById('tc-joystick');
  const knob = document.getElementById('tc-joystick-knob');
  const maxR = 34;
  const deadzone = 10;
  let activePointerId = null;

  function setKnob(dx, dy) {
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }
  function resetKeys() {
    keys['ArrowLeft'] = false; keys['ArrowRight'] = false;
    keys['ArrowUp'] = false; keys['ArrowDown'] = false;
  }
  function updateFromPointer(clientX, clientY) {
    const rect = base.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    let dx = clientX - cx, dy = clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) { dx = dx/dist*maxR; dy = dy/dist*maxR; }
    setKnob(dx, dy);
    resetKeys();
    if (dx > deadzone) keys['ArrowRight'] = true;
    else if (dx < -deadzone) keys['ArrowLeft'] = true;
    if (dy > deadzone) keys['ArrowDown'] = true;
    else if (dy < -deadzone) keys['ArrowUp'] = true;
  }
  function endDrag(e) {
    if (e.pointerId !== activePointerId) return;
    activePointerId = null;
    setKnob(0, 0);
    resetKeys();
  }

  base.addEventListener('pointerdown', e => {
    e.preventDefault();
    activePointerId = e.pointerId;
    base.setPointerCapture(e.pointerId);
    updateFromPointer(e.clientX, e.clientY);
  });
  base.addEventListener('pointermove', e => {
    if (e.pointerId !== activePointerId) return;
    updateFromPointer(e.clientX, e.clientY);
  });
  base.addEventListener('pointerup', endDrag);
  base.addEventListener('pointercancel', endDrag);
}
setupJoystick();

function pressedOnce(code, state) {
  const now = !!keys[code];
  const was = state.prev;
  state.prev = now;
  return now && !was;
}

// ---------- Weapons ----------
const WEAPONS = {
  sword: {
    name: '直劍', key:'sword',
    dmg: 16, cooldown: 26, staminaCost: 10, range: 46, windup: 5, color:'#c9d6e3',
    desc: '攻擊快，傷害中等', speedRating: 2, dmgRating: 2,
    specialName: '回旋斬', specialCost: 28, specialCooldown: 100
  },
  hammer: {
    name: '大錘', key:'hammer',
    dmg: 30, cooldown: 52, staminaCost: 22, range: 50, windup: 14, color:'#9b7653',
    desc: '攻擊慢，傷害最高', speedRating: 1, dmgRating: 3,
    specialName: '投擲重錘', specialCost: 36, specialCooldown: 150
  },
  spear: {
    name: '長矛', key:'spear',
    dmg: 9, cooldown: 16, staminaCost: 7, range: 62, windup: 3, color:'#c2a15a',
    desc: '攻擊最快，傷害最低', speedRating: 3, dmgRating: 1,
    specialName: '五連刺', specialCost: 22, specialCooldown: 100
  },
  dualdagger: {
    name: '雙刀', key:'dualdagger', price: 40,
    dmg: 7, cooldown: 12, staminaCost: 6, range: 40, windup: 2, color:'#d94f6a',
    desc: '攻擊極快，近距離', speedRating: 3, dmgRating: 1,
    specialName: '疾風突進', specialCost: 24, specialCooldown: 110
  },
  greataxe: {
    name: '巨斧', key:'greataxe', price: 45,
    dmg: 38, cooldown: 64, staminaCost: 26, range: 54, windup: 18, color:'#5a6b7a',
    desc: '攻擊最慢，傷害最高', speedRating: 1, dmgRating: 3,
    specialName: '大地嘯', specialCost: 40, specialCooldown: 160
  }
};
const ATTACK_HOLD_THRESHOLD = 18; // frames held before a long-press fires the special instead of a tap

// ---------- Game state ----------
let state = 'menu'; // menu -> playing -> lose
let overlay = null;  // null | 'weaponshop' | 'armorshop' | 'quest' - modal UI shown over the village
let selectedWeapon = 'sword';
let levelTimeLeft = 130 * 60; // frames (~130s at 60fps)
let frame = 0;

const camera = { x: 0 };
const GROUND_Y = 520;
let LEVEL_WIDTH = 3000;
let currentLevelId = 'redmoon';

// Platforms laid out to mirror the drawing: stepped blocks with gaps, a floating
// platform mid-level (validated jumpable with the current jump power), ending on a
// wide final platform where the portal to the village stands. Every adventure level
// (village excepted) reuses this exact shape - only the enemies and colors change -
// so the jump timing stays whatever was already validated for the first level.
const ADVENTURE_PLATFORMS = [
  {x:0,    y:GROUND_Y, w:300, h:80},
  {x:380,  y:GROUND_Y, w:170, h:80},
  {x:640,  y:GROUND_Y, w:210, h:80},
  {x:940,  y:GROUND_Y-40, w:150, h:120},
  {x:1180, y:GROUND_Y-90, w:220, h:170, floating:true},
  {x:1500, y:GROUND_Y, w:230, h:80},
  {x:1830, y:GROUND_Y, w:260, h:80},
  {x:2190, y:GROUND_Y, w:810, h:80}
];
// The village is one flat, safe walkway - no gaps, no enemies.
const VILLAGE_WIDTH = 2400;
const VILLAGE_PLATFORMS = [
  {x:0, y:GROUND_Y, w:VILLAGE_WIDTH, h:80}
];
const VILLAGE_WEAPON_SHOP_X = 480;
const VILLAGE_ARMOR_SHOP_X = 980;
const VILLAGE_TREE_X = 1600;

let platforms = ADVENTURE_PLATFORMS;

function groundHeightAt(x) {
  for (const p of platforms) {
    if (x >= p.x && x <= p.x + p.w) return p.y;
  }
  return H + 100;
}

// ---------- Player (small dragon) ----------
const player = {
  x: 60, y: GROUND_Y - 60, w: 40, h: 56,
  vx: 0, vy: 0,
  facing: 1,
  onGround: false,
  hp: 100, maxHp: 100,
  fp: 100, maxFp: 100,
  sta: 100, maxSta: 100,
  attackCooldown: 0,
  attackWindup: 0,
  attacking: false,
  hitThisSwing: false,
  invuln: 0,
  weapon: WEAPONS.sword,
  blocking: false,
  blockFlash: 0,
  dead: false,
  walkCycle: 0,
  // long-press attack -> weapon special
  attackHold: { holding:false, startFrame:0, specialFired:false },
  specialCooldown: 0,
  specialType: null,   // 'sword' | 'hammer' | 'spear' while a special is resolving
  specialTimer: 0,
  specialPhase: 0,
  hammerThrow: null,   // {x,y,vx,vy,returning,hitSet} while the hammer is away from hand
  dashSpecial: null,   // {hitSet} while the dual-dagger gale dash is resolving
  // potions (do not regenerate - only refilled by picking up more, or a fresh run)
  hpPotions: 3, maxHpPotions: 3,
  fpPotions: 3, maxFpPotions: 3,
  potionCooldown: 0,
  // village shop
  gold: 0,
  weaponDmgBonus: 0,
  shopLevels: { weapon:0, armor:0, hpflask:0, fpflask:0 },
  unlockedWeapons: new Set(['sword', 'hammer', 'spear'])
};

function currentWeaponDmg() {
  return player.weapon.dmg + player.weaponDmgBonus;
}

// ---------- Village shop ----------
const SHOP_ITEMS = [
  { id:'weapon',  name:'武器強化', desc:'+4 攻擊力',            baseCost:20, costStep:10, maxLevel:5 },
  { id:'armor',   name:'護甲',    desc:'+20 上限HP，並回滿',     baseCost:20, costStep:10, maxLevel:5 },
  { id:'hpflask', name:'HP藥水袋', desc:'+1 瓶上限，立即補滿一瓶', baseCost:15, costStep:8,  maxLevel:5 },
  { id:'fpflask', name:'MP藥水袋', desc:'+1 瓶上限，立即補滿一瓶', baseCost:15, costStep:8,  maxLevel:5 }
];
// Same purchase system, split across the two physical shop buildings in the village.
const WEAPON_SHOP_UPGRADE_ITEMS = SHOP_ITEMS.filter(i => i.id === 'weapon');
const ARMOR_SHOP_ITEMS = SHOP_ITEMS.filter(i => i.id !== 'weapon');
const PURCHASABLE_WEAPON_KEYS = ['sword', 'hammer', 'spear', 'dualdagger', 'greataxe'];
function selectOrBuyWeapon(key) {
  const w = WEAPONS[key];
  if (!w) return;
  if (player.unlockedWeapons.has(key)) {
    player.weapon = w;
  } else if (w.price && player.gold >= w.price) {
    player.gold -= w.price;
    player.unlockedWeapons.add(key);
    player.weapon = w;
  }
}
function shopItemCost(item) {
  return item.baseCost + item.costStep * player.shopLevels[item.id];
}
function buyShopItem(id) {
  const item = SHOP_ITEMS.find(s => s.id === id);
  if (!item) return;
  const level = player.shopLevels[id];
  if (level >= item.maxLevel) return;
  const cost = shopItemCost(item);
  if (player.gold < cost) return;
  player.gold -= cost;
  player.shopLevels[id]++;
  if (id === 'weapon') player.weaponDmgBonus += 4;
  else if (id === 'armor') { player.maxHp += 20; player.hp = Math.min(player.maxHp, player.hp + 20); }
  else if (id === 'hpflask') { player.maxHpPotions++; player.hpPotions = Math.min(player.maxHpPotions, player.hpPotions + 1); }
  else if (id === 'fpflask') { player.maxFpPotions++; player.fpPotions = Math.min(player.maxFpPotions, player.fpPotions + 1); }
}

// ---------- Enemies ----------
// Every themed level's monsters are one of two shared behavior archetypes, just
// reskinned and re-statted: "ground" patrols its spawn platform and telegraphs an
// attack (melee bump or a thrown projectile); "flyer" hovers and either dives into
// melee or casts a projectile from range. Bosses are a bigger, tougher instance of
// either archetype that also fires an extra AoE burst attack periodically.
let enemies = [];
function spawnEnemiesForLevel(id) {
  const def = LEVEL_DEFS[id];
  enemies = def.makeEnemies ? def.makeEnemies() : [];
}

function makeGroundEnemy(x, groundY, cfg) {
  const w = cfg.w || 38, h = cfg.h || 40;
  // Patrol range is clamped to the platform it spawns on, so it turns around at the
  // edge instead of walking straight out over a gap.
  const home = platforms.find(p => x >= p.x && x <= p.x + p.w) || {x:0, w:LEVEL_WIDTH};
  return {
    type:'bomb', kind: cfg.kind, name: cfg.name || '', isBoss: !!cfg.isBoss,
    x, y:groundY-h, w, h, vx:0, vy:0,
    hp:cfg.hp, maxHp:cfg.hp, dmg:cfg.dmg, speed:cfg.speed, dir:-1,
    homeMinX: home.x, homeMaxX: home.x + home.w - w,
    onGround:true, hitFlash:0, exploding:false, explodeTimer:0,
    attackCooldown:0, telegraph:false, attackWindup:0, dead:false, groundY,
    attackMode: cfg.attackMode || 'ranged',
    projectileKind: cfg.projectileKind || 'bomb',
    colorMain: cfg.colorMain || '#3a3a44', colorAccent: cfg.colorAccent || '#e8e8ee',
    bossBurstCooldown: 0
  };
}

function makeFlyingEnemy(x, y, cfg) {
  const w = cfg.w || 34, h = cfg.h || 26;
  return {
    type:'drone', kind: cfg.kind, name: cfg.name || '', isBoss: !!cfg.isBoss,
    x, y, baseY:y, w, h, vx:0, vy:0,
    hp:cfg.hp, maxHp:cfg.hp, dmg:cfg.dmg, speed:cfg.speed, dir:-1,
    hitFlash:0, attackCooldown:0, dead:false, phase:Math.random()*Math.PI*2,
    dashTimer:0, dashing:false, dashDir:0, charging:false, chargeTimer:0,
    attackMode: cfg.attackMode || 'dash',
    projectileKind: cfg.projectileKind || 'bomb',
    colorMain: cfg.colorMain || '#555c66', colorAccent: cfg.colorAccent || '#e8453f',
    bossBurstCooldown: 0
  };
}

// ---------- Level roster ----------
// Every adventure level reuses ADVENTURE_PLATFORMS (validated jump geometry) and
// just swaps its enemy roster, background palette, and "focal" backdrop object.
const LEVEL_DEFS = {
  redmoon: {
    name: '紅月遺跡', isVillage: false,
    theme: { sky1:'#2c2050', sky2:'#553a72', sky3:'#caa2c4', hill:'#3c2b57', focal:'moon' },
    makeEnemies: () => [
      makeGroundEnemy(700, GROUND_Y, { kind:'bomb', hp:80, dmg:12, speed:0.55, attackMode:'ranged', projectileKind:'bomb', colorMain:'#3a3a44', colorAccent:'#e8e8ee' }),
      makeFlyingEnemy(1050, GROUND_Y-220, { kind:'classic', hp:24, dmg:14, speed:1.6, attackMode:'dash', colorMain:'#555c66', colorAccent:'#e8453f' }),
      makeGroundEnemy(1620, GROUND_Y, { kind:'bomb', hp:80, dmg:12, speed:0.55, attackMode:'ranged', projectileKind:'bomb', colorMain:'#3a3a44', colorAccent:'#e8e8ee' }),
      makeFlyingEnemy(1950, GROUND_Y-200, { kind:'classic', hp:24, dmg:14, speed:1.6, attackMode:'dash', colorMain:'#555c66', colorAccent:'#e8453f' }),
      makeGroundEnemy(2260, GROUND_Y, { kind:'bomb', hp:80, dmg:12, speed:0.55, attackMode:'ranged', projectileKind:'bomb', colorMain:'#3a3a44', colorAccent:'#e8e8ee' }),
      makeFlyingEnemy(2500, GROUND_Y-180, { kind:'classic', hp:24, dmg:14, speed:1.6, attackMode:'dash', colorMain:'#555c66', colorAccent:'#e8453f' })
    ]
  },
  volcano: {
    name: '火山關卡', isVillage: false,
    grunts: ['熔岩怪', '火焰法師'], bossName: '熔岩土龍',
    theme: { sky1:'#3a1408', sky2:'#7a2c10', sky3:'#e8813a', hill:'#4a1c0c', focal:'volcano' },
    makeEnemies: () => [
      makeGroundEnemy(700, GROUND_Y, { kind:'lava', name:'熔岩怪', hp:90, dmg:12, speed:0.5, attackMode:'ranged', projectileKind:'lava', colorMain:'#8a3a1e', colorAccent:'#ffcf4a' }),
      makeFlyingEnemy(1050, GROUND_Y-220, { kind:'mage', name:'火焰法師', hp:26, dmg:15, speed:1.3, attackMode:'cast', projectileKind:'fireball', colorMain:'#6a2a5a', colorAccent:'#ff7a3a' }),
      makeGroundEnemy(1620, GROUND_Y, { kind:'lava', name:'熔岩怪', hp:90, dmg:12, speed:0.5, attackMode:'ranged', projectileKind:'lava', colorMain:'#8a3a1e', colorAccent:'#ffcf4a' }),
      makeFlyingEnemy(1950, GROUND_Y-200, { kind:'mage', name:'火焰法師', hp:26, dmg:15, speed:1.3, attackMode:'cast', projectileKind:'fireball', colorMain:'#6a2a5a', colorAccent:'#ff7a3a' }),
      makeGroundEnemy(2750, GROUND_Y, { kind:'wolf', name:'熔岩土龍', isBoss:true, w:96, h:100, hp:260, dmg:18, speed:0.45, attackMode:'ranged', projectileKind:'lava', colorMain:'#b8451f', colorAccent:'#ffdb6a' })
    ]
  },
  ocean: {
    name: '海底關卡', isVillage: false,
    grunts: ['寄居蟹怪', '大章魚'], bossName: '深海龍王',
    theme: { sky1:'#0a2440', sky2:'#0f4d6b', sky3:'#7fc9d6', hill:'#0d3550', focal:'bubble' },
    makeEnemies: () => [
      makeGroundEnemy(700, GROUND_Y, { kind:'shell', name:'寄居蟹怪', hp:95, dmg:10, speed:0.5, attackMode:'melee', colorMain:'#c1502f', colorAccent:'#ffdca0' }),
      makeFlyingEnemy(1050, GROUND_Y-220, { kind:'tentacle', name:'大章魚', hp:24, dmg:14, speed:1.2, attackMode:'cast', projectileKind:'ink', colorMain:'#7a3f9e', colorAccent:'#e0a2ff' }),
      makeGroundEnemy(1620, GROUND_Y, { kind:'shell', name:'寄居蟹怪', hp:95, dmg:10, speed:0.5, attackMode:'melee', colorMain:'#c1502f', colorAccent:'#ffdca0' }),
      makeFlyingEnemy(1950, GROUND_Y-200, { kind:'tentacle', name:'大章魚', hp:24, dmg:14, speed:1.2, attackMode:'cast', projectileKind:'ink', colorMain:'#7a3f9e', colorAccent:'#e0a2ff' }),
      makeFlyingEnemy(2750, GROUND_Y-160, { kind:'dragon', name:'深海龍王', isBoss:true, w:86, h:70, hp:240, dmg:17, speed:1.3, attackMode:'cast', projectileKind:'ink', colorMain:'#264a8a', colorAccent:'#8fd0ff' })
    ]
  },
  sky: {

// ---------- Coins ----------
const COIN_VALUE = 5;
let coins = [];
function spawnCoins() {
  coins = [];
  for (const p of platforms) {
    const n = Math.max(2, Math.floor(p.w / 140));
    for (let i = 0; i < n; i++) {
      coins.push({
        x: p.x + (p.w / (n + 1)) * (i + 1),
        y: p.y - 34,
        r: 9, collected: false, phase: Math.random() * Math.PI * 2
      });
    }
  }
}
function updateCoins() {
  const hb = {x: player.x, y: player.y, w: player.w, h: player.h};
  for (const c of coins) {
    if (c.collected) continue;
    if (rectsOverlap(hb, {x:c.x-c.r, y:c.y-c.r, w:c.r*2, h:c.r*2})) {
      c.collected = true;
      player.gold += COIN_VALUE;
      spawnSparkleAt(c.x, c.y, '#ffd35c');
    }
  }
}
function drawCoins() {
  for (const c of coins) {
    if (c.collected) continue;
    const bob = Math.sin(frame * 0.08 + c.phase) * 3;
    ctx.save();
    ctx.translate(c.x - camera.x, c.y + bob);
    ctx.fillStyle = '#f5c542';
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#c98a1f';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#fff3c9';
    ctx.beginPath(); ctx.arc(-2.5, -2.5, c.r*0.35, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ---------- Particles (hits, explosions, pickups) ----------
let particles = [];
function addParticle(p) { particles.push(p); }

// ---------- Projectiles (thrown or cast by enemies) ----------
let projectiles = [];
function spawnProjectile(x, y, vx, vy, dmg, kind) {
  projectiles.push({ x, y, vx, vy, r: 6, life: 150, dmg, kind: kind || 'bomb' });
}
function throwBomb(en) {
  spawnProjectile(en.x + en.w/2, en.y + en.h/2 - 12, en.dir * 4.6, -8.6, en.dmg, en.projectileKind);
}
function spawnCastProjectile(en, dirX, dirY) {
  const speed = 5.5;
  spawnProjectile(en.x + en.w/2, en.y + en.h/2, dirX*speed, dirY*speed, en.dmg, en.projectileKind);
}
const PROJECTILE_PALETTE = {
  lava:     { c1:'#ffd35c', c2:'#ff5a3c' },
  fireball: { c1:'#ffe08a', c2:'#ff3b1a' },
  ink:      { c1:'#c9a2ff', c2:'#3a1f5c' },
  thorn:    { c1:'#c8f08a', c2:'#3d7a2a' },
  feather:  { c1:'#fff3d6', c2:'#a9793f' },
  wind:     { c1:'#e8f6ff', c2:'#7fb8dd' }
};
function updateProjectiles() {
  for (const b of projectiles) {
    if (b.kind === 'bomb' || b.kind === 'lava') b.vy += GRAVITY * 0.65; // lobbed arc, others fly straight
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    let landed = false;
    for (const p of platforms) {
      if (b.x > p.x && b.x < p.x + p.w && b.y + b.r >= p.y && b.vy >= 0) { landed = true; break; }
    }
    const hitPlayer = rectsOverlap({x:b.x-b.r, y:b.y-b.r, w:b.r*2, h:b.r*2}, player);
    if (landed || hitPlayer || b.life <= 0 || b.y > H + 300) {
      explodeAt(b.x, b.y, 70, b.dmg);
      b.dead = true;
    }
  }
  projectiles = projectiles.filter(b => !b.dead);
}
function drawProjectiles() {
  for (const b of projectiles) {
    ctx.save();
    ctx.translate(b.x - camera.x, b.y);
    ctx.rotate(frame * 0.25);
    if (b.kind === 'bomb') {
      ctx.fillStyle = '#2b2b33';
      ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#c9a24a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -b.r);
      ctx.quadraticCurveTo(4, -b.r-6, 2, -b.r-9);
      ctx.stroke();
      ctx.fillStyle = frame % 10 < 5 ? '#ff5a3c' : '#ffcf4a';
      ctx.beginPath(); ctx.arc(2, -b.r-10, 2, 0, Math.PI*2); ctx.fill();
    } else {
      const pal = PROJECTILE_PALETTE[b.kind] || PROJECTILE_PALETTE.fireball;
      const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, b.r+3);
      grad.addColorStop(0, pal.c1);
      grad.addColorStop(1, pal.c2);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, b.r+3, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}
function drawHammerThrow() {
  const h = player.hammerThrow;
  if (!h) return;
  ctx.save();
  ctx.translate(h.x - camera.x, h.y);
  ctx.rotate(frame * 0.5);
  ctx.fillStyle = '#7a5a3a';
  ctx.fillRect(-2, -13, 4, 26);
  ctx.fillStyle = '#6b6f76';
  ctx.fillRect(-10, -18, 20, 16);
  ctx.restore();
}

function explodeAt(cx, cy, radius, dmg) {
  for (let i = 0; i < 16; i++) {
    const ang = (Math.PI*2*i)/16;
    addParticle({type:'spark', x:cx, y:cy,
      vx:Math.cos(ang)*5, vy:Math.sin(ang)*5, life:22, maxLife:22, size:4+Math.random()*3, color:'#ff9d4d'});
  }
  const d = Math.hypot((player.x+player.w/2)-cx, (player.y+player.h/2)-cy);
  if (d < radius) damagePlayer(dmg, 40);
}

// ---------- Weapon select screen ----------
const weaponOrder = ['sword','hammer','spear'];
let menuSelectIndex = 0;

function updateMenu() {
  if (pressedOnce('ArrowLeft', menuKeyState.left) || pressedOnce('KeyA', menuKeyState.left)) {
    menuSelectIndex = (menuSelectIndex + weaponOrder.length - 1) % weaponOrder.length;
  }
  if (pressedOnce('ArrowRight', menuKeyState.right) || pressedOnce('KeyD', menuKeyState.right)) {
    menuSelectIndex = (menuSelectIndex + 1) % weaponOrder.length;
  }
  if (pressedOnce('Space', menuKeyState.space) || pressedOnce('Enter', menuKeyState.enter) || pressedOnce('KeyJ', menuKeyState.j)) {
    startGame(weaponOrder[menuSelectIndex]);
  }
}
const menuKeyState = { left:{}, right:{}, space:{}, enter:{}, j:{} };

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);

  if (state === 'menu') {
    weaponOrder.forEach((key, i) => {
      const cardX = 90 + i * 280;
      const cardY = 210;
      if (mx > cardX && mx < cardX+240 && my > cardY && my < cardY+300) {
        menuSelectIndex = i;
        startGame(key);
      }
    });
  } else if (overlay === 'armorshop') {
    for (const card of villageCardRects) {
      if (mx > card.x && mx < card.x+card.w && my > card.y && my < card.y+card.h) {
        buyShopItem(card.id);
      }
    }
  } else if (overlay === 'weaponshop') {
    for (const card of villageCardRects) {
      if (mx > card.x && mx < card.x+card.w && my > card.y && my < card.y+card.h) {
        if (card.kind === 'weapon') selectOrBuyWeapon(card.id);
        else buyShopItem(card.id);
      }
    }
  } else if (overlay === 'quest') {
    for (const card of villageCardRects) {
      if (mx > card.x && mx < card.x+card.w && my > card.y && my < card.y+card.h) {
        enterLevel(card.id);
      }
    }
  }
});

// Full fresh run: resets every stat and shop purchase, then loads the first level.
function startGame(weaponKey) {
  selectedWeapon = weaponKey;
  player.weapon = WEAPONS[weaponKey];
  player.maxHp = 100; player.maxHpPotions = 3; player.maxFpPotions = 3;
  player.gold = 0;
  player.weaponDmgBonus = 0;
  player.shopLevels = { weapon:0, armor:0, hpflask:0, fpflask:0 };
  player.unlockedWeapons = new Set(['sword', 'hammer', 'spear']);
  frame = 0;
  enterLevel('redmoon');
}

// Load a level's geometry/enemies and place the player at its start. Called both for
// the first level and every time a portal or quest sends the player somewhere new -
// gold, shop levels, and weapon bonuses are NOT touched here, only startGame() resets those.
function enterLevel(levelId) {
  const def = LEVEL_DEFS[levelId];
  currentLevelId = levelId;
  platforms = def.isVillage ? VILLAGE_PLATFORMS : ADVENTURE_PLATFORMS;
  LEVEL_WIDTH = def.isVillage ? VILLAGE_WIDTH : ADVENTURE_PLATFORMS[ADVENTURE_PLATFORMS.length-1].x + ADVENTURE_PLATFORMS[ADVENTURE_PLATFORMS.length-1].w;

  player.x = 60; player.y = GROUND_Y-60; player.vx=0; player.vy=0;
  player.hp = player.maxHp; player.fp = player.maxFp; player.sta = player.maxSta;
  player.hpPotions = player.maxHpPotions;
  player.fpPotions = player.maxFpPotions;
  player.dead = false;
  player.lastGroundX = player.x;
  player.lastGroundY = player.y;
  player.attackHold = { holding:false, startFrame:0, specialFired:false };
  player.specialCooldown = 0;
  player.specialType = null;
  player.specialTimer = 0;
  player.specialPhase = 0;
  player.hammerThrow = null;
  player.dashSpecial = null;
  player.potionCooldown = 0;
  camera.x = 0;
  levelTimeLeft = def.isVillage ? Infinity : 130*60;
  overlay = null;
  spawnEnemiesForLevel(levelId);
  if (!def.isVillage) spawnCoins(); else coins = [];
  particles = [];
  projectiles = [];
  state = 'playing';
}

// ---------- Update: Player ----------
let villageJumpPrev = false;
function updatePlayer() {
  if (player.dead) return;
  if (overlay) return; // frozen while a village shop/quest modal is open

  player.blocking = !!keys['KeyL'] && player.attackWindup === 0 && !player.attacking;

  const speed = player.blocking ? 1.3 : 4.1;
  let moveInput = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) moveInput -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) moveInput += 1;

  if (moveInput !== 0) {
    player.vx += moveInput * 0.9;
    player.facing = moveInput > 0 ? 1 : -1;
    player.walkCycle += 0.25;
  } else {
    player.walkCycle = 0;
  }
  player.vx = Math.max(-speed, Math.min(speed, player.vx));
  player.vx *= player.onGround ? GROUND_FRICTION : 0.95;

  // jump
  const jumpDown = !!(keys['Space'] || keys['ArrowUp'] || keys['KeyW']);
  const wasOnGround = player.onGround;
  if (jumpDown && wasOnGround) {
    player.vy = -13.2;
    player.onGround = false;
  }
  // in the village, pressing jump near a shop or the tree opens that modal instead
  if (currentLevelId === 'village' && jumpDown && !villageJumpPrev && wasOnGround) {
    const px = player.x + player.w/2;
    if (Math.abs(px - VILLAGE_WEAPON_SHOP_X) < 70) overlay = 'weaponshop';
    else if (Math.abs(px - VILLAGE_ARMOR_SHOP_X) < 70) overlay = 'armorshop';
    else if (Math.abs(px - VILLAGE_TREE_X) < 70) overlay = 'quest';
  }
  villageJumpPrev = jumpDown;

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  // clamp to level bounds
  player.x = Math.max(0, Math.min(LEVEL_WIDTH - player.w, player.x));

  // ground collision against platforms (simple: only lands if within platform x-range)
  player.onGround = false;
  for (const p of platforms) {
    const px1 = p.x, px2 = p.x + p.w;
    const feetY = player.y + player.h;
    if (player.x + player.w > px1 + 2 && player.x < px2 - 2) {
      if (feetY >= p.y && feetY - player.vy <= p.y + 4 && player.vy >= 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }
  if (player.onGround) {
    player.lastGroundX = player.x;
    player.lastGroundY = player.y;
  }
  if (player.y > H + 200) {
    // fell into a gap: respawn on the last safe platform with a penalty instead of an outright kill
    player.x = player.lastGroundX;
    player.y = player.lastGroundY;
    player.vx = 0; player.vy = 0;
    player.hp -= 25;
    player.invuln = 60;
  }

  // stamina regen (FP does NOT regenerate on its own - only potions restore it)
  if (player.sta < player.maxSta) player.sta = Math.min(player.maxSta, player.sta + 0.35);

  // attack: tap J for a normal swing, hold it past a short threshold for the weapon's
  // FP-costing special. The special only fires once per hold; if it can't (no FP, on
  // cooldown), releasing still falls back to a normal tap attack.
  if (player.attackCooldown > 0) player.attackCooldown--;
  if (player.specialCooldown > 0) player.specialCooldown--;
  if (player.attackWindup > 0) {
    player.attackWindup--;
    if (player.attackWindup === 0) {
      resolveAttackHit();
    }
  }
  if (player.attackWindup === 0 && !player.specialType) player.attacking = false;

  const attackKeyDown = !!keys['KeyJ'];
  const canStartAction = !player.blocking && player.attackCooldown <= 0 && !player.specialType;
  if (attackKeyDown) {
    if (!player.attackHold.holding) {
      player.attackHold.holding = true;
      player.attackHold.startFrame = frame;
      player.attackHold.specialFired = false;
      player.attackHold.thresholdChecked = false;
    } else if (!player.attackHold.thresholdChecked && frame - player.attackHold.startFrame >= ATTACK_HOLD_THRESHOLD) {
      player.attackHold.thresholdChecked = true;
      if (canStartAction && player.specialCooldown <= 0 && player.fp >= player.weapon.specialCost) {
        startSpecial();
        player.attackHold.specialFired = true;
      }
    }
  } else if (player.attackHold.holding) {
    if (!player.attackHold.specialFired && canStartAction && player.sta >= player.weapon.staminaCost) {
      player.sta -= player.weapon.staminaCost;
      player.attackCooldown = player.weapon.cooldown;
      player.attackWindup = player.weapon.windup;
      player.attacking = true;
      player.hitThisSwing = false;
    }
    player.attackHold.holding = false;
  }

  updateSpecial();

  // potions: 1 = HP flask, 2 = FP flask - a short shared cooldown stops a held key spamming
  if (player.potionCooldown > 0) player.potionCooldown--;
  if (player.potionCooldown <= 0) {
    if (pressedOnce('Digit1', potionKeyState.hp) && player.hpPotions > 0) {
      player.hpPotions--;
      player.hp = Math.min(player.maxHp, player.hp + 40);
      player.potionCooldown = 20;
      spawnPotionSparkle('#ff6b5c');
    } else if (pressedOnce('Digit2', potionKeyState.fp) && player.fpPotions > 0) {
      player.fpPotions--;
      player.fp = Math.min(player.maxFp, player.fp + 45);
      player.potionCooldown = 20;
      spawnPotionSparkle('#5c9dff');
    }
  }

  if (player.invuln > 0) player.invuln--;
  if (player.blockFlash > 0) player.blockFlash--;

  // camera follow
  const targetCam = Math.max(0, Math.min(LEVEL_WIDTH - W, player.x - W/2));
  camera.x += (targetCam - camera.x) * 0.12;

  if (player.hp <= 0 && !player.dead) {
    player.dead = true;
    setTimeout(()=>{ if (state==='playing') state = 'lose'; }, 600);
  }

  // reach the portal -> travel back to the village
  if (!LEVEL_DEFS[currentLevelId].isVillage && player.x > LEVEL_WIDTH - 160) {
    enterLevel('village');
  }

  updateCoins();
}
const potionKeyState = { hp:{}, fp:{} };

// Routes all enemy damage through the shield: blocking cuts damage sharply and
// chips stamina instead, so timing the block against a telegraphed attack matters.
function damagePlayer(amount, invulnFrames) {
  if (player.invuln > 0) return;
  let dmg = amount;
  if (player.blocking) {
    dmg = amount * 0.2;
    player.sta = Math.max(0, player.sta - amount * 0.5);
    player.blockFlash = 10;
  }
  player.hp -= dmg;
  player.invuln = invulnFrames || 45;
}

function attackHitbox(reachOverride) {
  const w = player.weapon;
  const reach = reachOverride || w.range;
  const x = player.facing > 0 ? player.x + player.w : player.x - reach;
  return { x, y: player.y - 6, w: reach, h: player.h + 12 };
}

function resolveAttackHit(dmgOverride, reachOverride) {
  const hb = attackHitbox(reachOverride);
  const dmg = dmgOverride != null ? dmgOverride : currentWeaponDmg();
  for (const en of enemies) {
    if (en.dead) continue;
    if (rectsOverlap(hb, {x:en.x,y:en.y,w:en.w,h:en.h})) {
      damageEnemy(en, dmg);
    }
  }
}

// Sword special: hits everything in a radius around the player instead of a forward reach.
function resolveSpecialAoeHit(dmg, radius) {
  const cx = player.x + player.w/2, cy = player.y + player.h/2;
  for (const en of enemies) {
    if (en.dead) continue;
    const ex = en.x + en.w/2, ey = en.y + en.h/2;
    if (Math.hypot(ex-cx, ey-cy) <= radius) damageEnemy(en, dmg);
  }
}

// ---------- Weapon specials (long-press attack) ----------
function startSpecial() {
  const type = player.weapon.key;
  player.fp -= player.weapon.specialCost;
  player.specialCooldown = player.weapon.specialCooldown;
  player.specialType = type;
  player.attacking = true;

  if (type === 'sword') {
    player.specialTimer = 26;
  } else if (type === 'hammer') {
    player.specialTimer = 1;
    player.hammerThrow = {
      x: player.x + player.w/2, y: player.y + player.h/2 - 4,
      vx: player.facing * 7.5,
      dist: 0, maxDist: 230, returning: false,
      hitSet: new Set()
    };
  } else if (type === 'spear') {
    player.specialTimer = 44;
  } else if (type === 'dualdagger') {
    player.specialTimer = 20;
    player.dashSpecial = { hitSet: new Set() };
  } else if (type === 'greataxe') {
    player.specialTimer = 30;
  }
}

function updateSpecial() {
  if (!player.specialType) return;
  const type = player.specialType;

  if (type === 'sword') {
    player.specialTimer--;
    if (player.specialTimer === 16) {
      resolveSpecialAoeHit(currentWeaponDmg() * 1.4, 62);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  } else if (type === 'hammer') {
    updateHammerThrow();
  } else if (type === 'spear') {
    player.specialTimer--;
    if ([38, 30, 22, 14, 6].includes(player.specialTimer)) {
      resolveAttackHit(currentWeaponDmg() * 0.75, player.weapon.range + 8);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  } else if (type === 'dualdagger') {
    // gale dash: blink forward, damaging everything passed through once
    player.x += player.facing * 9;
    player.x = Math.max(0, Math.min(LEVEL_WIDTH - player.w, player.x));
    const hb = { x: player.x, y: player.y, w: player.w, h: player.h };
    for (const en of enemies) {
      if (en.dead || player.dashSpecial.hitSet.has(en)) continue;
      if (rectsOverlap(hb, {x:en.x,y:en.y,w:en.w,h:en.h})) {
        damageEnemy(en, currentWeaponDmg() * 1.3);
        player.dashSpecial.hitSet.add(en);
      }
    }
    player.specialTimer--;
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
      player.dashSpecial = null;
    }
  } else if (type === 'greataxe') {
    player.specialTimer--;
    if (player.specialTimer === 14) {
      resolveSpecialAoeHit(currentWeaponDmg() * 1.5, 80);
    }
    if (player.specialTimer <= 0) {
      player.specialType = null;
      player.attacking = false;
    }
  }
}

function checkHammerHits(h) {
  const hb = {x: h.x-18, y: h.y-18, w:36, h:36};
  for (const en of enemies) {
    if (en.dead || h.hitSet.has(en)) continue;
    if (rectsOverlap(hb, {x:en.x,y:en.y,w:en.w,h:en.h})) {
      damageEnemy(en, currentWeaponDmg() * 1.1);
      h.hitSet.add(en);
    }
  }
}

function updateHammerThrow() {
  const h = player.hammerThrow;
  if (!h) { player.specialType = null; return; }
  const speed = 7.5;
  if (!h.returning) {
    h.x += h.vx;
    h.dist += Math.abs(h.vx);
    checkHammerHits(h);
    if (h.dist >= h.maxDist) h.returning = true;
  } else {
    const dx = (player.x + player.w/2) - h.x;
    const dy = (player.y + player.h/2 - 4) - h.y;
    const dist = Math.hypot(dx, dy) || 1;
    h.x += dx/dist * speed;
    h.y += dy/dist * speed;
    checkHammerHits(h);
    if (dist < 16) {
      player.hammerThrow = null;
      player.specialType = null;
      player.attacking = false;
    }
  }
}

function spawnSparkleAt(x, y, color, count) {
  for (let i = 0; i < (count || 12); i++) {
    const ang = Math.random() * Math.PI * 2;
    addParticle({type:'spark', x, y,
      vx:Math.cos(ang)*2.2, vy:Math.sin(ang)*2.2-1.5, life:26, maxLife:26, size:2.5+Math.random()*2.5, color});
  }
}
function spawnPotionSparkle(color) {
  spawnSparkleAt(player.x + player.w/2, player.y + player.h/2, color);
}

function damageEnemy(en, dmg) {
  en.hp -= dmg;
  en.hitFlash = 8;
  if (en.hp <= 0 && !en.dead) {
    en.dead = true;
    if (en.type === 'bomb') {
      en.exploding = true;
      en.explodeTimer = 30;
      en.explodeRadius = en.isBoss ? 130 : 90;
      en.explodeDmg = en.isBoss ? 22 : 14;
    } else {
      for (let i=0;i<10;i++) {
        addParticle({type:'spark', x:en.x+en.w/2, y:en.y+en.h/2,
          vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6-2, life:20,maxLife:20, size:3+Math.random()*3, color:'#7fffb0'});
      }
    }
  }
}

function rectsOverlap(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ---------- Update: Enemies ----------
function updateEnemies() {
  for (const en of enemies) {
    if (en.dead) {
      if (en.type === 'bomb' && en.exploding) {
        en.explodeTimer--;
        if (en.explodeTimer === 6) {
          explodeAt(en.x+en.w/2, en.y+en.h/2, en.explodeRadius || 90, en.explodeDmg || 14);
        }
      }
      continue;
    }
    if (en.hitFlash > 0) en.hitFlash--;

    if (en.type === 'bomb') {
      const dx = player.x - en.x;
      const range = en.isBoss ? 440 : 360;
      const inRange = Math.abs(dx) < range && Math.abs(player.y - en.y) < 110;
      const closeGap = en.attackMode === 'melee' ? 30 : 160;
      // walk back and forth, face and approach the player if in range - frozen during its telegraph wind-up
      if (!en.telegraph) {
        if (inRange) {
          en.dir = dx > 0 ? 1 : -1;
          if (Math.abs(dx) > closeGap) en.x += en.dir * en.speed;
        } else if (frame % 90 === 0) {
          en.dir *= -1;
        } else {
          en.x += en.dir * en.speed;
        }
        // stay on its own platform - turn around at the edge instead of walking over a gap
        if (en.x <= en.homeMinX) { en.x = en.homeMinX; en.dir = 1; }
        if (en.x >= en.homeMaxX) { en.x = en.homeMaxX; en.dir = -1; }
      }
      en.y = en.groundY - en.h;

      if (en.attackCooldown > 0) en.attackCooldown--;
      if (!en.telegraph && inRange && en.attackCooldown<=0) {
        en.telegraph = true;
        en.dir = dx > 0 ? 1 : -1;
        // bosses use every 3rd attack for a longer-telegraphed AoE burst instead of their normal hit
        en.atkCount = (en.atkCount || 0) + 1;
        en.burst = en.isBoss && (en.atkCount % 3 === 0);
        en.attackWindup = en.burst ? 50 : 30;
      }
      if (en.telegraph) {
        en.attackWindup--;
        if (en.attackWindup <= 0) {
          en.telegraph = false;
          en.attackCooldown = en.burst ? 160 : 110;
          if (en.burst) {
            explodeAt(en.x+en.w/2, en.y+en.h/2, 100, en.dmg*1.6);
          } else if (en.attackMode === 'melee') {
            if (rectsOverlap(en, player)) damagePlayer(en.dmg);
          } else {
            throwBomb(en);
          }
        }
      }
    } else if (en.type === 'drone') {
      en.phase += 0.05;
      const dx = player.x - en.x;
      const dy = player.y - en.y;
      const dist = Math.hypot(dx,dy);
      const engageDist = en.isBoss ? 360 : 300;

      if (en.charging) {
        en.chargeTimer--;
        if (en.chargeTimer <= 0) {
          en.charging = false;
          if (en.attackMode === 'cast') {
            const len = Math.hypot(dx,dy) || 1;
            spawnCastProjectile(en, dx/len, dy/len);
            en.attackCooldown = en.isBoss ? 130 : 90;
          } else {
            en.dashing = true;
            const len = Math.hypot(dx,dy) || 1;
            en.dashDirX = dx/len; en.dashDirY = dy/len;
          }
        }
      } else if (!en.dashing) {
        en.y = en.baseY + Math.sin(en.phase)*14;
        if (dist < 240) {
          en.x += Math.sign(dx) * en.speed * 0.6;
        }
        en.dashTimer++;
        if (en.dashTimer > 110 && dist < engageDist && en.attackCooldown<=0) {
          en.charging = true;
          en.chargeTimer = 20; // ~0.33s wind-up flash before the dive/cast
          en.dashTimer = 0;
        }
      } else {
        en.x += en.dashDirX * en.speed * 3.2;
        en.y += en.dashDirY * en.speed * 3.2;
        en.dashTimer++;
        if (en.dashTimer > 22) { en.dashing = false; en.dashTimer=0; }
      }
      en.x = Math.max(0, Math.min(LEVEL_WIDTH - en.w, en.x));

      if (en.attackCooldown > 0) en.attackCooldown--;
      if (!en.charging && en.attackMode !== 'cast' && rectsOverlap(en, player) && en.attackCooldown<=0) {
        damagePlayer(en.dmg);
        en.attackCooldown = en.dashing ? 30 : 50;
      }
    }
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
}

// ---------- Drawing helpers ----------
function drawBar(x, y, w, h, pct, colorFill, colorBg, label) {
  ctx.fillStyle = colorBg;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = colorFill;
  ctx.fillRect(x, y, w * Math.max(0,pct), h);
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  if (label) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x - 26, y + h/2);
  }
}

function drawFlaskIcon(x, y, color, count, keyLabel) {
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  roundRect(ctx, x, y, 18, 20, 4);
  ctx.fill();
  const fillH = count > 0 ? 14 : 0;
  ctx.fillStyle = count > 0 ? color : 'rgba(255,255,255,0.15)';
  roundRect(ctx, x+2, y+18-fillH, 14, fillH, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, x, y, 18, 20, 4);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText(`x${count}`, x+24, y+15);
  if (keyLabel) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '9px sans-serif';
    ctx.fillText(keyLabel, x+2, y-3);
  }
}

function drawHUD() {
  drawBar(56, 16, 180, 16, player.hp/player.maxHp, '#e0453f', 'rgba(60,10,10,0.7)', 'HP');
  drawBar(56, 38, 180, 14, player.fp/player.maxFp, '#3f7fe0', 'rgba(10,20,60,0.7)', 'FP');
  drawBar(56, 58, 180, 12, player.sta/player.maxSta, '#4fd15b', 'rgba(10,40,10,0.7)', '耐力');

  // timer top-right, echoing the "1:00" in the drawing - the village has no timer
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'right';
  if (isFinite(levelTimeLeft)) {
    const secs = Math.max(0, Math.ceil(levelTimeLeft/60));
    const mm = Math.floor(secs/60), ss = secs%60;
    ctx.fillText(`${mm}:${ss.toString().padStart(2,'0')}`, W-24, 34);
  }
  ctx.font = 'bold 15px sans-serif';
  ctx.fillStyle = '#f5c542';
  ctx.fillText(`金幣 ${player.gold}`, W-24, 58);
  ctx.textAlign = 'left';

  // weapon indicator
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('武器: ' + player.weapon.name, 56, 90);

  // potion flasks, below the bars and clear of the top hint text: top = HP recovery, bottom = FP recovery
  drawFlaskIcon(160, 78, '#ff6b5c', player.hpPotions, '1');
  drawFlaskIcon(160, 104, '#5c9dff', player.fpPotions, '2');
}

function drawDragon(p) {
  ctx.save();
  ctx.translate(p.x + p.w/2, p.y + p.h/2);
  ctx.scale(p.facing, 1);
  const bob = p.onGround ? Math.sin(p.walkCycle)*2 : 0;
  ctx.translate(0, bob);

  if (p.invuln > 0 && Math.floor(frame/4)%2===0) ctx.globalAlpha = 0.4;

  // tail with a small spiked tip
  ctx.fillStyle = '#379143';
  ctx.beginPath();
  ctx.moveTo(-p.w/2, 6);
  ctx.quadraticCurveTo(-p.w/2-18, 11, -p.w/2-27, -2);
  ctx.quadraticCurveTo(-p.w/2-12, 3, -p.w/2, -4);
  ctx.fill();
  ctx.fillStyle = '#e8d55a';
  ctx.beginPath();
  ctx.moveTo(-p.w/2-23, -3);
  ctx.lineTo(-p.w/2-31, -7);
  ctx.lineTo(-p.w/2-21, 3);
  ctx.fill();

  // body - subtle gradient so it reads with some volume instead of a flat fill
  const bodyGrad = ctx.createLinearGradient(-p.w/2, -p.h/2, p.w/2, p.h/2);
  bodyGrad.addColorStop(0, '#5fd66c');
  bodyGrad.addColorStop(1, '#379143');
  ctx.fillStyle = bodyGrad;
  roundRect(ctx, -p.w/2+4, -p.h/2+14, p.w-8, p.h-22, 10);
  ctx.fill();

  // spine spikes
  ctx.fillStyle = '#e8d55a';
  for (const sx of [-p.w/2+7, -p.w/2+15, -p.w/2+23]) {
    ctx.beginPath();
    ctx.moveTo(sx-3, -p.h/2+16);
    ctx.lineTo(sx+3, -p.h/2+16);
    ctx.lineTo(sx, -p.h/2+7);
    ctx.fill();
  }

  // belly
  ctx.fillStyle = '#eaf7cf';
  roundRect(ctx, -p.w/2+9, -p.h/2+22, p.w-20, p.h-32, 7);
  ctx.fill();

  // legs with small claws
  ctx.fillStyle = '#379143';
  const legSwing = p.onGround ? Math.sin(p.walkCycle)*6 : 0;
  ctx.fillRect(-10, p.h/2-18+legSwing*0.2, 8, 16);
  ctx.fillRect(4, p.h/2-18-legSwing*0.2, 8, 16);
  ctx.fillStyle = '#e8d55a';
  ctx.beginPath();
  ctx.moveTo(-11, p.h/2-2+legSwing*0.2); ctx.lineTo(-5, p.h/2-2+legSwing*0.2); ctx.lineTo(-8, p.h/2+3+legSwing*0.2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(3, p.h/2-2-legSwing*0.2); ctx.lineTo(9, p.h/2-2-legSwing*0.2); ctx.lineTo(6, p.h/2+3-legSwing*0.2);
  ctx.fill();

  // small arm connecting shoulder to the weapon grip, plus a pauldron colored to the equipped weapon
  ctx.fillStyle = '#379143';
  roundRect(ctx, p.w/2-15, -3, 13, 6, 3);
  ctx.fill();
  ctx.fillStyle = p.weapon.color;
  ctx.beginPath();
  ctx.arc(p.w/2-17, -p.h/2+23, 6, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.28)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // head
  ctx.fillStyle = '#4CC15A';
  ctx.beginPath();
  ctx.ellipse(p.w/2-14, -p.h/2+16, 15, 13, 0, 0, Math.PI*2);
  ctx.fill();
  // snout
  roundRect(ctx, p.w/2-9, -p.h/2+11, 16, 10, 4);
  ctx.fill();
  // brow ridge for a sharper, more determined look
  ctx.fillStyle = '#2f7a3a';
  ctx.beginPath();
  ctx.moveTo(p.w/2-20, -p.h/2+7);
  ctx.lineTo(p.w/2-5, -p.h/2+5);
  ctx.lineTo(p.w/2-7, -p.h/2+9);
  ctx.lineTo(p.w/2-20, -p.h/2+10);
  ctx.fill();
  // swept-back horn
  ctx.fillStyle = '#e8d55a';
  ctx.beginPath();
  ctx.moveTo(p.w/2-5, -p.h/2+4);
  ctx.quadraticCurveTo(p.w/2+10, -p.h/2-4, p.w/2+9, -p.h/2-12);
  ctx.quadraticCurveTo(p.w/2+2, -p.h/2-2, p.w/2-1, -p.h/2+5);
  ctx.fill();
  // eye with a highlight for some life in the expression
  ctx.fillStyle = '#20321f';
  ctx.beginPath();
  ctx.arc(p.w/2-10, -p.h/2+15, 2.2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(p.w/2-10.8, -p.h/2+14.2, 0.8, 0, Math.PI*2);
  ctx.fill();

  ctx.globalAlpha = 1;

  // weapon (holstered while the shield is up)
  if (p.blocking) {
    drawShieldSprite(p);
  } else {
    drawWeaponSprite(p);
  }

  // whirl-slash sweep trail for the sword special
  if (p.specialType === 'sword') {
    const t = 1 - p.specialTimer / 26;
    ctx.save();
    ctx.globalAlpha = 0.55 * (1 - t);
    ctx.strokeStyle = '#dfe8f0';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, 34, 0, Math.PI * 2 * t);
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

function drawShieldSprite(p) {
  ctx.save();
  ctx.translate(p.w/2 - 2, 2);
  if (p.blockFlash > 0) {
    ctx.save();
    ctx.globalAlpha = p.blockFlash / 10;
    ctx.strokeStyle = '#dff0ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 18 + (10 - p.blockFlash), 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  roundRect(ctx, -6, -16, 16, 32, 6);
  ctx.fillStyle = '#8a6a3a';
  ctx.fill();
  roundRect(ctx, -3, -12, 10, 24, 4);
  ctx.fillStyle = '#c9d6e3';
  ctx.fill();
  ctx.fillStyle = '#e8d55a';
  ctx.beginPath();
  ctx.arc(2, 0, 3, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawWeaponSprite(p) {
  const w = p.weapon;
  if (w.key === 'hammer' && p.hammerThrow) return; // the hammer is drawn as a flying projectile elsewhere

  let angle = -0.4;
  if (p.specialType === 'sword') {
    const t = 1 - p.specialTimer / 26;
    angle = t * Math.PI * 2.4; // fast full spin for the whirl slash
  } else if (p.specialType === 'spear') {
    const t = 1 - p.specialTimer / 44;
    const cyc = (t * 5) % 1; // 5 quick thrust/retract cycles
    angle = cyc < 0.4 ? -0.9 + (cyc/0.4) * 1.5 : 0.6 - ((cyc-0.4)/0.6) * 1.5;
  } else if (p.specialType === 'dualdagger') {
    angle = 0.2 + Math.sin(frame * 1.3) * 0.5; // rapid slashing flicker during the dash
  } else if (p.specialType === 'greataxe') {
    const t = 1 - p.specialTimer / 30;
    angle = -1.1 + t * 2.0; // one huge overhead swing
  } else if (p.attackWindup > 0) {
    const t = 1 - p.attackWindup / w.windup;
    angle = -0.9 + t * 1.6;
  } else if (p.attacking) {
    angle = 0.7;
  }
  ctx.save();
  ctx.translate(p.w/2-6, -2);
  ctx.rotate(angle);
  if (w.key === 'sword') {
    ctx.fillStyle = '#8a8f99';
    ctx.fillRect(0, -2, 34, 4);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, -3, 8, 6);
  } else if (w.key === 'hammer') {
    ctx.fillStyle = '#7a5a3a';
    ctx.fillRect(0, -2, 26, 4);
    ctx.fillStyle = '#6b6f76';
    ctx.fillRect(22, -9, 16, 18);
  } else if (w.key === 'spear') {
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-4, -2, 46, 3);
    ctx.fillStyle = '#c9d6e3';
    ctx.beginPath();
    ctx.moveTo(42, -6); ctx.lineTo(52, 0); ctx.lineTo(42, 6);
    ctx.fill();
  } else if (w.key === 'dualdagger') {
    ctx.fillStyle = '#d94f6a';
    ctx.fillRect(0, -2, 26, 4);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, -3, 8, 6);
    ctx.save();
    ctx.rotate(-0.6);
    ctx.fillStyle = '#d94f6a';
    ctx.fillRect(0, -2, 22, 4);
    ctx.restore();
  } else if (w.key === 'greataxe') {
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(0, -2, 30, 4);
    ctx.fillStyle = '#5a6b7a';
    ctx.beginPath();
    ctx.moveTo(24, -16); ctx.quadraticCurveTo(48, -18, 44, 2);
    ctx.quadraticCurveTo(48, 20, 24, 18);
    ctx.quadraticCurveTo(30, 2, 24, -16);
    ctx.fill();
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// Pulsing red ring + "!" mark used to telegraph an incoming enemy attack before it lands.
function drawAttackTelegraph(cx, cy, radius) {
  const pulse = 0.5 + 0.5 * Math.sin(frame * 0.9);
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.4 * pulse;
  ctx.strokeStyle = '#ff3b30';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, radius + pulse * 5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#ff3b30';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('!', cx, cy - radius - 10);
  ctx.textAlign = 'left';
}

function shadeColor(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  let r = Math.max(0, Math.min(255, (num >> 16) + Math.round(2.55*percent)));
  let g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + Math.round(2.55*percent)));
  let b = Math.max(0, Math.min(255, (num & 0xff) + Math.round(2.55*percent)));
  return `rgb(${r},${g},${b})`;
}

// Bosses get their own bigger, more elaborate silhouette instead of a scaled-up mob:
// a four-legged horned beast for ground bosses, a winged horned dragon for flying ones,
// plus a pulsing dark aura underneath to read as unmistakably "boss" at a glance.
function drawBossCreature(en) {
  if (en.exploding) {
    const warnPct = en.explodeTimer / 30;
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, 14 + (1-warnPct) * (en.explodeRadius || 130));
  } else if (en.telegraph || en.charging) {
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, en.burst ? 56 : 40);
  }

  const pulse = 0.5 + 0.5 * Math.sin(frame * 0.07);
  ctx.save();
  ctx.globalAlpha = 0.28 + 0.14 * pulse;
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.ellipse(en.x + en.w/2, en.y + en.h + 4, en.w*0.62, 12, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(en.x, en.y);
  if (en.hitFlash > 0) ctx.filter = 'brightness(1.8)';
  if (en.type === 'bomb') drawBossBeast(en); else drawBossDragon(en);
  ctx.restore();

  drawEnemyHp(en);
}

function drawBossBeast(en) {
  const cx = en.w/2, cy = en.h*0.58;
  const bodyW = en.w*0.62, bodyH = en.h*0.5;

  // tail with a spiked tip
  ctx.fillStyle = shadeColor(en.colorMain, -15);
  ctx.beginPath();
  ctx.moveTo(cx - bodyW*0.9, cy);
  ctx.quadraticCurveTo(cx - en.w*0.55, cy - en.h*0.15, cx - en.w*0.48, cy - en.h*0.42);
  ctx.quadraticCurveTo(cx - en.w*0.42, cy - en.h*0.1, cx - bodyW*0.7, cy + bodyH*0.2);
  ctx.fill();
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.moveTo(cx - en.w*0.5, cy - en.h*0.38);
  ctx.lineTo(cx - en.w*0.6, cy - en.h*0.52);
  ctx.lineTo(cx - en.w*0.44, cy - en.h*0.3);
  ctx.fill();

  // back legs (behind the body)
  ctx.fillStyle = shadeColor(en.colorMain, -25);
  roundRect(ctx, cx - bodyW*0.55, en.h*0.72, en.w*0.14, en.h*0.3, 4); ctx.fill();
  roundRect(ctx, cx + bodyW*0.35, en.h*0.72, en.w*0.14, en.h*0.3, 4); ctx.fill();

  // body
  ctx.fillStyle = en.colorMain;
  roundRect(ctx, cx - bodyW, cy - bodyH, bodyW*2, bodyH*1.5, bodyH*0.5);
  ctx.fill();
  ctx.strokeStyle = shadeColor(en.colorMain, -35);
  ctx.lineWidth = 2;
  roundRect(ctx, cx - bodyW, cy - bodyH, bodyW*2, bodyH*1.5, bodyH*0.5);
  ctx.stroke();

  // front legs with claws (in front of the body)
  ctx.fillStyle = shadeColor(en.colorMain, -10);
  roundRect(ctx, cx - bodyW*0.85, en.h*0.68, en.w*0.16, en.h*0.34, 4); ctx.fill();
  roundRect(ctx, cx + bodyW*0.55, en.h*0.68, en.w*0.16, en.h*0.34, 4); ctx.fill();
  ctx.fillStyle = en.colorAccent;
  for (const lx of [cx - bodyW*0.85, cx + bodyW*0.55]) {
    ctx.beginPath();
    ctx.moveTo(lx-2, en.h*1.02); ctx.lineTo(lx+en.w*0.16+2, en.h*1.02); ctx.lineTo(lx+en.w*0.08, en.h*1.1);
    ctx.fill();
  }

  // spine spikes
  ctx.fillStyle = en.colorAccent;
  for (let i = 0; i < 5; i++) {
    const sx = cx - bodyW*0.7 + i*(bodyW*1.4/4);
    const sh = bodyH*0.5 * (1 - Math.abs(i-2)/3);
    ctx.beginPath();
    ctx.moveTo(sx-6, cy-bodyH*0.85);
    ctx.lineTo(sx+6, cy-bodyH*0.85);
    ctx.lineTo(sx, cy-bodyH*0.85-sh-10);
    ctx.fill();
  }

  // head with horns and glowing eyes
  const hx = cx + bodyW*0.9, hy = cy - bodyH*0.55;
  ctx.fillStyle = en.colorMain;
  ctx.beginPath();
  ctx.ellipse(hx, hy, en.w*0.24, en.h*0.2, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = shadeColor(en.colorMain, 8);
  roundRect(ctx, hx + en.w*0.1, hy - en.h*0.06, en.w*0.22, en.h*0.16, 6);
  ctx.fill();
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.moveTo(hx - en.w*0.05, hy - en.h*0.16);
  ctx.lineTo(hx + en.w*0.02, hy - en.h*0.42);
  ctx.lineTo(hx + en.w*0.1, hy - en.h*0.16);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx + en.w*0.1, hy - en.h*0.16);
  ctx.lineTo(hx + en.w*0.2, hy - en.h*0.4);
  ctx.lineTo(hx + en.w*0.24, hy - en.h*0.14);
  ctx.fill();
  const eyeGlow = en.telegraph ? (0.6 + 0.4*Math.sin(frame*0.8)) : 1;
  ctx.globalAlpha = eyeGlow;
  ctx.beginPath(); ctx.arc(hx+en.w*0.05, hy-en.h*0.02, 3.4, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = shadeColor(en.colorMain, -40);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(hx + en.w*0.1, hy + en.h*0.08);
  ctx.lineTo(hx + en.w*0.3, hy + en.h*0.1);
  ctx.stroke();
}

function drawBossDragon(en) {
  const cx = en.w/2, cy = en.h/2;
  const flap = Math.sin(frame*0.15) * 0.5;

  // tail
  ctx.fillStyle = shadeColor(en.colorMain, -15);
  ctx.beginPath();
  ctx.moveTo(cx - en.w*0.4, cy);
  ctx.quadraticCurveTo(cx - en.w*0.75, cy + en.h*0.1, cx - en.w*0.95, cy - en.h*0.15);
  ctx.quadraticCurveTo(cx - en.w*0.7, cy + en.h*0.05, cx - en.w*0.35, cy + en.h*0.15);
  ctx.fill();

  // wings (behind the body, flapping)
  ctx.fillStyle = shadeColor(en.colorMain, -20);
  ctx.save();
  ctx.translate(cx - en.w*0.1, cy);
  ctx.rotate(-0.5 - flap);
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(-en.w*0.55, -en.h*0.35); ctx.lineTo(-en.w*0.5, en.h*0.05); ctx.lineTo(-en.w*0.2, en.h*0.15);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(cx - en.w*0.1, cy);
  ctx.rotate(0.5 + flap);
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(-en.w*0.55, en.h*0.35); ctx.lineTo(-en.w*0.5, -en.h*0.05); ctx.lineTo(-en.w*0.2, -en.h*0.15);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // body + lighter belly
  ctx.fillStyle = en.colorMain;
  roundRect(ctx, cx-en.w*0.42, cy-en.h*0.34, en.w*0.75, en.h*0.68, en.h*0.3);
  ctx.fill();
  ctx.strokeStyle = shadeColor(en.colorMain, -35);
  ctx.lineWidth = 2;
  roundRect(ctx, cx-en.w*0.42, cy-en.h*0.34, en.w*0.75, en.h*0.68, en.h*0.3);
  ctx.stroke();
  ctx.fillStyle = shadeColor(en.colorMain, 20);
  roundRect(ctx, cx-en.w*0.3, cy-en.h*0.05, en.w*0.5, en.h*0.32, en.h*0.14);
  ctx.fill();

  // head with horns and glowing eyes
  const hx = cx + en.w*0.42, hy = cy - en.h*0.1;
  ctx.fillStyle = en.colorMain;
  ctx.beginPath();
  ctx.ellipse(hx, hy, en.w*0.2, en.h*0.22, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.moveTo(hx-en.w*0.06, hy-en.h*0.18); ctx.lineTo(hx-en.w*0.02, hy-en.h*0.42); ctx.lineTo(hx+en.w*0.06, hy-en.h*0.18);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx+en.w*0.08, hy-en.h*0.18); ctx.lineTo(hx+en.w*0.14, hy-en.h*0.4); ctx.lineTo(hx+en.w*0.2, hy-en.h*0.16);
  ctx.fill();
  const eyeGlow = en.charging ? (0.6 + 0.4*Math.sin(frame*0.8)) : 1;
  ctx.globalAlpha = eyeGlow;
  ctx.beginPath(); ctx.arc(hx+en.w*0.06, hy-en.h*0.02, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = shadeColor(en.colorMain, 6);
  roundRect(ctx, hx+en.w*0.14, hy-en.h*0.06, en.w*0.16, en.h*0.14, 4);
  ctx.fill();
}

function drawBombBot(en) {
  const maxWindup = en.burst ? 50 : 30;
  if (en.exploding) {
    const warnPct = en.explodeTimer / 30;
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, 14 + (1-warnPct) * (en.explodeRadius || 76));
  } else if (en.telegraph) {
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, en.isBoss ? 34 : 22);
  }
  ctx.save();
  ctx.translate(en.x, en.y);
  if (en.hitFlash > 0) ctx.filter = 'brightness(2)';

  const bodyR = en.w/2 - 2;
  const cx = en.w/2, cy = en.h/2 + en.h*0.1;

  // legs
  ctx.fillStyle = shadeColor(en.colorMain, -30);
  roundRect(ctx, cx-en.w*0.29, en.h-8, en.w*0.18, 12, 2); ctx.fill();
  roundRect(ctx, cx+en.w*0.11, en.h-8, en.w*0.18, 12, 2); ctx.fill();
  ctx.fillStyle = shadeColor(en.colorMain, -50);
  roundRect(ctx, cx-en.w*0.34, en.h+1, en.w*0.26, 4, 2); ctx.fill();
  roundRect(ctx, cx+en.w*0.08, en.h+1, en.w*0.26, 4, 2); ctx.fill();

  // resting arm, tucked mostly behind the round torso on the side opposite the attack
  ctx.fillStyle = en.colorMain;
  roundRect(ctx, cx + (-en.dir)*bodyR*0.7 - 4, en.h/2-2, 8, 13, 3); ctx.fill();

  // body
  ctx.fillStyle = en.colorMain;
  ctx.beginPath(); ctx.arc(cx, cy, bodyR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = shadeColor(en.colorMain, -40);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, bodyR, 0, Math.PI*2); ctx.stroke();

  // attacking arm - winds up and back before releasing
  ctx.save();
  ctx.translate(cx + en.dir*bodyR*0.6, en.h/2+2);
  let armAngle = en.dir * 0.5;
  if (en.telegraph) {
    const t = 1 - en.attackWindup / maxWindup;
    armAngle = en.dir * (0.5 - t * 2.1);
  }
  ctx.rotate(armAngle);
  ctx.fillStyle = en.colorMain;
  roundRect(ctx, -4, 0, 8, 15, 3);
  ctx.fill();
  if (en.telegraph && en.attackMode !== 'melee') {
    ctx.fillStyle = shadeColor(en.colorMain, -50);
    ctx.beginPath(); ctx.arc(0, 17, 5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // face: the classic cross-bolt for the bomb-bot kind, simple monster eyes for everything else
  if (en.kind === 'bomb') {
    ctx.strokeStyle = en.colorAccent;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx-8, cy-6); ctx.lineTo(cx+8, cy+6);
    ctx.moveTo(cx+8, cy-6); ctx.lineTo(cx-8, cy+6);
    ctx.stroke();
    ctx.strokeStyle = '#c9a24a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy-bodyR);
    ctx.quadraticCurveTo(cx+6, cy-bodyR-9, cx+2, cy-bodyR-13);
    ctx.stroke();
    ctx.fillStyle = frame%10<5 ? '#ff5a3c' : '#ffcf4a';
    ctx.beginPath(); ctx.arc(cx+2, cy-bodyR-14, 3, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = en.colorAccent;
    ctx.beginPath(); ctx.arc(cx-6, cy-4, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+6, cy-4, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(cx-6, cy-4, 1.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+6, cy-4, 1.4, 0, Math.PI*2); ctx.fill();
    if (en.kind === 'vine' || en.kind === 'lurkvine') {
      ctx.fillStyle = shadeColor(en.colorMain, -20);
      for (const ox of [-8, 0, 8]) {
        ctx.beginPath();
        ctx.moveTo(cx+ox-3, cy-bodyR+4); ctx.lineTo(cx+ox+3, cy-bodyR+4); ctx.lineTo(cx+ox, cy-bodyR-6);
        ctx.fill();
      }
    } else if (en.kind === 'shell') {
      ctx.strokeStyle = shadeColor(en.colorMain, -25);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy-2, bodyR-4, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
    } else if (en.kind === 'wolf') {
      ctx.fillStyle = shadeColor(en.colorMain, -15);
      ctx.beginPath();
      ctx.moveTo(cx-bodyR*0.6, cy-bodyR*0.7); ctx.lineTo(cx-bodyR*0.9, cy-bodyR*1.3); ctx.lineTo(cx-bodyR*0.3, cy-bodyR*0.9);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx+bodyR*0.6, cy-bodyR*0.7); ctx.lineTo(cx+bodyR*0.9, cy-bodyR*1.3); ctx.lineTo(cx+bodyR*0.3, cy-bodyR*0.9);
      ctx.fill();
    }
  }

  // treads/base
  ctx.fillStyle = shadeColor(en.colorMain, -35);
  ctx.fillRect(2, en.h-6, en.w-4, 6);
  ctx.restore();

  drawEnemyHp(en);
}

function drawDrone(en) {
  if (en.charging) {
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, en.isBoss ? 30 : 20);
  }
  ctx.save();
  ctx.translate(en.x, en.y);
  if (en.hitFlash > 0) ctx.filter = 'brightness(2)';
  if (en.charging) ctx.filter = 'brightness(1.6) saturate(1.4)';

  ctx.fillStyle = en.colorMain;
  roundRect(ctx, 4, 4, en.w-8, en.h-10, 4);
  ctx.fill();
  ctx.fillStyle = en.colorAccent;
  ctx.beginPath();
  ctx.arc(en.w/2, en.h/2, 3, 0, Math.PI*2);
  ctx.fill();

  if (en.kind === 'tentacle') {
    ctx.strokeStyle = en.colorMain;
    ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
      const tx = 6 + i*(en.w-12)/3;
      const wig = Math.sin(frame*0.15 + i) * 4;
      ctx.beginPath();
      ctx.moveTo(tx, en.h-6);
      ctx.quadraticCurveTo(tx+wig, en.h+6, tx+wig*0.6, en.h+14);
      ctx.stroke();
    }
  } else if (en.kind === 'bird' || en.kind === 'owl' || en.kind === 'dragon') {
    const flap = Math.sin(frame*0.3) * 0.6;
    ctx.fillStyle = en.colorAccent;
    ctx.save(); ctx.translate(2, en.h/2); ctx.rotate(-0.3 - flap);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-14,-4); ctx.lineTo(-10,6); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(en.w-2, en.h/2); ctx.rotate(0.3 + flap);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(14,-4); ctx.lineTo(10,6); ctx.fill();
    ctx.restore();
    if (en.kind === 'owl' || en.kind === 'dragon') {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(en.w/2-6, en.h/2-2, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(en.w/2+6, en.h/2-2, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#3a2a1a';
      ctx.beginPath(); ctx.arc(en.w/2-6, en.h/2-2, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(en.w/2+6, en.h/2-2, 2, 0, Math.PI*2); ctx.fill();
    }
  } else {
    ctx.strokeStyle = shadeColor(en.colorMain, -40);
    ctx.lineWidth = 2;
    const spin = (frame*0.9) % (Math.PI*2);
    [[0,0],[en.w,0],[0,en.h-6],[en.w,en.h-6]].forEach(([ax,ay])=>{
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(spin);
      ctx.beginPath();
      ctx.moveTo(-6,0); ctx.lineTo(6,0);
      ctx.stroke();
      ctx.restore();
    });
  }
  ctx.restore();

  drawEnemyHp(en);
}

function drawEnemyHp(en) {
  const bw = en.w;
  if (en.isBoss && en.name) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(en.name, en.x + en.w/2, en.y - 16);
    ctx.textAlign = 'left';
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(en.x, en.y-10, bw, 5);
  ctx.fillStyle = '#e0453f';
  ctx.fillRect(en.x, en.y-10, bw * Math.max(0,en.hp/en.maxHp), 5);
}

function drawPlatform(p) {
  ctx.fillStyle = p.floating ? 'rgba(230,230,245,0.85)' : 'rgba(235,235,245,0.92)';
  ctx.fillRect(p.x - camera.x, p.y, p.w, H - p.y + 40);
  ctx.strokeStyle = 'rgba(40,40,60,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(p.x - camera.x, p.y, p.w, 4);
}

function drawPortal(x, groundY) {
  ctx.save();
  ctx.translate(x - camera.x, groundY);
  const pulse = 0.5 + 0.5 * Math.sin(frame * 0.06);

  // stone archway frame
  ctx.fillStyle = '#4a4258';
  roundRect(ctx, -58, -190, 24, 190, 8); ctx.fill();
  roundRect(ctx, 34, -190, 24, 190, 8); ctx.fill();
  roundRect(ctx, -58, -206, 116, 26, 10); ctx.fill();

  // outer glow
  ctx.fillStyle = `rgba(150,90,255,${0.22 + 0.13*pulse})`;
  ctx.beginPath(); ctx.ellipse(-12, -100, 60, 94, 0, 0, Math.PI*2); ctx.fill();

  // swirling portal disc
  const grad = ctx.createRadialGradient(-12, -100, 4, -12, -100, 46);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.45, '#c9a2ff');
  grad.addColorStop(1, '#5a2fae');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(-12, -100, 42, 78, 0, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const t = (frame * 0.03 + i / 3) % 1;
    ctx.globalAlpha = 1 - t;
    ctx.beginPath();
    ctx.ellipse(-12, -100, 42 * (1 - t) + 4, 78 * (1 - t) + 4, 0, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color || '#ffdd88';
    ctx.beginPath();
    ctx.arc(p.x-camera.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMoon(cx, cy) {
  const R = 150;
  ctx.fillStyle = 'rgba(244,206,120,0.30)';
  ctx.beginPath(); ctx.arc(cx, cy, R*1.42, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(230,150,90,0.40)';
  ctx.beginPath(); ctx.arc(cx, cy, R*1.22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(96,140,205,0.42)';
  ctx.beginPath(); ctx.arc(cx, cy, R*1.06, 0, Math.PI*2); ctx.fill();
  // flat-shaded moon body (a touch of gradient, same restrained style as the dragon's belly panel)
  const body = ctx.createRadialGradient(cx-R*0.3, cy-R*0.3, R*0.2, cx, cy, R);
  body.addColorStop(0, '#c97a5c');
  body.addColorStop(1, '#a3573d');
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  const craters = [[-0.32,-0.22,0.22],[0.26,-0.12,0.15],[-0.08,0.32,0.16],[0.36,0.3,0.1],[0.02,-0.02,0.09]];
  for (const [ox,oy,r] of craters) {
    ctx.beginPath(); ctx.arc(cx+ox*R, cy+oy*R, r*R, 0, Math.PI*2); ctx.fill();
  }
}

function drawFocal(kind, cx, cy) {
  if (kind === 'volcano') {
    const R = 150;
    ctx.fillStyle = 'rgba(255,140,60,0.30)';
    ctx.beginPath(); ctx.arc(cx, cy+40, R*1.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a1710';
    ctx.beginPath();
    ctx.moveTo(cx-R*1.1, cy+R*0.9);
    ctx.lineTo(cx-R*0.3, cy-R*0.9);
    ctx.lineTo(cx+R*0.3, cy-R*0.9);
    ctx.lineTo(cx+R*1.1, cy+R*0.9);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff7a2e';
    ctx.beginPath(); ctx.ellipse(cx, cy-R*0.85, R*0.28, R*0.12, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,140,50,0.7)';
    ctx.lineWidth = 4;
    for (const dx of [-0.15, 0.05, 0.2]) {
      ctx.beginPath();
      ctx.moveTo(cx+dx*R, cy-R*0.8);
      ctx.lineTo(cx+dx*R*1.6, cy+R*0.7);
      ctx.stroke();
    }
  } else if (kind === 'bubble') {
    const R = 160;
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, R*1.4);
    grad.addColorStop(0, 'rgba(180,230,255,0.45)');
    grad.addColorStop(1, 'rgba(180,230,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, R*1.4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const bx = cx + Math.sin(i*1.7) * R*0.8;
      const by = ((cy + i*60 - (frame*0.6)%360) % 400) - 200 + cy;
      ctx.beginPath(); ctx.arc(bx, by, 5 + (i%3)*3, 0, Math.PI*2); ctx.stroke();
    }
  } else if (kind === 'cloud') {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (const [ox,oy,r] of [[-70,10,50],[-20,-15,60],[40,0,55],[85,15,40]]) {
      ctx.beginPath(); ctx.arc(cx+ox, cy+oy, r, 0, Math.PI*2); ctx.fill();
    }
  } else if (kind === 'canopy') {
    ctx.fillStyle = 'rgba(20,60,20,0.55)';
    for (const [ox,oy,r] of [[-80,-10,70],[-20,-40,80],[50,-15,75],[100,10,55]]) {
      ctx.beginPath(); ctx.arc(cx+ox, cy+oy, r, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,240,180,0.15)';
    ctx.beginPath(); ctx.arc(cx+20, cy-10, 30, 0, Math.PI*2); ctx.fill();
  } else {
    drawMoon(cx, cy);
  }
}

function drawBackground() {
  const theme = (LEVEL_DEFS[currentLevelId] || LEVEL_DEFS.redmoon).theme;

  // sky gradient - flat vector wash, palette swapped per level theme
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, theme.sky1);
  sky.addColorStop(0.5, theme.sky2);
  sky.addColorStop(1, theme.sky3);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // stars: slow parallax, gentle twinkle - only for the night-sky themes
  if (theme.focal === 'moon') {
    const starParX = -camera.x * 0.15;
    for (let tile = -1; tile <= Math.ceil(W / STAR_TILE) + 1; tile++) {
      const baseX = (((starParX % STAR_TILE) + STAR_TILE) % STAR_TILE) + tile * STAR_TILE - STAR_TILE;
      for (const s of stars) {
        const tw = 0.5 + 0.5 * Math.sin(frame * 0.05 + s.phase);
        ctx.globalAlpha = 0.25 + 0.55 * tw;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(baseX + s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // one big focal backdrop object per "phase" of the level, drifting slowly behind the action.
  // World position of instance i is i*tile + offset; screen position subtracts the
  // parallax-scaled camera so it scrolls slower than the foreground.
  const focalTile = 3000, focalOffset = 460, focalGlow = 213;
  const focalParX = camera.x * 0.35;
  const iMin = Math.floor((focalParX - focalGlow - focalOffset) / focalTile);
  const iMax = Math.ceil((focalParX + W + focalGlow - focalOffset) / focalTile);
  for (let i = iMin; i <= iMax; i++) {
    drawFocal(theme.focal, i * focalTile + focalOffset - focalParX, H * 0.32);
  }

  // rolling silhouette hills for a mid-ground layer, same flat-color language as the platforms
  const hillParX = camera.x * 0.55;
  ctx.fillStyle = theme.hill;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) {
    ctx.lineTo(x, H * 0.72 + hillHeight(x + hillParX));
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(12,8,22,0.16)';
  ctx.fillRect(0, 0, W, H);
}

// ---------- Main update / render ----------
function update() {
  if (state !== 'playing') return;
  frame++;
  levelTimeLeft--;
  if (levelTimeLeft <= 0) { state = 'lose'; }
  updatePlayer();
  updateEnemies();
  updateProjectiles();
  updateParticles();
}

function render() {
  ctx.clearRect(0,0,W,H);

  if (state === 'menu') { renderMenu(); return; }

  const levelDef = LEVEL_DEFS[currentLevelId];
  drawBackground();

  for (const p of platforms) drawPlatform(p);
  if (levelDef.isVillage) {
    drawVillageProps();
  } else {
    drawCoins();
    drawPortal(LEVEL_WIDTH - 80, GROUND_Y);
  }

  for (const en of enemies) {
    if (en.dead && !(en.type==='bomb' && en.exploding)) continue;
    ctx.save();
    ctx.translate(-camera.x, 0);
    if (en.isBoss) drawBossCreature(en);
    else if (en.type === 'bomb') drawBombBot(en);
    else drawDrone(en);
    ctx.restore();
  }

  drawProjectiles();
  drawHammerThrow();

  ctx.save();
  ctx.translate(-camera.x, 0);
  if (!player.dead) drawDragon(player);
  drawParticles();
  ctx.restore();

  drawHUD();

  if (state === 'lose') renderOverlay('挑戰失敗', '按 R 重新挑戰', '#e0453f');
  if (overlay === 'weaponshop') renderWeaponShopOverlay();
  if (overlay === 'armorshop') renderArmorShopOverlay();
  if (overlay === 'quest') renderQuestOverlay();
}

let villageCardRects = [];
// Auto-vivifying per-key-code state for pressedOnce(), so any overlay can use as many
// number-key slots as it needs without a fixed-size lookup table going out of bounds.
const villageKeyStates = {};
function villageKeyState(code) {
  if (!villageKeyStates[code]) villageKeyStates[code] = {};
  return villageKeyStates[code];
}

// Generic "level-based repeatable purchase" shop screen - used for the armor shop
// (armor / HP flask / MP flask) and reused for the weapon-strength card in the
// weapon shop, since both use the same shopLevels + cost-scaling system.
function renderItemShopCards(items, y, startIndex) {
  const cw = 200, ch = 190, gap = 20;
  const totalW = items.length * cw + (items.length - 1) * gap;
  const startX = W/2 - totalW/2;

  items.forEach((item, i) => {
    const x = startX + i * (cw + gap);
    const level = player.shopLevels[item.id];
    const maxed = level >= item.maxLevel;
    const cost = shopItemCost(item);
    const afford = !maxed && player.gold >= cost;
    villageCardRects.push({x, y, w:cw, h:ch, id:item.id, kind:'item'});

    ctx.fillStyle = afford ? 'rgba(76,193,90,0.16)' : 'rgba(255,255,255,0.08)';
    roundRect(ctx, x, y, cw, ch, 12);
    ctx.fill();
    ctx.strokeStyle = afford ? '#4CC15A' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = afford ? 2.5 : 1.5;
    roundRect(ctx, x, y, cw, ch, 12);
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 17px sans-serif';
    ctx.fillText(item.name, x+cw/2, y+34);
    ctx.font = '12px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    ctx.fillText(item.desc, x+cw/2, y+58);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '11px sans-serif';
    ctx.fillText(`等級 ${level}/${item.maxLevel}`, x+cw/2, y+80);

    if (maxed) {
      ctx.fillStyle = '#4CC15A';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('已強化至上限', x+cw/2, y+ch-44);
    } else {
      ctx.fillStyle = afford ? '#f5c542' : 'rgba(255,255,255,0.4)';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText(`${cost} 金幣`, x+cw/2, y+ch-44);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '11px sans-serif';
    ctx.fillText(`按 ${startIndex+i+1} 或點擊購買`, x+cw/2, y+ch-20);
  });
}

function drawWeaponIcon(key) {
  ctx.save();
  ctx.rotate(-0.5);
  if (key === 'sword') {
    ctx.fillStyle = '#c9d6e3';
    ctx.fillRect(-4, -50, 8, 70);
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-14, 18, 28, 10);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-5, 26, 10, 16);
  } else if (key === 'hammer') {
    ctx.fillStyle = '#7a5a3a';
    ctx.fillRect(-4, -20, 8, 70);
    ctx.fillStyle = '#6b6f76';
    ctx.fillRect(-26, -50, 52, 36);
    ctx.strokeStyle = '#3a3a3a';
    ctx.strokeRect(-26,-50,52,36);
  } else if (key === 'spear') {
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-4, -30, 8, 90);
    ctx.fillStyle = '#c9d6e3';
    ctx.beginPath();
    ctx.moveTo(-14,-30); ctx.lineTo(0,-64); ctx.lineTo(14,-30);
    ctx.fill();
  } else if (key === 'dualdagger') {
    ctx.save();
    ctx.rotate(0.9);
    ctx.fillStyle = '#d94f6a';
    ctx.fillRect(-3, -46, 6, 50);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, 2, 12, 8);
    ctx.restore();
    ctx.save();
    ctx.rotate(-0.9);
    ctx.fillStyle = '#d94f6a';
    ctx.fillRect(-3, -46, 6, 50);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, 2, 12, 8);
    ctx.restore();
  } else if (key === 'greataxe') {
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-4, -18, 8, 82);
    ctx.fillStyle = '#5a6b7a';
    ctx.beginPath();
    ctx.moveTo(-4, -50); ctx.quadraticCurveTo(-40, -46, -34, -14);
    ctx.quadraticCurveTo(-16, -22, -4, -14);
    ctx.quadraticCurveTo(8, -22, 26, -14);
    ctx.quadraticCurveTo(32, -46, -4, -50);
    ctx.fill();
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  ctx.restore();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyR' && state === 'lose') {
    state = 'menu';
  }
  if ((e.code === 'KeyL' || e.code === 'Escape') && overlay) {
    overlay = null;
  }
});

function loop() {
  // A single bad frame must never permanently freeze the game: requestAnimationFrame
  // only reschedules itself if reached, so any thrown error here has to be caught
  // rather than silently stopping every future frame.
  try {
    if (state === 'menu') updateMenu();
    else if (overlay === 'weaponshop') updateWeaponShopOverlay();
    else if (overlay === 'armorshop') updateArmorShopOverlay();
    else if (overlay === 'quest') updateQuestOverlay();
    update();
    render();
  } catch (err) {
    console.error('game loop error:', err);
  }
  requestAnimationFrame(loop);
}
loop();

})();
</script>
</body>
