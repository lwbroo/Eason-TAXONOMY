<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小龍勇士：第一關</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#0a0a14; overflow:hidden;
    font-family:'Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #game-wrap {
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  canvas {
    background:#000;
    image-rendering: pixelated;
    max-width:100vw; max-height:100vh;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  #touch-controls {
    position:absolute;
    display:none;
    align-items:flex-end;
    justify-content:space-between;
    padding:3%; pointer-events:none;
  }
  #touch-controls.active { display:flex; }
  .tc-group { display:flex; gap:10px; pointer-events:auto; }
  .tc-btn {
    width:58px; height:58px; border-radius:50%;
    background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.35);
    color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  .tc-btn:active { background:rgba(255,255,255,0.35); }
  #tc-attack { width:74px; height:74px; background:rgba(255,80,60,0.3); border-color:rgba(255,80,60,0.6); }
  #tc-jump { width:74px; height:74px; background:rgba(80,180,255,0.3); border-color:rgba(80,180,255,0.6); }
  #tc-skill { width:58px; height:58px; background:rgba(120,90,255,0.35); border-color:rgba(150,120,255,0.7); }
  #tc-shield { width:64px; height:64px; background:rgba(80,220,180,0.3); border-color:rgba(80,220,180,0.65); }
  #hint {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,0.55); font-size:12px; letter-spacing:1px; pointer-events:none;
  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hint">←→/A D 移動　空白鍵 跳躍　J 攻擊　K 龍息(FP)　L 舉盾防禦</div>
  <div id="touch-controls">
    <div class="tc-group">
      <div class="tc-btn" id="tc-left">◀</div>
      <div class="tc-btn" id="tc-right">▶</div>
    </div>
    <div class="tc-group">
      <div class="tc-btn" id="tc-skill">龍息</div>
      <div class="tc-btn" id="tc-shield">防禦</div>
      <div class="tc-btn" id="tc-attack">攻擊</div>
      <div class="tc-btn" id="tc-jump">跳</div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GRAVITY = 0.62;
const GROUND_FRICTION = 0.82;

// ---------- Asset loading ----------
const bgImg = new Image();
bgImg.src = 'assets/level1-bg.jpg';
let bgReady = false;
bgImg.onload = () => { bgReady = true; };

// ---------- Input ----------
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// touch controls
function bindTouch(id, code) {
  const el = document.getElementById(id);
  const set = v => e => { e.preventDefault(); keys[code] = v; };
  el.addEventListener('touchstart', set(true), {passive:false});
  el.addEventListener('touchend', set(false), {passive:false});
  el.addEventListener('touchcancel', set(false), {passive:false});
  el.addEventListener('mousedown', set(true));
  el.addEventListener('mouseup', set(false));
  el.addEventListener('mouseleave', set(false));
}
if ('ontouchstart' in window) {
  document.getElementById('touch-controls').classList.add('active');
  document.getElementById('hint').style.display = 'none';
}

// Keep the touch overlay locked to the canvas's actual rendered box (it letterboxes
// on tall phone screens), so the buttons sit over the game instead of the empty margins.
function syncTouchControlsToCanvas() {
  const tc = document.getElementById('touch-controls');
  const rect = canvas.getBoundingClientRect();
  tc.style.left = rect.left + 'px';
  tc.style.top = rect.top + 'px';
  tc.style.width = rect.width + 'px';
  tc.style.height = rect.height + 'px';
}
window.addEventListener('resize', syncTouchControlsToCanvas);
window.addEventListener('orientationchange', syncTouchControlsToCanvas);
syncTouchControlsToCanvas();
bindTouch('tc-left', 'ArrowLeft');
bindTouch('tc-right', 'ArrowRight');
bindTouch('tc-jump', 'Space');
bindTouch('tc-attack', 'KeyJ');
bindTouch('tc-skill', 'KeyK');
bindTouch('tc-shield', 'KeyL');

function pressedOnce(code, state) {
  const now = !!keys[code];
  const was = state.prev;
  state.prev = now;
  return now && !was;
}

// ---------- Weapons ----------
const WEAPONS = {
  sword: {
    name: '直劍', key:'sword',
    dmg: 16, cooldown: 26, staminaCost: 10, range: 46, windup: 5, color:'#c9d6e3',
    desc: '攻擊快，傷害中等', speedRating: 2, dmgRating: 2
  },
  hammer: {
    name: '大錘', key:'hammer',
    dmg: 30, cooldown: 52, staminaCost: 22, range: 50, windup: 14, color:'#9b7653',
    desc: '攻擊慢，傷害最高', speedRating: 1, dmgRating: 3
  },
  spear: {
    name: '長矛', key:'spear',
    dmg: 9, cooldown: 16, staminaCost: 7, range: 62, windup: 3, color:'#c2a15a',
    desc: '攻擊最快，傷害最低', speedRating: 3, dmgRating: 1
  }
};

// ---------- Game state ----------
let state = 'menu'; // menu -> playing -> win -> lose
let selectedWeapon = 'sword';
let levelTimeLeft = 200 * 60; // frames (~200s at 60fps) - a longer map needs more room than the drawing's "1:00"
let frame = 0;

const camera = { x: 0 };
const LEVEL_WIDTH = 5290;
const GROUND_Y = 520;

// Platforms laid out to mirror the drawing: stepped blocks with gaps, a floating
// platform mid-level. The level is two back-to-back copies of the same gap/step
// pattern (validated jumpable with the current jump power), ending at a rocket-ship goal.
const platforms = [
  {x:0,    y:GROUND_Y, w:300, h:80},
  {x:380,  y:GROUND_Y, w:170, h:80},
  {x:640,  y:GROUND_Y, w:210, h:80},
  {x:940,  y:GROUND_Y-40, w:150, h:120},
  {x:1180, y:GROUND_Y-90, w:220, h:170, floating:true},
  {x:1500, y:GROUND_Y, w:230, h:80},
  {x:1830, y:GROUND_Y, w:260, h:80},
  {x:2190, y:GROUND_Y, w:410, h:80},

  {x:2690, y:GROUND_Y, w:300, h:80},
  {x:3070, y:GROUND_Y, w:170, h:80},
  {x:3330, y:GROUND_Y, w:210, h:80},
  {x:3630, y:GROUND_Y-40, w:150, h:120},
  {x:3870, y:GROUND_Y-90, w:220, h:170, floating:true},
  {x:4190, y:GROUND_Y, w:230, h:80},
  {x:4520, y:GROUND_Y, w:260, h:80},
  {x:4880, y:GROUND_Y, w:410, h:80}
];

function groundHeightAt(x) {
  for (const p of platforms) {
    if (x >= p.x && x <= p.x + p.w) return p.y;
  }
  return H + 100;
}

// ---------- Player (small dragon) ----------
const player = {
  x: 60, y: GROUND_Y - 60, w: 40, h: 56,
  vx: 0, vy: 0,
  facing: 1,
  onGround: false,
  hp: 100, maxHp: 100,
  fp: 100, maxFp: 100,
  sta: 100, maxSta: 100,
  attackCooldown: 0,
  attackWindup: 0,
  attacking: false,
  hitThisSwing: false,
  invuln: 0,
  weapon: WEAPONS.sword,
  breathCooldown: 0,
  blocking: false,
  blockFlash: 0,
  dead: false,
  walkCycle: 0
};

// ---------- Enemies ----------
let enemies = [];
function spawnLevel1Enemies() {
  enemies = [
    makeBombBot(700, GROUND_Y),
    makeDrone(1050, GROUND_Y-220),
    makeBombBot(1620, GROUND_Y),
    makeDrone(1950, GROUND_Y-200),
    makeBombBot(2260, GROUND_Y),
    makeDrone(2400, GROUND_Y-180),

    makeBombBot(3390, GROUND_Y),
    makeDrone(3740, GROUND_Y-220),
    makeBombBot(4310, GROUND_Y),
    makeDrone(4640, GROUND_Y-200),
    makeBombBot(4950, GROUND_Y),
    makeDrone(5090, GROUND_Y-180)
  ];
}
function makeBombBot(x, groundY) {
  return {
    type:'bomb', x, y:groundY-40, w:38, h:40, vx:0, vy:0,
    hp:80, maxHp:80, dmg:8, speed:0.55, dir: -1,
    onGround:true, hitFlash:0, exploding:false, explodeTimer:0,
    attackCooldown:0, telegraph:false, attackWindup:0, dead:false, groundY
  };
}
function makeDrone(x, y) {
  return {
    type:'drone', x, y, baseY:y, w:34, h:26, vx:0, vy:0,
    hp:24, maxHp:24, dmg:14, speed:1.6, dir:-1,
    hitFlash:0, attackCooldown:0, dead:false, phase:Math.random()*Math.PI*2,
    dashTimer:0, dashing:false, dashDir:0, charging:false, chargeTimer:0
  };
}

// ---------- Particles (fire breath, hits, explosions) ----------
let particles = [];
function addParticle(p) { particles.push(p); }

// ---------- Weapon select screen ----------
const weaponOrder = ['sword','hammer','spear'];
let menuSelectIndex = 0;

function updateMenu() {
  if (pressedOnce('ArrowLeft', menuKeyState.left) || pressedOnce('KeyA', menuKeyState.left)) {
    menuSelectIndex = (menuSelectIndex + weaponOrder.length - 1) % weaponOrder.length;
  }
  if (pressedOnce('ArrowRight', menuKeyState.right) || pressedOnce('KeyD', menuKeyState.right)) {
    menuSelectIndex = (menuSelectIndex + 1) % weaponOrder.length;
  }
  if (pressedOnce('Space', menuKeyState.space) || pressedOnce('Enter', menuKeyState.enter) || pressedOnce('KeyJ', menuKeyState.j)) {
    startGame(weaponOrder[menuSelectIndex]);
  }
}
const menuKeyState = { left:{}, right:{}, space:{}, enter:{}, j:{} };

canvas.addEventListener('click', (e) => {
  if (state !== 'menu') return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  weaponOrder.forEach((key, i) => {
    const cardX = 90 + i * 280;
    const cardY = 210;
    if (mx > cardX && mx < cardX+240 && my > cardY && my < cardY+300) {
      menuSelectIndex = i;
      startGame(key);
    }
  });
});

function startGame(weaponKey) {
  selectedWeapon = weaponKey;
  player.weapon = WEAPONS[weaponKey];
  player.x = 60; player.y = GROUND_Y-60; player.vx=0; player.vy=0;
  player.hp = player.maxHp; player.fp = player.maxFp; player.sta = player.maxSta;
  player.dead = false;
  player.lastGroundX = player.x;
  player.lastGroundY = player.y;
  camera.x = 0;
  levelTimeLeft = 200*60;
  frame = 0;
  spawnLevel1Enemies();
  particles = [];
  state = 'playing';
}

// ---------- Update: Player ----------
function updatePlayer() {
  if (player.dead) return;

  player.blocking = !!keys['KeyL'] && player.attackWindup === 0 && !player.attacking;

  const speed = player.blocking ? 1.3 : 3.6;
  let moveInput = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) moveInput -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) moveInput += 1;

  if (moveInput !== 0) {
    player.vx += moveInput * 0.9;
    player.facing = moveInput > 0 ? 1 : -1;
    player.walkCycle += 0.25;
  } else {
    player.walkCycle = 0;
  }
  player.vx = Math.max(-speed, Math.min(speed, player.vx));
  player.vx *= player.onGround ? GROUND_FRICTION : 0.95;

  // jump
  if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
    player.vy = -12.4;
    player.onGround = false;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  // clamp to level bounds
  player.x = Math.max(0, Math.min(LEVEL_WIDTH - player.w, player.x));

  // ground collision against platforms (simple: only lands if within platform x-range)
  player.onGround = false;
  for (const p of platforms) {
    const px1 = p.x, px2 = p.x + p.w;
    const feetY = player.y + player.h;
    if (player.x + player.w > px1 + 2 && player.x < px2 - 2) {
      if (feetY >= p.y && feetY - player.vy <= p.y + 4 && player.vy >= 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }
  if (player.onGround) {
    player.lastGroundX = player.x;
    player.lastGroundY = player.y;
  }
  if (player.y > H + 200) {
    // fell into a gap: respawn on the last safe platform with a penalty instead of an outright kill
    player.x = player.lastGroundX;
    player.y = player.lastGroundY;
    player.vx = 0; player.vy = 0;
    player.hp -= 25;
    player.invuln = 60;
  }

  // stamina regen
  if (player.sta < player.maxSta) player.sta = Math.min(player.maxSta, player.sta + 0.35);
  if (player.fp < player.maxFp) player.fp = Math.min(player.maxFp, player.fp + 0.12);

  // attack
  if (player.attackCooldown > 0) player.attackCooldown--;
  if (player.attackWindup > 0) {
    player.attackWindup--;
    if (player.attackWindup === 0) {
      resolveAttackHit();
    }
  }
  if (pressedOnce('KeyJ', playerKeyState.attack) && !player.blocking && player.attackCooldown <= 0 && player.sta >= player.weapon.staminaCost) {
    player.sta -= player.weapon.staminaCost;
    player.attackCooldown = player.weapon.cooldown;
    player.attackWindup = player.weapon.windup;
    player.attacking = true;
    player.hitThisSwing = false;
    setTimeout(()=>{}, 0);
  }
  if (player.attackWindup === 0) player.attacking = false;

  // dragon breath skill
  if (player.breathCooldown > 0) player.breathCooldown--;
  if (keys['KeyK'] && player.fp >= 0.9 && player.breathCooldown <= 0) {
    player.fp -= 0.9;
    if (frame % 3 === 0) {
      addParticle({
        type:'flame',
        x: player.x + player.w/2 + player.facing*20,
        y: player.y + 22,
        vx: player.facing * (5 + Math.random()*2),
        vy: (Math.random()-0.5)*2,
        life: 26, maxLife:26, size: 8+Math.random()*6
      });
    }
    damageEnemiesInBreath();
  }

  if (player.invuln > 0) player.invuln--;
  if (player.blockFlash > 0) player.blockFlash--;

  // camera follow
  const targetCam = Math.max(0, Math.min(LEVEL_WIDTH - W, player.x - W/2));
  camera.x += (targetCam - camera.x) * 0.12;

  if (player.hp <= 0 && !player.dead) {
    player.dead = true;
    setTimeout(()=>{ if (state==='playing') state = 'lose'; }, 600);
  }

  // reach rocket = win
  if (player.x > LEVEL_WIDTH - 160) {
    state = 'win';
  }
}
const playerKeyState = { attack:{} };

// Routes all enemy damage through the shield: blocking cuts damage sharply and
// chips stamina instead, so timing the block against a telegraphed attack matters.
function damagePlayer(amount, invulnFrames) {
  if (player.invuln > 0) return;
  let dmg = amount;
  if (player.blocking) {
    dmg = amount * 0.2;
    player.sta = Math.max(0, player.sta - amount * 0.5);
    player.blockFlash = 10;
  }
  player.hp -= dmg;
  player.invuln = invulnFrames || 45;
}

function attackHitbox() {
  const w = player.weapon;
  const reach = w.range;
  const x = player.facing > 0 ? player.x + player.w : player.x - reach;
  return { x, y: player.y - 6, w: reach, h: player.h + 12 };
}

function resolveAttackHit() {
  const hb = attackHitbox();
  for (const en of enemies) {
    if (en.dead) continue;
    if (rectsOverlap(hb, {x:en.x,y:en.y,w:en.w,h:en.h})) {
      damageEnemy(en, player.weapon.dmg);
    }
  }
}

function damageEnemiesInBreath() {
  const reach = 130;
  const x = player.facing > 0 ? player.x + player.w : player.x - reach;
  const hb = {x, y: player.y - 10, w: reach, h: player.h + 20};
  for (const en of enemies) {
    if (en.dead) continue;
    if (rectsOverlap(hb, {x:en.x,y:en.y,w:en.w,h:en.h})) {
      damageEnemy(en, 0.6);
    }
  }
}

function damageEnemy(en, dmg) {
  en.hp -= dmg;
  en.hitFlash = 8;
  if (en.hp <= 0 && !en.dead) {
    en.dead = true;
    if (en.type === 'bomb') {
      en.exploding = true;
      en.explodeTimer = 30;
    } else {
      for (let i=0;i<10;i++) {
        addParticle({type:'spark', x:en.x+en.w/2, y:en.y+en.h/2,
          vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6-2, life:20,maxLife:20, size:3+Math.random()*3, color:'#7fffb0'});
      }
    }
  }
}

function rectsOverlap(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ---------- Update: Enemies ----------
function updateEnemies() {
  for (const en of enemies) {
    if (en.dead) {
      if (en.type === 'bomb' && en.exploding) {
        en.explodeTimer--;
        if (en.explodeTimer === 6) {
          for (let i=0;i<16;i++) {
            const ang = (Math.PI*2*i)/16;
            addParticle({type:'spark', x:en.x+en.w/2, y:en.y+en.h/2,
              vx:Math.cos(ang)*5, vy:Math.sin(ang)*5, life:22,maxLife:22, size:4+Math.random()*3, color:'#ff9d4d'});
          }
          // damage player if close
          const d = Math.hypot((player.x+player.w/2)-(en.x+en.w/2), (player.y+player.h/2)-(en.y+en.h/2));
          if (d < 90) damagePlayer(14, 40);
        }
      }
      continue;
    }
    if (en.hitFlash > 0) en.hitFlash--;

    if (en.type === 'bomb') {
      // walk back and forth, chase player if close & on similar y - frozen during its telegraph wind-up
      if (!en.telegraph) {
        const dx = player.x - en.x;
        if (Math.abs(dx) < 260 && Math.abs((player.y)-(en.y)) < 80) {
          en.dir = dx > 0 ? 1 : -1;
        } else if (frame % 90 === 0) {
          en.dir *= -1;
        }
        en.x += en.dir * en.speed;
        en.x = Math.max(0, Math.min(LEVEL_WIDTH - en.w, en.x));
      }
      en.y = en.groundY - en.h;

      if (en.attackCooldown > 0) en.attackCooldown--;
      if (!en.telegraph && rectsOverlap(en, player) && en.attackCooldown<=0) {
        en.telegraph = true;
        en.attackWindup = 26; // ~0.43s tell before the hit lands
      }
      if (en.telegraph) {
        en.attackWindup--;
        if (en.attackWindup <= 0) {
          en.telegraph = false;
          en.attackCooldown = 60;
          if (rectsOverlap(en, player)) damagePlayer(en.dmg);
        }
      }
    } else if (en.type === 'drone') {
      en.phase += 0.05;
      const dx = player.x - en.x;
      const dy = player.y - en.y;
      const dist = Math.hypot(dx,dy);

      if (en.charging) {
        en.chargeTimer--;
        if (en.chargeTimer <= 0) {
          en.charging = false;
          en.dashing = true;
          const len = Math.hypot(dx,dy) || 1;
          en.dashDirX = dx/len; en.dashDirY = dy/len;
        }
      } else if (!en.dashing) {
        en.y = en.baseY + Math.sin(en.phase)*14;
        if (dist < 240) {
          en.x += Math.sign(dx) * en.speed * 0.6;
        }
        en.dashTimer++;
        if (en.dashTimer > 110 && dist < 300) {
          en.charging = true;
          en.chargeTimer = 20; // ~0.33s wind-up flash before the dive
          en.dashTimer = 0;
        }
      } else {
        en.x += en.dashDirX * en.speed * 3.2;
        en.y += en.dashDirY * en.speed * 3.2;
        en.dashTimer++;
        if (en.dashTimer > 22) { en.dashing = false; en.dashTimer=0; }
      }
      en.x = Math.max(0, Math.min(LEVEL_WIDTH - en.w, en.x));

      if (en.attackCooldown > 0) en.attackCooldown--;
      if (!en.charging && rectsOverlap(en, player) && en.attackCooldown<=0) {
        damagePlayer(en.dmg);
        en.attackCooldown = en.dashing ? 30 : 50;
      }
    }
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.type === 'flame') p.vy += 0.05;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
}

// ---------- Drawing helpers ----------
function drawBar(x, y, w, h, pct, colorFill, colorBg, label) {
  ctx.fillStyle = colorBg;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = colorFill;
  ctx.fillRect(x, y, w * Math.max(0,pct), h);
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  if (label) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x - 26, y + h/2);
  }
}

function drawHUD() {
  drawBar(56, 16, 180, 16, player.hp/player.maxHp, '#e0453f', 'rgba(60,10,10,0.7)', 'HP');
  drawBar(56, 38, 180, 14, player.fp/player.maxFp, '#3f7fe0', 'rgba(10,20,60,0.7)', 'FP');
  drawBar(56, 58, 180, 12, player.sta/player.maxSta, '#4fd15b', 'rgba(10,40,10,0.7)', '耐力');

  // timer top-right, echoing the "1:00" in the drawing
  const secs = Math.max(0, Math.ceil(levelTimeLeft/60));
  const mm = Math.floor(secs/60), ss = secs%60;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`${mm}:${ss.toString().padStart(2,'0')}`, W-24, 34);
  ctx.textAlign = 'left';

  // weapon indicator
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('武器: ' + player.weapon.name, 56, 90);
}

function drawDragon(p) {
  ctx.save();
  ctx.translate(p.x + p.w/2, p.y + p.h/2);
  ctx.scale(p.facing, 1);
  const bob = p.onGround ? Math.sin(p.walkCycle)*2 : 0;
  ctx.translate(0, bob);

  if (p.invuln > 0 && Math.floor(frame/4)%2===0) ctx.globalAlpha = 0.4;

  // tail
  ctx.fillStyle = '#3fae4a';
  ctx.beginPath();
  ctx.moveTo(-p.w/2, 6);
  ctx.quadraticCurveTo(-p.w/2-16, 12, -p.w/2-22, -2);
  ctx.quadraticCurveTo(-p.w/2-10, 2, -p.w/2, -4);
  ctx.fill();

  // body
  ctx.fillStyle = '#4CC15A';
  roundRect(ctx, -p.w/2+4, -p.h/2+14, p.w-8, p.h-22, 10);
  ctx.fill();

  // belly
  ctx.fillStyle = '#eaf7cf';
  roundRect(ctx, -p.w/2+9, -p.h/2+22, p.w-20, p.h-32, 7);
  ctx.fill();

  // legs
  ctx.fillStyle = '#3fae4a';
  const legSwing = p.onGround ? Math.sin(p.walkCycle)*6 : 0;
  ctx.fillRect(-10, p.h/2-18+legSwing*0.2, 8, 16);
  ctx.fillRect(4, p.h/2-18-legSwing*0.2, 8, 16);

  // head
  ctx.fillStyle = '#4CC15A';
  ctx.beginPath();
  ctx.ellipse(p.w/2-14, -p.h/2+16, 15, 13, 0, 0, Math.PI*2);
  ctx.fill();
  // snout
  ctx.fillStyle = '#4CC15A';
  roundRect(ctx, p.w/2-8, -p.h/2+12, 14, 10, 4);
  ctx.fill();
  // horn
  ctx.fillStyle = '#e8d55a';
  ctx.beginPath();
  ctx.moveTo(p.w/2-4, -p.h/2+4);
  ctx.lineTo(p.w/2+6, -p.h/2-6);
  ctx.lineTo(p.w/2, -p.h/2+6);
  ctx.fill();
  // eye
  ctx.fillStyle = '#20321f';
  ctx.beginPath();
  ctx.arc(p.w/2-10, -p.h/2+14, 2, 0, Math.PI*2);
  ctx.fill();

  ctx.globalAlpha = 1;

  // weapon (holstered while the shield is up)
  if (p.blocking) {
    drawShieldSprite(p);
  } else {
    drawWeaponSprite(p);
  }

  ctx.restore();
}

function drawShieldSprite(p) {
  ctx.save();
  ctx.translate(p.w/2 - 2, 2);
  if (p.blockFlash > 0) {
    ctx.save();
    ctx.globalAlpha = p.blockFlash / 10;
    ctx.strokeStyle = '#dff0ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 18 + (10 - p.blockFlash), 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  roundRect(ctx, -6, -16, 16, 32, 6);
  ctx.fillStyle = '#8a6a3a';
  ctx.fill();
  roundRect(ctx, -3, -12, 10, 24, 4);
  ctx.fillStyle = '#c9d6e3';
  ctx.fill();
  ctx.fillStyle = '#e8d55a';
  ctx.beginPath();
  ctx.arc(2, 0, 3, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawWeaponSprite(p) {
  const w = p.weapon;
  let angle = -0.4;
  if (p.attackWindup > 0) {
    const t = 1 - p.attackWindup / w.windup;
    angle = -0.9 + t * 1.6;
  } else if (p.attacking) {
    angle = 0.7;
  }
  ctx.save();
  ctx.translate(p.w/2-6, -2);
  ctx.rotate(angle);
  if (w.key === 'sword') {
    ctx.fillStyle = '#8a8f99';
    ctx.fillRect(0, -2, 34, 4);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-6, -3, 8, 6);
  } else if (w.key === 'hammer') {
    ctx.fillStyle = '#7a5a3a';
    ctx.fillRect(0, -2, 26, 4);
    ctx.fillStyle = '#6b6f76';
    ctx.fillRect(22, -9, 16, 18);
  } else if (w.key === 'spear') {
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-4, -2, 46, 3);
    ctx.fillStyle = '#c9d6e3';
    ctx.beginPath();
    ctx.moveTo(42, -6); ctx.lineTo(52, 0); ctx.lineTo(42, 6);
    ctx.fill();
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// Pulsing red ring + "!" mark used to telegraph an incoming enemy attack before it lands.
function drawAttackTelegraph(cx, cy, radius) {
  const pulse = 0.5 + 0.5 * Math.sin(frame * 0.9);
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.4 * pulse;
  ctx.strokeStyle = '#ff3b30';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, radius + pulse * 5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#ff3b30';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('!', cx, cy - radius - 10);
  ctx.textAlign = 'left';
}

function drawBombBot(en) {
  if (en.exploding) {
    const warnPct = en.explodeTimer / 30;
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, 14 + (1-warnPct) * 76);
  } else if (en.telegraph) {
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, 22);
  }
  ctx.save();
  ctx.translate(en.x, en.y);
  if (en.hitFlash > 0) ctx.filter = 'brightness(2)';
  // body - round bomb-like robot
  ctx.fillStyle = '#3a3a44';
  ctx.beginPath();
  ctx.arc(en.w/2, en.h/2+4, 17, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#1c1c22';
  ctx.beginPath();
  ctx.arc(en.w/2, en.h/2+4, 17, 0, Math.PI*2);
  ctx.stroke();
  // cross-bolt face like the sketch
  ctx.strokeStyle = '#e8e8ee';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(en.w/2-8, en.h/2-2); ctx.lineTo(en.w/2+8, en.h/2+10);
  ctx.moveTo(en.w/2+8, en.h/2-2); ctx.lineTo(en.w/2-8, en.h/2+10);
  ctx.stroke();
  // fuse
  ctx.strokeStyle = '#c9a24a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(en.w/2, en.h/2-13);
  ctx.quadraticCurveTo(en.w/2+6, en.h/2-22, en.w/2+2, en.h/2-26);
  ctx.stroke();
  ctx.fillStyle = frame%10<5 ? '#ff5a3c' : '#ffcf4a';
  ctx.beginPath();
  ctx.arc(en.w/2+2, en.h/2-27, 3, 0, Math.PI*2);
  ctx.fill();
  // treads
  ctx.fillStyle = '#26262c';
  ctx.fillRect(2, en.h-6, en.w-4, 6);
  ctx.restore();

  // hp bar
  drawEnemyHp(en);
}

function drawDrone(en) {
  if (en.charging) {
    drawAttackTelegraph(en.x + en.w/2, en.y + en.h/2, 20);
  }
  ctx.save();
  ctx.translate(en.x, en.y);
  if (en.hitFlash > 0) ctx.filter = 'brightness(2)';
  if (en.charging) ctx.filter = 'brightness(1.6) saturate(1.4)';
  ctx.fillStyle = '#555c66';
  roundRect(ctx, 4, 4, en.w-8, en.h-10, 4);
  ctx.fill();
  ctx.fillStyle = '#e8453f';
  ctx.beginPath();
  ctx.arc(en.w/2, en.h/2, 3, 0, Math.PI*2);
  ctx.fill();
  // rotor arms
  ctx.strokeStyle = '#2b2f36';
  ctx.lineWidth = 2;
  const spin = (frame*0.9)%(Math.PI*2);
  [[0,0],[en.w,0],[0,en.h-6],[en.w,en.h-6]].forEach(([ax,ay])=>{
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(spin);
    ctx.beginPath();
    ctx.moveTo(-6,0); ctx.lineTo(6,0);
    ctx.stroke();
    ctx.restore();
  });
  ctx.restore();

  drawEnemyHp(en);
}

function drawEnemyHp(en) {
  const bw = en.w;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(en.x, en.y-10, bw, 5);
  ctx.fillStyle = en.type==='bomb' ? '#e0453f' : '#e0453f';
  ctx.fillRect(en.x, en.y-10, bw * Math.max(0,en.hp/en.maxHp), 5);
}

function drawPlatform(p) {
  ctx.fillStyle = p.floating ? 'rgba(230,230,245,0.85)' : 'rgba(235,235,245,0.92)';
  ctx.fillRect(p.x - camera.x, p.y, p.w, H - p.y + 40);
  ctx.strokeStyle = 'rgba(40,40,60,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(p.x - camera.x, p.y, p.w, 4);
}

function drawRocket(x, groundY) {
  ctx.save();
  ctx.translate(x - camera.x, groundY);
  ctx.fillStyle = '#e8e4de';
  roundRect(ctx, -22, -170, 44, 130, 10);
  ctx.fill();
  ctx.fillStyle = '#d4453f';
  ctx.fillRect(-22, -140, 44, 14);
  ctx.fillRect(-22, -100, 44, 14);
  ctx.beginPath();
  ctx.moveTo(-22,-170); ctx.lineTo(0,-210); ctx.lineTo(22,-170);
  ctx.fillStyle = '#d4453f';
  ctx.fill();
  ctx.fillStyle = '#8fb8dd';
  ctx.beginPath();
  ctx.arc(0, -115, 11, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#c9c4bc';
  ctx.beginPath();
  ctx.moveTo(-22,-40); ctx.lineTo(-38,10); ctx.lineTo(-14,-10); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(22,-40); ctx.lineTo(38,10); ctx.lineTo(14,-10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8e4de';
  ctx.fillRect(-16, -40, 32, 40);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    if (p.type === 'flame') {
      const grad = ctx.createRadialGradient(p.x-camera.x, p.y, 0, p.x-camera.x, p.y, p.size);
      grad.addColorStop(0, '#fff2b0');
      grad.addColorStop(0.5, '#ff9d3c');
      grad.addColorStop(1, 'rgba(255,60,20,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x-camera.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = p.color || '#ffdd88';
      ctx.beginPath();
      ctx.arc(p.x-camera.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawBackground() {
  if (bgReady) {
    // parallax: background scrolls slower than camera
    const parX = -camera.x * 0.35;
    const bw = bgImg.width, bh = bgImg.height;
    const scale = H / bh * 1.15;
    const dw = bw * scale, dh = bh * scale;
    let startX = (parX % dw) - dw;
    let tileIndex = Math.round((startX - parX % dw) / dw);
    for (let x = startX; x < W + dw; x += dw, tileIndex++) {
      if (tileIndex % 2 === 0) {
        ctx.drawImage(bgImg, x, (H-dh)/2, dw, dh);
      } else {
        // mirror alternate tiles so the repeat edge lines up instead of showing a hard seam
        ctx.save();
        ctx.translate(x + dw, (H-dh)/2);
        ctx.scale(-1, 1);
        ctx.drawImage(bgImg, 0, 0, dw, dh);
        ctx.restore();
      }
    }
    ctx.fillStyle = 'rgba(10,8,20,0.18)';
    ctx.fillRect(0,0,W,H);
  } else {
    ctx.fillStyle = '#141428';
    ctx.fillRect(0,0,W,H);
  }
}

// ---------- Main update / render ----------
function update() {
  if (state !== 'playing') return;
  frame++;
  levelTimeLeft--;
  if (levelTimeLeft <= 0) { state = 'lose'; }
  updatePlayer();
  updateEnemies();
  updateParticles();
}

function render() {
  ctx.clearRect(0,0,W,H);

  if (state === 'menu') { renderMenu(); return; }

  drawBackground();

  for (const p of platforms) drawPlatform(p);
  drawRocket(LEVEL_WIDTH - 80, GROUND_Y);

  for (const en of enemies) {
    if (en.dead && !(en.type==='bomb' && en.exploding)) continue;
    ctx.save();
    ctx.translate(-camera.x, 0);
    if (en.type === 'bomb') drawBombBot(en);
    else drawDrone(en);
    ctx.restore();
  }

  ctx.save();
  ctx.translate(-camera.x, 0);
  if (!player.dead) drawDragon(player);
  drawParticles();
  ctx.restore();

  drawHUD();

  if (state === 'win') renderOverlay('恭喜過關！', '你成功抵達火箭，飛向下一站！', '#4CC15A');
  if (state === 'lose') renderOverlay('挑戰失敗', '按 R 重新挑戰', '#e0453f');
}

function renderOverlay(title, sub, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.font = 'bold 48px sans-serif';
  ctx.fillText(title, W/2, H/2 - 10);
  ctx.fillStyle = '#fff';
  ctx.font = '18px sans-serif';
  ctx.fillText(sub, W/2, H/2 + 30);
  ctx.textAlign = 'left';
}

function renderMenu() {
  drawBackground();
  ctx.fillStyle = 'rgba(5,5,15,0.55)';
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 40px sans-serif';
  ctx.fillText('小龍勇士', W/2, 90);
  ctx.font = '16px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText('選擇你的武器　－　第一關：紅月遺跡', W/2, 125);

  weaponOrder.forEach((key, i) => {
    const w = WEAPONS[key];
    const x = 90 + i*280, y = 210, cw = 240, ch = 300;
    const selected = i === menuSelectIndex;

    ctx.fillStyle = selected ? 'rgba(76,193,90,0.25)' : 'rgba(255,255,255,0.08)';
    roundRect(ctx, x, y, cw, ch, 14);
    ctx.fill();
    ctx.strokeStyle = selected ? '#4CC15A' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = selected ? 3 : 1.5;
    roundRect(ctx, x, y, cw, ch, 14);
    ctx.stroke();

    // weapon icon
    ctx.save();
    ctx.translate(x+cw/2, y+80);
    drawWeaponIcon(w.key);
    ctx.restore();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(w.name, x+cw/2, y+150);
    ctx.font = '13px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText(w.desc, x+cw/2, y+172);

    // rating bars
    drawRating(x+40, y+200, '速度', w.speedRating, 3, '#4fd15b');
    drawRating(x+40, y+230, '傷害', w.dmgRating, 3, '#e0453f');

    if (selected) {
      ctx.fillStyle = '#4CC15A';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('▶ 已選擇 ◀', x+cw/2, y+270);
    }
  });

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '14px sans-serif';
  ctx.fillText('← → 選擇　　空白鍵 / Enter 確認出發', W/2, H-40);
  ctx.textAlign = 'left';
}

function drawRating(x, y, label, value, max, color) {
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = '12px sans-serif';
  ctx.fillText(label, x, y+9);
  for (let i=0;i<max;i++) {
    ctx.fillStyle = i < value ? color : 'rgba(255,255,255,0.2)';
    ctx.fillRect(x+36+i*16, y, 12, 12);
  }
}

function drawWeaponIcon(key) {
  ctx.save();
  ctx.rotate(-0.5);
  if (key === 'sword') {
    ctx.fillStyle = '#c9d6e3';
    ctx.fillRect(-4, -50, 8, 70);
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-14, 18, 28, 10);
    ctx.fillStyle = '#5a4632';
    ctx.fillRect(-5, 26, 10, 16);
  } else if (key === 'hammer') {
    ctx.fillStyle = '#7a5a3a';
    ctx.fillRect(-4, -20, 8, 70);
    ctx.fillStyle = '#6b6f76';
    ctx.fillRect(-26, -50, 52, 36);
    ctx.strokeStyle = '#3a3a3a';
    ctx.strokeRect(-26,-50,52,36);
  } else if (key === 'spear') {
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-4, -30, 8, 90);
    ctx.fillStyle = '#c9d6e3';
    ctx.beginPath();
    ctx.moveTo(-14,-30); ctx.lineTo(0,-64); ctx.lineTo(14,-30);
    ctx.fill();
  }
  ctx.restore();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyR' && (state === 'lose' || state === 'win')) {
    state = 'menu';
  }
});

function loop() {
  if (state === 'menu') updateMenu();
  update();
  render();
  requestAnimationFrame(loop);
}
loop();

})();
</script>
</body>
</html>
